<html lang="fr" data-theme="light">

<script src="gate.js"></script>
  <meta charset="UTF-8">

  <title>Jeu : Photo Match — Korean Stories</title>
<link rel="canonical" href="https://koreanstories.fr/jeu18.html"/>
<meta name="description" content="Photo Match : observe l'image et choisis le bon mot coréen parmi 27 photos, pour un apprentissage du vocabulaire par le visuel. Jeu Korean Stories."/>
  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#BE185D;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .g-img{width:100%;max-width:300px;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;margin:0 auto 1rem;box-shadow:0 3px 14px rgba(15,30,80,.14);background:var(--s2)}
    .g-q{text-align:center;font-size:.9rem;color:var(--tx-muted);margin-bottom:.6rem}
    .opt{padding:.7rem .9rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.45rem 0;font-size:1.05rem;font-weight:600;background:var(--bg);transition:.15s;text-align:center}
    .opt:hover{border-color:var(--accent-pink)}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.9rem;margin-top:.6rem;min-height:1.2em;line-height:1.5;text-align:center}
    .next{display:block;width:100%;padding:.85rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:var(--accent-pink)}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>

<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Jeu : Photo Match</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Photo Match</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Photo Match</h2>
  <span class="pill">Vocabulaire · 12 photos</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Rejouer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
/* Banque de mots — chaque item : photo, mot coréen, romanisation, sens FR */
const POOL=[
  {img:'img/vocab/resto-samgyeopsal.webp',kr:'삼겹살',rom:'samgyeopsal',fr:'poitrine de porc grillée'},
  {img:'img/vocab/resto-menu.webp',kr:'메뉴',rom:'menyu',fr:'le menu'},
  {img:'img/vocab/resto-epice.webp',kr:'떡볶이',rom:'tteokbokki',fr:'tteokbokki (plat épicé)'},
  {img:'img/vocab/resto-takeout.webp',kr:'포장',rom:'pojang',fr:'à emporter'},
  {img:'img/vocab/transport-metro.webp',kr:'지하철',rom:'jihacheol',fr:'le métro'},
  {img:'img/vocab/transport-taxi.webp',kr:'택시',rom:'taeksi',fr:'le taxi'},
  {img:'img/vocab/transport-station.webp',kr:'역',rom:'yeok',fr:'la station / gare'},
  {img:'img/vocab/loisir-film.webp',kr:'영화',rom:'yeonghwa',fr:'le film'},
  {img:'img/vocab/loisir-cuisine.webp',kr:'요리',rom:'yori',fr:'la cuisine'},
  {img:'img/vocab/loisir-sport.webp',kr:'운동',rom:'undong',fr:'le sport'},
  {img:'img/vocab/loisir-rando.webp',kr:'등산',rom:'deungsan',fr:'la randonnée'},
  {img:'img/vocab/loisir-musique.webp',kr:'음악',rom:'eumak',fr:'la musique'},
  {img:'img/vocab/famille-famille.webp',kr:'가족',rom:'gajok',fr:'la famille'},
  {img:'img/vocab/famille-grandparents.webp',kr:'조부모님',rom:'jobumonim',fr:'les grands-parents'},
  {img:'img/vocab/famille-doctor.webp',kr:'의사',rom:'uisa',fr:'le médecin'},
  {img:'img/vocab/ex5-dress.webp',kr:'드레스',rom:'deureseu',fr:'la robe'},
  {img:'img/vocab/ex5-sky.webp',kr:'하늘',rom:'haneul',fr:'le ciel'},
  {img:'img/vocab/ex5-house.webp',kr:'집',rom:'jip',fr:'la maison'},
  {img:'img/vocab/ex5-coffee.webp',kr:'커피',rom:'keopi',fr:'le café'},
  {img:'img/vocab/ex5-cat.webp',kr:'고양이',rom:'goyangi',fr:'le chat'},
  {img:'img/vocab/ex5-snow.webp',kr:'눈',rom:'nun',fr:'la neige'},
  {img:'img/vocab/ex5-pizza.webp',kr:'피자',rom:'pija',fr:'la pizza'},
  {img:'img/vocab/ex5-bag.webp',kr:'가방',rom:'gabang',fr:'le sac'},
  {img:'img/vocab/ex5-flowers.webp',kr:'꽃',rom:'kkot',fr:'les fleurs'},
  {img:'img/vocab/magasin-shoes.webp',kr:'신발',rom:'sinbal',fr:'les chaussures'},
  {img:'img/vocab/magasin-jacket.webp',kr:'재킷',rom:'jaekit',fr:'la veste'},
  {img:'img/vocab/magasin-store.webp',kr:'백화점',rom:'baekhwajeom',fr:'le grand magasin'}
];
const ROUNDS=12;
let order=[],cur=0,score=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  order=shuffle(POOL.slice()).slice(0,ROUNDS);
  cur=0;score=0;
  document.getElementById('resultArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  render();
}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  /* 3 distracteurs au hasard + la bonne réponse */
  const others=shuffle(POOL.filter(p=>p.kr!==q.kr)).slice(0,3);
  const opts=shuffle([q,...others]);
  let html='<div class="card">';
  html+='<img class="g-img" src="'+q.img+'" alt="vocabulaire" loading="lazy">';
  html+='<div class="g-q">Quel est ce mot en coréen ?</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.kr===q.kr?1:0)+'">'+o.kr+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.innerHTML='✓ <b>'+q.kr+'</b> · '+q.rom+' — '+q.fr;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.innerHTML='✗ La réponse : <b>'+q.kr+'</b> · '+q.rom+' — '+q.fr;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=11?'Parfait ! Ton vocabulaire visuel est au top.':score>=8?'Bien joué — révise les mots ratés et recommence.':'Continue à t\'entraîner, ça rentre vite avec les images !';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_a66',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_a66');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
