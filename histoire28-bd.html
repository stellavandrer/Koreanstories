<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histoire 28 — 찜질방 · BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Noto+Sans+KR:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4ECDC;--ink:#2A2218;--ink-soft:#6B5E48;--gold:#B8924E;--gold-deep:#9A7637;--gold-tint:#FBEFCF;
    --mina:#C06A4B;--joon:#3E6EA8;--hana:#A85B8E;--other:#5B8C7B;--frame:#2A2218;--radius:8px;--shadow:4px 4px 0 rgba(42,34,24,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,serif;-webkit-font-smoothing:antialiased;line-height:1.5;padding-bottom:110px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45;background-image:radial-gradient(rgba(120,95,55,.06) 1px,transparent 1px);background-size:5px 5px}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 14px}

  .progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:transparent}
  .progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#E9C77E,var(--gold))}

  .top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(var(--paper),rgba(244,236,220,.85));backdrop-filter:blur(7px)}
  .top a.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
  .top a.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pill-toggle{min-height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:100px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 12px/1 "Spectral",serif;cursor:pointer;box-shadow:2px 2px 0 rgba(42,34,24,.18)}
  .pill-toggle[aria-pressed="true"]{background:var(--gold-tint)}
  .pill-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .splash{position:relative;margin:8px 0 16px;border:3px solid var(--frame);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:16/10}
  .splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
  .splash::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,22,12,.8),rgba(28,22,12,.15) 45%,transparent 70%)}
  .splash-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
  .splash-badge{display:inline-block;margin-bottom:8px;padding:5px 11px;border-radius:4px;background:var(--gold);color:#fff;font:900 10px/1 "Noto Sans KR",sans-serif;letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--frame);box-shadow:2px 2px 0 rgba(42,34,24,.3)}
  .splash-kr{font-family:"Noto Sans KR",sans-serif;font-weight:900;color:#fff;font-size:36px;line-height:1.05;text-shadow:0 3px 16px rgba(0,0,0,.55)}
  .splash-fr{font-family:"Playfair Display",serif;font-style:italic;color:#F1D9A6;font-size:21px;margin-top:3px;text-shadow:0 2px 12px rgba(0,0,0,.5)}

  .board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .cell{grid-column:span 1;min-width:0}
  .cell.full{grid-column:1 / -1}

  .case{position:relative;border:3px solid var(--frame);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#E9DCC4}
  .case .art{position:absolute;inset:0;background-size:cover;background-position:center}
  .case .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,250,240,.02),rgba(28,22,12,.04) 55%,rgba(28,22,12,.12))}

  .montage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .montage .case{aspect-ratio:1/1}

  .balloon{position:absolute;top:12px;max-width:74%;background:#fff;border:2.5px solid var(--frame);border-radius:20px;padding:9px 13px 10px;box-shadow:3px 3px 0 rgba(42,34,24,.18);z-index:3}
  .case.l .balloon{left:12px}
  .case.r .balloon{right:12px}
  .balloon::before,.balloon::after{content:"";position:absolute;width:0;height:0;border-style:solid}
  .case.l .balloon::before{left:26px;bottom:-19px;border-width:19px 16px 0 0;border-color:var(--frame) transparent transparent transparent}
  .case.l .balloon::after{left:30px;bottom:-13px;border-width:14px 11px 0 0;border-color:#fff transparent transparent transparent}
  .case.r .balloon::before{right:26px;bottom:-19px;border-width:19px 0 0 16px;border-color:var(--frame) transparent transparent transparent}
  .case.r .balloon::after{right:30px;bottom:-13px;border-width:14px 0 0 11px;border-color:#fff transparent transparent transparent}
  .speaker{display:inline-block;white-space:nowrap;font:900 11px/1 "Noto Sans KR",sans-serif;margin-bottom:5px;padding:3px 8px;border-radius:4px;color:#fff}
  .speaker.spk-m{background:var(--mina)}
  .speaker.spk-j{background:var(--joon)}
  .speaker.spk-h{background:var(--hana)}
  .speaker.spk-o{background:var(--other)}
  .kr{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:19px;line-height:1.4;color:var(--ink)}
  .kw{color:var(--gold-deep);font-weight:900;cursor:pointer;border-bottom:2.5px dotted rgba(184,146,78,.6);border-radius:3px;transition:background .15s}
  .kw:hover,.kw:focus-visible{background:var(--gold-tint);outline:none}

  .cell:not(.full) .balloon{top:10px;max-width:92%;padding:6px 9px 7px}
  .cell:not(.full) .case.l .balloon{left:10px}
  .cell:not(.full) .case.r .balloon{right:10px}
  .cell:not(.full) .speaker{font-size:9px;padding:2px 6px;margin-bottom:3px}
  .cell:not(.full) .kr{font-size:13px;line-height:1.25}
  .cell:not(.full) .balloon::before{left:16px} .cell:not(.full) .balloon::after{left:20px}
  .cell:not(.full) .case.r .balloon::before{right:16px;left:auto} .cell:not(.full) .case.r .balloon::after{right:20px;left:auto}
  .cell:not(.full) .audio{width:30px;height:30px;right:9px;bottom:9px}
  .cell:not(.full) .audio svg{width:13px;height:13px}

  .caption{position:absolute;left:13px;bottom:13px;z-index:3;max-width:calc(100% - 74px);background:var(--gold-tint);border:2.5px solid var(--frame);border-radius:4px;padding:7px 11px;box-shadow:3px 3px 0 rgba(42,34,24,.2)}
  .caption .rom{display:block;font-family:"Spectral",serif;font-style:italic;font-size:12px;color:#A08A5E;margin-bottom:2px}
  body.no-rom .caption .rom{display:none}
  .caption .fr{display:block;font-family:"Spectral",serif;font-weight:500;font-size:14.5px;color:var(--ink);line-height:1.3}

  .narr{position:absolute;left:13px;top:13px;z-index:3;max-width:78%;background:var(--gold-tint);border:2.5px solid var(--frame);border-radius:4px;padding:8px 12px;box-shadow:3px 3px 0 rgba(42,34,24,.2);font-family:"Spectral",serif;font-style:italic;font-size:14.5px;color:var(--ink)}

  .tl{margin:7px 3px 0;font-family:"Spectral",serif}
  .tl .rom{display:block;font-style:italic;font-size:11px;color:#A08A5E;line-height:1.25}
  body.no-rom .tl .rom{display:none}
  .tl .fr{display:block;font-size:13px;color:var(--ink-soft);line-height:1.3}
  .tl.center{text-align:center;margin-top:9px}
  .tl.center .fr{font-style:italic;font-size:13.5px}

  .audio{position:absolute;right:13px;bottom:13px;z-index:4;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--frame);background:#fff;cursor:pointer;box-shadow:2px 2px 0 rgba(42,34,24,.22);transition:transform .12s,background .2s}
  .audio svg{width:18px;height:18px;fill:none;stroke:var(--gold-deep);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .audio:hover{background:var(--gold-tint)}
  .audio:active{transform:translate(1px,1px)}
  .audio.on{background:var(--gold)}
  .audio.on svg{stroke:#fff}
  .case.speaking{outline:3px solid var(--gold);outline-offset:-3px}

  .listen-all{display:inline-flex;align-items:center;gap:10px;margin:2px 0 14px;padding:12px 20px;border:3px solid var(--frame);border-radius:100px;cursor:pointer;background:var(--gold);color:#fff;font:900 14px/1 "Noto Sans KR",sans-serif;box-shadow:var(--shadow);transition:transform .12s}
  .listen-all svg{width:16px;height:16px;fill:#fff}
  .listen-all:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(42,34,24,.2)}
  .listen-all.playing{background:var(--paper);color:var(--gold-deep)}
  .listen-all.playing svg{fill:var(--gold-deep)}

  .case{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.34,1.3,.5,1)}
  .case.shown{opacity:1;transform:none}

  .vocab-pop{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);z-index:80;max-width:340px;width:calc(100% - 32px);background:var(--ink);color:#fff;border:3px solid #000;border-radius:12px;padding:14px 16px;box-shadow:5px 5px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
  .vocab-pop.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .vocab-pop .vp-ko{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:18px;color:#F1D9A6}
  .vocab-pop .vp-rom{font-style:italic;font-size:12.5px;color:rgba(255,255,255,.6);margin:2px 0 6px}
  .vocab-pop .vp-fr{font-size:14px}
  .vocab-pop .vp-x{position:absolute;top:7px;right:11px;color:rgba(255,255,255,.6);background:none;border:none;font-size:18px;cursor:pointer}

  .end{text-align:center;margin:30px 0 0;color:var(--gold-deep)}
  .end .ko{font-family:"Noto Sans KR",sans-serif;font-size:24px;font-weight:900}
  .end .sub2{font-family:"Spectral",serif;font-style:italic;color:var(--ink-soft);font-size:14px;margin-top:4px}

  @media (min-width:560px){ .splash-kr{font-size:44px} .kr{font-size:21px} }
  @media (prefers-reduced-motion:reduce){ .case{opacity:1;transform:none;transition:none} *{scroll-behavior:auto!important} }
</style>
</head>

      <div class="cell full">
        <figure class="case" style="aspect-ratio:16/9">
          <div class="art" style="background-image:url(img/stories/h28-est.webp)"></div><div class="veil"></div>
          <div class="narr">Le jjimjilbang : le sauna coréen, ouvert 24h/24, où l'on se détend, on mange et même on dort. Première fois pour Emma…</div>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case l" data-speaker="emma" style="aspect-ratio:4/3">
          <div class="art" style="background-image:url(img/stories/h28-1.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-m">에마 Emma</span><div class="kr">처음이라서 좀 <span class="kw" data-id="tteollida">떨려요</span>. 어떻게 해야 돼요?</div></div>
          <div class="caption"><span class="rom">Cheoeumiraseo jom tteollyeoyo. Eotteoke haeya dwaeyo?</span><span class="fr">C'est ma première fois, je suis un peu stressée. Qu'est-ce qu'il faut faire ?</span></div>
          <button class="audio" data-say="처음이라서 좀 떨려요 어떻게 해야 돼요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case r" data-speaker="jiwoo" style="aspect-ratio:4/3">
          <div class="art" style="background-image:url(img/stories/h28-2.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-j">지우 Ji-woo</span><div class="kr">걱정하지 마세요. 먼저 <span class="kw" data-id="sinbal">신발을 벗</span>고, 그 다음에 옷을 <span class="kw" data-id="garaipda">갈아입어요</span>.</div></div>
          <div class="caption"><span class="rom">Geokjeonghaji maseyo. Meonjeo sinbal-eul beotgo, geu daeume os-eul garaipeoyo.</span><span class="fr">Ne t'inquiète pas. D'abord on enlève les chaussures, puis on se change.</span></div>
          <button class="audio" data-say="걱정하지 마세요 먼저 신발을 벗고 그 다음에 옷을 갈아입어요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case r" data-speaker="sujin" style="aspect-ratio:4/3">
          <div class="art" style="background-image:url(img/stories/h28-3.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-o">직원 Réceptionniste</span><div class="kr">이 옷을 입으세요. 사이즈는 괜찮아요?</div></div>
          <div class="caption"><span class="rom">I os-eul ibeuseyo. Saijeu-neun gwaenchanayo?</span><span class="fr">Mettez ces vêtements. La taille convient ?</span></div>
          <button class="audio" data-say="이 옷을 입으세요 사이즈는 괜찮아요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case l" data-speaker="emma" style="aspect-ratio:4/5">
          <div class="art" style="background-image:url(img/stories/h28-4.webp)"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-m">에마 Emma</span><div class="kr">네, 괜찮아요. 감사합니다.</div></div>
          <div class="caption"><span class="rom">Ne, gwaenchanayo. Gamsahamnida.</span><span class="fr">Oui, ça va. Merci.</span></div>
          <button class="audio" data-say="네 괜찮아요 감사합니다" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case l" data-speaker="emma" style="aspect-ratio:4/3">
          <div class="art" style="background-image:url(img/stories/h28-5.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-m">에마 Emma</span><div class="kr">우와, 정말 <span class="kw" data-id="ttatteut">따뜻해요</span>! 사람들이 다 자고 있어요.</div></div>
          <div class="caption"><span class="rom">Uwa, jeongmal ttatteutaeyo! Saramdeul-i da jago isseoyo.</span><span class="fr">Wow, c'est vraiment chaud ! Tout le monde dort.</span></div>
          <button class="audio" data-say="우와 정말 따뜻해요 사람들이 다 자고 있어요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>

          <div class="art" style="background-image:url(img/stories/h28-6.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-j">지우 Ji-woo</span><div class="kr">맞아요. 한국 사람들은 여기에서 잘 <span class="kw" data-id="swida">쉬어요</span>. 24시간 열어요.</div></div>
          <div class="caption"><span class="rom">Majayo. Hanguk saramdeul-eun yeogi-eseo jal swieoyo. 24sigan yeoreoyo.</span><span class="fr">Oui. Les Coréens viennent ici pour bien se reposer. C'est ouvert 24h/24.</span></div>
          <button class="audio" data-say="맞아요 한국 사람들은 여기에서 잘 쉬어요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case r" data-speaker="jiwoo" style="aspect-ratio:4/3">
          <div class="art" style="background-image:url(img/stories/h28-7.webp);background-position:center 22%"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-j">지우 Ji-woo</span><div class="kr"><span class="kw" data-id="gyeran">계란</span>하고 <span class="kw" data-id="sikhye">식혜</span>를 먹어봐요. 찜질방의 <span class="kw" data-id="jeontong">전통</span>이에요.</div></div>
          <div class="caption"><span class="rom">Gyeran-hago sikhye-reul meogeo bwayo. Jjimjilbang-ui jeontong-iyeyo.</span><span class="fr">Goûte les œufs et le sikhye. C'est la tradition du jjimjilbang.</span></div>
          <button class="audio" data-say="계란하고 식혜를 먹어봐요 찜질방의 전통이에요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>
      <div class="cell full">
        <figure class="case l" data-speaker="emma" style="aspect-ratio:4/5">
          <div class="art" style="background-image:url(img/stories/h28-8.webp)"></div><div class="veil"></div>
          <div class="balloon"><span class="speaker spk-m">에마 Emma</span><div class="kr"><span class="kw" data-id="sikhye">식혜</span>가 정말 맛있네요! 또 마실 수 있어요?</div></div>
          <div class="caption"><span class="rom">Sikhye-ga jeongmal masinneyo! Tto masil su isseoyo?</span><span class="fr">Le sikhye est vraiment délicieux ! Je peux en reprendre ?</span></div>
          <button class="audio" data-say="식혜가 정말 맛있네요 또 마실 수 있어요" aria-label="Écouter"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        </figure>
      </div>

<script>
  var VOCAB={"tteollida": {"ko": "떨리다", "rom": "tteollida", "fr": "trembler, être nerveux"}, "sinbal": {"ko": "신발을 벗다", "rom": "sinbareul beotda", "fr": "enlever ses chaussures"}, "garaipda": {"ko": "옷을 갈아입다", "rom": "oseul garaipda", "fr": "se changer (de vêtements)"}, "ttatteut": {"ko": "따뜻하다", "rom": "ttatteutada", "fr": "être chaud, tiède"}, "swida": {"ko": "쉬다", "rom": "swida", "fr": "se reposer"}, "gyeran": {"ko": "계란", "rom": "gyeran", "fr": "œuf (à la vapeur, au jjimjilbang)"}, "sikhye": {"ko": "식혜", "rom": "sikhye", "fr": "boisson de riz sucrée"}, "jeontong": {"ko": "전통", "rom": "jeontong", "fr": "tradition"}};

  var vMina=null, vJoon=null;
  function pickVoices(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    var ko=vs.filter(function(v){return /ko(-|_)?KR/i.test(v.lang)||/korean|\ud55c\uad6d/i.test(v.name);});
    function find(re){for(var i=0;i<ko.length;i++){if(re.test(ko[i].name))return ko[i];}return null;}
    vMina=find(/yuna|sora|female|\uc5ec\uc131|\uc5ec\uc790|heami|nari|seoyeon|sun-?hi|sunhi/i)||ko[0]||null;
    vJoon=find(/injoon|in-?joon|male|\ub0a8\uc131|\ub0a8\uc790|minjun|dohyun|gyeong|jinho/i)||ko.find(function(v){return v!==vMina;})||ko[0]||null;
  }
  pickVoices();
  if(window.speechSynthesis) speechSynthesis.onvoiceschanged=pickVoices;

  function voiceOf(el){ var c=el&&el.closest('.case'); return c?c.getAttribute('data-speaker'):null; }

  function clearSpk(){document.querySelectorAll('.audio.on').forEach(function(b){b.classList.remove('on');});document.querySelectorAll('.case.speaking').forEach(function(b){b.classList.remove('speaking');});}

  function ttsSpeak(text,btn){
    try{window.speechSynthesis.cancel();}catch(e){}
    var u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=.92;
    var who=voiceOf(btn);
    if(who==='joon'){ u.voice=vJoon||vMina||null; u.pitch=0.8; }
    else if(who==='mina'){ u.voice=vMina||vJoon||null; u.pitch=1.18; }
    else { u.voice=vMina||vJoon||null; u.pitch=1; }
    try{window.speechSynthesis.speak(u);}catch(e){}
    return u;
  }

  function playLine(text,btn,onDone){
    clearSpk();
    var c=btn?btn.closest('.case'):null;
    if(btn){btn.classList.add('on'); if(c)c.classList.add('speaking');}
    var done=function(){ if(btn)btn.classList.remove('on'); if(c)c.classList.remove('speaking'); if(onDone)onDone(); };
    if(typeof window.speak==='function'){
      try{ window.speak(text,btn,{onended:done,onerror:done}); return; }catch(e){}
    }
    var u=ttsSpeak(text,btn); if(u){u.onend=u.onerror=done;} else {done();}
  }

  document.querySelectorAll('.audio').forEach(function(b){b.addEventListener('click',function(){playLine(b.getAttribute('data-say'),b);});});

  var listen=document.getElementById('listenAll'),playing=false;
  listen.addEventListener('click',function(){
    var btns=[].slice.call(document.querySelectorAll('.audio'));
    if(playing){playing=false;try{window.speechSynthesis.cancel();}catch(e){}try{if(window._ksCurrentAudio)window._ksCurrentAudio.pause();}catch(e){}clearSpk();listen.classList.remove('playing');listen.querySelector('.lbl').textContent='Reprendre';return;}
    playing=true;listen.classList.add('playing');listen.querySelector('.lbl').textContent='Lecture…';var i=0;
    (function step(){
      if(!playing)return;
      if(i>=btns.length){playing=false;listen.classList.remove('playing');listen.querySelector('.lbl').textContent='Rejouer la BD';return;}
      var b=btns[i++];b.closest('.case').scrollIntoView({behavior:'smooth',block:'center'});
      playLine(b.getAttribute('data-say'),b,function(){ if(playing)setTimeout(step,450); });
    })();
  });

  var romBtn=document.getElementById('romBtn');
  romBtn.addEventListener('click',function(){var on=romBtn.getAttribute('aria-pressed')==='true';romBtn.setAttribute('aria-pressed',String(!on));document.body.classList.toggle('no-rom',on);});

  var pop=document.getElementById('vocabPop');
  function showVocab(id){var v=VOCAB[id];if(!v)return;document.getElementById('vpKo').textContent=v.ko;document.getElementById('vpRom').textContent=v.rom;document.getElementById('vpFr').textContent=v.fr;pop.classList.add('show');clearTimeout(showVocab._t);showVocab._t=setTimeout(function(){pop.classList.remove('show');},5000);}
  document.querySelectorAll('.kw').forEach(function(k){k.setAttribute('tabindex','0');k.setAttribute('role','button');k.addEventListener('click',function(e){e.stopPropagation();showVocab(k.getAttribute('data-id'));});k.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();showVocab(k.getAttribute('data-id'));}});});
  document.getElementById('vpClose').addEventListener('click',function(){pop.classList.remove('show');});

  var items=[].slice.call(document.querySelectorAll('.case'));
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('shown');io.unobserve(e.target);}});},{threshold:.1});items.forEach(function(t){io.observe(t);});}
  else{items.forEach(function(t){t.classList.add('shown');});}
  setTimeout(function(){items.forEach(function(t){t.classList.add('shown');});},2600);

  var bar=document.getElementById('bar');
  function onScroll(){var h=document.documentElement;var max=h.scrollHeight-h.clientHeight;var p=max>40?Math.min(1,h.scrollTop/max):0;bar.style.width=(p*100)+'%';}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
</script>
  <script src="ks-menu.js" defer></script>
</body>
</html>
