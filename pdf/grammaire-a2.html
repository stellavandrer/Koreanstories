<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0F1B2D;--gold:#B8924E;--green:#16A34A;--bg:#F8F9FC;--surf:#fff;--t:#0D1823;--t2:#475E78;--t3:#8FA5BE;--bd:#DAE3F2}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:60px}
.kr{font-family:'Noto Sans KR',sans-serif;font-weight:500}
.tbar{background:var(--navy);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:#fff}
.logo em{color:var(--gold)}
.tbar-right{display:flex;align-items:center;gap:10px}
.back-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;border:1.5px solid rgba(255,255,255,.2);background:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}
.print-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:100px;background:var(--green);color:#fff;font-size:12px;font-weight:700;cursor:pointer;border:none}
.hero{background:linear-gradient(135deg,var(--navy),#1a3a20);padding:36px 24px 44px;text-align:center;position:relative;overflow:hidden}
.hero-badge{display:inline-block;padding:5px 14px;border-radius:100px;background:rgba(22,163,74,.2);border:1px solid rgba(22,163,74,.35);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4ade80;margin-bottom:16px}
.hero-title{font-family:'Playfair Display',serif;font-size:26px;color:#fff;margin-bottom:10px;line-height:1.3}
.hero-sub{font-size:13px;color:rgba(237,242,250,.55);line-height:1.6;max-width:480px;margin:0 auto}
.hero-meta{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.hero-meta span{font-size:11px;color:rgba(237,242,250,.4);font-weight:600}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px}
.sec{background:#fff;border-radius:16px;border:1px solid var(--bd);box-shadow:0 2px 16px rgba(15,30,80,.06);margin-bottom:20px;overflow:hidden}
.sec-h{background:linear-gradient(135deg,#0d2818,#16402a);padding:14px 20px;display:flex;align-items:center;gap:10px}
.sec-ic{width:32px;height:32px;background:rgba(22,163,74,.2);border:1px solid rgba(22,163,74,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec-ic svg{width:16px;height:16px;stroke:#4ade80;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec-t{font-size:14px;font-weight:700;color:#fff}
.sec-b{padding:20px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--green);color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;text-align:left}
tbody tr:nth-child(even){background:#F0FDF4}
tbody tr:hover{background:#DCFCE7}
td{padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.c1{font-family:'Noto Sans KR',sans-serif;font-size:17px;font-weight:700;color:var(--green)}
p{font-size:14px;color:var(--t2);line-height:1.75;margin-bottom:10px}
p strong{color:var(--t)}
.tip{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:14px 16px;margin:12px 0;font-size:13px;color:var(--t);line-height:1.6}
.tip b{color:var(--green);font-size:10px;display:block;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.formula{background:#0d2818;border-radius:10px;padding:12px 16px;font-family:'Noto Sans KR',sans-serif;font-size:16px;font-weight:700;color:#4ade80;text-align:center;margin:10px 0;letter-spacing:.03em}
.print-tip{display:flex;align-items:center;gap:8px;background:#EEF2FB;border:1px solid #DAE3F2;border-radius:8px;padding:10px 14px;font-size:12px;color:#475E78;margin:12px 24px 0;line-height:1.4}
.print-tip strong{color:#0D1823}
@page{size:A4;margin:12mm 10mm 18mm}
  @media print{
    *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
    .tbar,.ptip,.bk,#dlbtn,.pb{display:none!important}
    body{padding:0;margin:0;background:#fff}
    .hero{background:var(--navy,#0F1B2D)!important}
    .sh{background:var(--navy,#0F1B2D)!important}
    thead th{background:var(--ac,#3B82F6)!important;color:#fff!important}
    .sec{break-inside:avoid;page-break-inside:avoid}
    .wrap{padding:0 8mm}
    a{text-decoration:none;color:inherit}
    @page{size:A4;margin:12mm 10mm 18mm}
  }
  @media print{
    *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
    .tbar,.ptip,.bk,#dlbtn,.pb{display:none!important}
    body{padding:0;margin:0;background:#fff}
    .hero{background:var(--navy,#0F1B2D)!important}
    .sh{background:var(--navy,#0F1B2D)!important}
    thead th{background:var(--ac,#3B82F6)!important;color:#fff!important}
    .sec{break-inside:avoid;page-break-inside:avoid}
    .wrap{padding:0 8mm}
    a{text-decoration:none;color:inherit}
    @page{size:A4;margin:12mm 10mm 18mm}
  }
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{animation:fadeUp .3s ease both}

  .pfoot{display:none}
  @media print{
    .pfoot{display:block;position:fixed;bottom:4mm;left:0;right:0;text-align:center;
      font-size:9pt;color:#888;font-family:'Inter',sans-serif;letter-spacing:.08em}
  }
  </style>
