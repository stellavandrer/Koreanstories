  <meta charset="UTF-8">

  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    h2{color:var(--navy);margin:0 0 .4rem}
    .pill{display:inline-block;background:rgba(124,58,237,.12);color:#7C3AED;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    .xp-badge{background:rgba(124,58,237,.12);color:#7C3AED;padding:.15rem .5rem;border-radius:8px;font-size:.8rem;font-weight:700}
    .btn-done{display:block;width:100%;padding:.9rem;background:#7C3AED;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.2rem}
    .progress-bar{height:6px;background:var(--bd);border-radius:3px;margin:1rem 0}
    .progress-fill{height:100%;background:#7C3AED;border-radius:3px;transition:width .4s}
    .counter{font-size:.82rem;color:var(--tx-muted);text-align:center;margin-bottom:.8rem}
    .flashcard{background:var(--surf);border:2px solid var(--bd);border-radius:20px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;margin:.5rem 0;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
    .flashcard:hover{border-color:#7C3AED;transform:scale(1.01)}
    .flashcard.flipped{background:rgba(124,58,237,.06);border-color:#7C3AED}
    .card-front{text-align:center}
    .card-ko{font-size:1.6rem;font-weight:900;color:#7C3AED;margin-bottom:.4rem}
    .card-hint{font-size:.78rem;color:var(--tx-muted)}
    .card-back{display:none;text-align:center}
    .card-back.show{display:block}
    .card-fr{font-size:1.1rem;font-weight:700;color:var(--tx);margin-bottom:.3rem}
    .card-ex{font-size:.82rem;color:var(--tx-muted);font-style:italic}
    .card-struct{font-size:.78rem;background:rgba(124,58,237,.1);color:#7C3AED;border-radius:8px;padding:.2rem .6rem;display:inline-block;margin-top:.3rem;font-weight:600}
    .tap-hint{font-size:.72rem;color:var(--tx-muted);text-align:center;margin-bottom:.3rem}
    .nav-btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.7rem 0}
    .nav-btn{padding:.6rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:600;background:var(--bg);color:var(--tx)}
    .nav-btn:hover{border-color:#7C3AED;color:#7C3AED}
    .nav-btn.next-btn{background:#7C3AED;color:#fff;border-color:#7C3AED}
    .category-tabs{display:flex;gap:.4rem;overflow-x:auto;margin:.6rem 0;padding-bottom:.2rem}
    .cat-tab{padding:.3rem .8rem;border:1.5px solid var(--bd);border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--tx-muted);background:var(--bg)}
    .cat-tab.active{background:#7C3AED;color:#fff;border-color:#7C3AED}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>

<script defer src="ks-sync.js"></script>
</head>
<body>
  <nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Flashcards B1</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div style="padding:1rem">
  <h2> Flashcards B1</h2>
  <span class="pill">Révision B1</span> <span class="xp-badge">+8 XP</span>
  <p style="color:var(--tx-muted);font-size:.9rem;margin:.5rem 0">Appuyez sur la carte pour révéler la traduction. Naviguez entre les catégories.</p>

  <div class="category-tabs">
    <button class="cat-tab active" onclick="setCategory(0)">Toutes</button>
    <button class="cat-tab" onclick="setCategory(1)">Grammaire</button>
    <button class="cat-tab" onclick="setCategory(2)">Émotions</button>
    <button class="cat-tab" onclick="setCategory(3)">Professionnel</button>
    <button class="cat-tab" onclick="setCategory(4)">Connecteurs</button>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
  <div class="counter" id="cnt">1 / 24</div>

  <div class="tap-hint"> Appuyez pour retourner la carte</div>
  <div class="flashcard" id="fc" onclick="flip()">
    <div class="card-front" id="cf">
      <div class="card-ko" id="cko">Loading...</div>
      <div class="card-hint" id="chi"></div>
    </div>
    <div class="card-back" id="cb">
      <div class="card-fr" id="cfr"></div>
      <div class="card-ex" id="cex"></div>
      <div class="card-struct" id="cst"></div>
    </div>
  </div>

  <div class="nav-btns">
    <button class="nav-btn" onclick="prev()">← Précédent</button>
    <button class="nav-btn next-btn" onclick="next()">Suivant →</button>
  </div>

  <button class="btn-done" id="doneBtn" onclick="completeLesson()">Terminer — +8 XP</button>
</div></main></div>

<script src="ks.js"></script>
<script>
const ALL=[
  {ko:'-는',fr:'(qui) … (présent)',ex:'먹는 사람 = la personne qui mange',st:'Prop. relative',cat:1},
  {ko:'-(으)ㄴ',fr:'(qui) … (passé/adjectif)',ex:'먹은 사람 = la personne qui a mangé',st:'Prop. relative',cat:1},
  {ko:'-(으)ㄹ',fr:'(qui) va … / à …',ex:'먹을 것 = quelque chose à manger',st:'Prop. relative',cat:1},
  {ko:'-다고 하다',fr:'Dire que… (affirmation)',ex:'피곤하다고 했어요',st:'Discours indirect',cat:1},
  {ko:'-자고 하다',fr:'Proposer de… (suggestion)',ex:'같이 가자고 했어요',st:'Discours indirect',cat:1},
  {ko:'-(으)면',fr:'Si… / Quand…',ex:'시간이 있으면 전화해요',st:'Conditionnel',cat:1},
  {ko:'-아/어도',fr:'Même si…',ex:'바빠도 연락해요',st:'Concession',cat:1},
  {ko:'-기 때문에',fr:'Parce que… (formel)',ex:'중요하기 때문에 해야 해요',st:'Cause formelle',cat:1},
  {ko:'-는 바람에',fr:'À cause de… (inattendu, négatif)',ex:'지하철이 늦는 바람에',st:'Cause inattendue',cat:1},
  {ko:'-면서',fr:'En faisant… (simultanéité)',ex:'음악을 들으면서 공부해요',st:'Simultanéité',cat:1},
  {ko:'-자마자',fr:'Dès que…',ex:'집에 오자마자 잤어요',st:'Temporel',cat:1},
  {ko:'-아/어지다',fr:'Devenir… (progressif)',ex:'쉬워졌어요',st:'Changement',cat:1},
  {ko:'설레다',fr:'Être fébrile d\'impatience',ex:'내일 설레요!',st:'Émotion',cat:2},
  {ko:'아쉽다',fr:'C\'est dommage / Regrettable',ex:'아쉽네요...',st:'Émotion',cat:2},
  {ko:'뿌듯하다',fr:'Être fier(e) / Satisfait(e)',ex:'너무 뿌듯해요!',st:'Émotion',cat:2},
  {ko:'당황하다',fr:'Être embarrassé(e)',ex:'많이 당황했어요',st:'Émotion',cat:2},
  {ko:'그립다',fr:'(Qqn/qqch) manquer',ex:'한국이 그리워요',st:'Émotion',cat:2},
  {ko:'알겠습니다',fr:'J\'ai compris (formel)',ex:'네, 알겠습니다',st:'Professionnel',cat:3},
  {ko:'잘 부탁드립니다',fr:'Je compte sur vous',ex:'앞으로 잘 부탁드립니다',st:'Professionnel',cat:3},
  {ko:'수고하세요',fr:'Bon courage / Bonne continuation',ex:'오늘도 수고하세요',st:'Professionnel',cat:3},
  {ko:'처음 뵙겠습니다',fr:'Enchanté(e) (formel)',ex:'처음 뵙겠습니다!',st:'Professionnel',cat:3},
  {ko:'따라서',fr:'Par conséquent (formel)',ex:'따라서 결론은…',st:'Connecteur',cat:4},
  {ko:'반면에',fr:'En revanche / Par contre',ex:'반면에 쉬워요',st:'Connecteur',cat:4},
  {ko:'결국',fr:'Finalement / En fin de compte',ex:'결국 포기했어요',st:'Connecteur',cat:4},
];

let cards=ALL,idx=0,isFlipped=false,currentCat=0;

function setCategory(c){
  currentCat=c;
  cards=c===0?ALL:ALL.filter(x=>x.cat===c);
  idx=0;
  document.querySelectorAll('.cat-tab').forEach((t,i)=>t.classList.toggle('active',i===c));
  render();
}
function render(){
  const c=cards[idx];
  document.getElementById('cko').textContent=c.ko;
  document.getElementById('chi').textContent=' Appuyez pour voir la traduction';
  document.getElementById('cfr').textContent=c.fr;
  document.getElementById('cex').textContent=c.ex;
  document.getElementById('cst').textContent=c.st;
  document.getElementById('cnt').textContent=(idx+1)+' / '+cards.length;
  document.getElementById('pf').style.width=((idx+1)/cards.length*100)+'%';
  const fc=document.getElementById('fc');
  fc.classList.remove('flipped');
  document.getElementById('cf').style.display='flex';
  document.getElementById('cf').style.flexDirection='column';
  document.getElementById('cf').style.alignItems='center';
  document.getElementById('cb').classList.remove('show');
  isFlipped=false;
}
function flip(){
  isFlipped=!isFlipped;
  const fc=document.getElementById('fc');
  fc.classList.toggle('flipped',isFlipped);
  document.getElementById('cb').classList.toggle('show',isFlipped);
  document.getElementById('chi').innerHTML=isFlipped?'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Vu !':' Appuyez pour voir la traduction';
}
function next(){idx=(idx+1)%cards.length;render();}
function prev(){idx=(idx-1+cards.length)%cards.length;render();}

render();

function completeLesson(){if(typeof ksFinish==='function')ksFinish({key:'ks_c24',xp:8});else{if(typeof ksAddXP==='function')ksAddXP(8);if(typeof ksMarkDone==='function')ksMarkDone('ks_c24');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
</body></html>
