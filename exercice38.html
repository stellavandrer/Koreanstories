    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(13,148,136,.12);color:#0D9488;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#5eead4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#0D9488;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}

    .opt:hover{border-color:#0D9488}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D;font-weight:600}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Savoir-faire vs pouvoir</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Savoir-faire vs pouvoir</h1>
  <span class="pill">A2 · 8 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"« Je sais nager » (compétence apprise)",txt:"저는 수영할 ___",opts:["줄 알아요","수 있어요","줄 몰라요"],ans:0,exp:"줄 알다 = savoir-faire, compétence acquise. 수 있다 parlerait plutôt de la possibilité du moment."},
  {fr:"« Je ne peux pas venir demain » (empêchement, pas un manque de compétence)",txt:"내일 ___",opts:["올 수 없어요","올 줄 몰라요","오고 싶어요"],ans:0,exp:"수 없다 = impossibilité de circonstance. 줄 모르다 serait faux : venir n'est pas une compétence qu'on apprend."},
  {fr:"« Je ne sais pas conduire » (jamais appris)",txt:"저는 ___",opts:["운전할 줄 몰라요","운전할 수 없어요","운전 안 해요"],ans:0,exp:"줄 모르다 = compétence jamais acquise. 수 없다 impliquerait plutôt un empêchement ponctuel (ex. permis confisqué)."},
  {fr:"« Tu sais jouer du piano ? » (a-t-elle appris ?)",txt:"피아노 ___?",opts:["칠 줄 알아요","칠 수 있어요","치고 싶어요"],ans:0,exp:"On demande si la personne a appris à jouer, pas si un piano est disponible maintenant."},
  {fr:"« Je ne peux pas t'aider ce soir » (je suis occupé·e)",txt:"오늘 저녁에 ___",opts:["도와줄 수 없어요","도와줄 줄 몰라요","도와주기 싫어요"],ans:0,exp:"수 없다 = empêchement du moment. Aider n'est pas une compétence qu'on apprend ou non."},
  {fr:"« Je sais faire du kimchi » (recette apprise)",txt:"김치를 ___",opts:["만들 줄 알아요","만들 수 있어요","만들고 있어요"],ans:0,exp:"만들 줄 알다 = savoir-faire acquis par apprentissage, exactement comme une recette qu'on maîtrise."},
  {fr:"« Le médecin ne peut pas vous recevoir aujourd'hui » (agenda complet)",txt:"오늘은 ___",opts:["만날 수 없어요","만날 줄 몰라요","만나기 싫어요"],ans:0,exp:"수 없다 = impossibilité liée aux circonstances (agenda). Jamais 줄 모르다 : recevoir des patients est le métier du médecin, pas une compétence en question."},
  {fr:"« Je sais lire le coréen mais je ne sais pas encore écrire »",txt:"한국어를 ___ 아직 쓸 줄 몰라요",opts:["읽을 줄 알지만","읽을 수 있지만","읽고 싶지만"],ans:0,exp:"Lire et écrire sont deux compétences apprises séparément : 줄 알다/모르다 dans les deux cas."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Parfait ! Savoir-faire et pouvoir n\'ont plus de secret pour toi.':score>=5?'Bien — repense à te demander : compétence apprise, ou possibilité du moment ?':'Reprends la leçon « Savoir-faire » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b24f',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_b24f');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
