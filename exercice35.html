  <meta charset="UTF-8">

  <title>Exercice : Voix causative coréenne — Korean Stories</title>
<link rel="canonical" href="https://koreanstories.fr/exercice35.html"/>
<meta name="description" content="Pratique la voix causative coréenne : 먹이다, 입히다, 태우다, le piège de 보이다 et -게 하다, en 8 questions corrigées. Exercice A2."/>
  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(124,58,237,.12);color:#6D28D9;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#c4b5fd}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#7C3AED;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .q-fr{font-size:.82rem;color:var(--tx-muted);margin-bottom:.2rem}
    .q-txt{font-weight:600;font-size:1rem;margin-bottom:.8rem;line-height:1.5}
    .opt{padding:.6rem .85rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.4rem 0;font-size:.92rem;background:var(--bg);transition:.15s}
    .opt:hover{border-color:var(--accent-purple)}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D;font-weight:600}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}
    .next{display:block;width:100%;padding:.85rem;background:#7C3AED;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:var(--accent-purple)}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#7C3AED;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<link rel="apple-touch-icon" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Voix causative</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Voix causative coréenne</h1>
  <span class="pill">A2 · 8 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"« Nourrir le bébé » (faire manger)",txt:"아기한테 밥을 ___",opts:["먹여요","먹혀요","먹어요"],ans:0,exp:"먹다(manger)→먹이다(faire manger) : causatif. 먹혀요 serait le passif (« être mangé »)."},
  {fr:"« Habiller l'enfant »",txt:"아이한테 옷을 ___",opts:["입혀요","입어요","입어져요"],ans:0,exp:"입다(porter)→입히다(habiller qqn) : causatif, on agit SUR l'enfant."},
  {fr:"« Ne fais pas pleurer ton petit frère »",txt:"동생을 ___ 마세요",opts:["울리지","울지","울려지지"],ans:0,exp:"울다(pleurer)→울리다(faire pleurer) : causatif, déclenché par un tiers."},
  {fr:"« Cette personne me fait rire »",txt:"그 사람이 나를 ___",opts:["웃겨요","웃어요","웃겨져요"],ans:0,exp:"웃다(rire)→웃기다(faire rire) : causatif, l'objet 나를 subit l'effet."},
  {fr:"« Faire monter un client dans le taxi »",txt:"택시에 손님을 ___",opts:["태워요","타요","태어요"],ans:0,exp:"타다(monter)→태우다(faire monter, embarquer qqn) : causatif."},
  {fr:"« Cette étoile est visible » (pas d'objet direct → passif)",txt:"저 별이 ___",opts:["보여요","보여줘요","보이게 해요"],ans:0,exp:"보이다 SANS objet direct = passif « être vu ». Avec 을/를, ce serait causatif « montrer »."},
  {fr:"« Montrez votre passeport » (objet direct 을 → causatif)",txt:"여권을 ___",opts:["보여주세요","보여요","보게 해요"],ans:0,exp:"보이다 + 주다 = 보여주다, causatif « montrer », ici avec l'objet direct 여권을."},
  {fr:"« Faire jouer l'enfant dehors » (놀다 n'a pas de suffixe causatif)",txt:"아이를 밖에서 ___",opts:["놀게 해요","놀이다","놀려요"],ans:0,exp:"놀다 n'a pas de forme causative par suffixe → on utilise -게 하다, la formule universelle."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Parfait ! Passif et causatif n\'ont plus de secret pour toi.':score>=5?'Bien — revois le piège de 보이다 (objet direct = causatif).':'Reprends la leçon « Voix causative » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b04g',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_b04g');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
