  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);min-height:100svh;padding-bottom:calc(68px + env(safe-area-inset-bottom));overflow-x:hidden;transition:background .3s,color .3s}
a{text-decoration:none;color:inherit}button{font-family:inherit;border:none;cursor:pointer}
.hero{background:var(--navy);padding:28px 20px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(22,163,74,.1) 0%,transparent 70%);pointer-events:none}
.hero-tag{display:inline-block;padding:4px 12px;border-radius:100px;background:rgba(22,163,74,.18);border:1px solid rgba(22,163,74,.3);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4ade80;margin-bottom:14px}
.hero-title{font-family:'Playfair Display',serif;font-size:24px;color:#fff;margin-bottom:10px;line-height:1.3}
.hero-sub{font-size:13px;color:rgba(237,242,250,.55);line-height:1.6;max-width:360px;margin:0 auto}
.hero-meta{display:flex;justify-content:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.hero-meta span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:rgba(237,242,250,.45)}
.hero-meta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px;animation:fadeUp .3s ease both}
.card{background:var(--surf);border-radius:var(--r);padding:20px;margin-bottom:16px;border:1px solid var(--bd);box-shadow:0 2px 12px rgba(15,30,80,.06)}
.card-title{font-size:13px;font-weight:800;color:var(--t);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:100px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .18s;text-decoration:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),#D4A55A);color:#fff;box-shadow:0 4px 16px rgba(184,146,78,.35)}
.btn-gold:hover{transform:translateY(-1px)}
.btn-row{display:flex;gap:10px;margin-top:18px;justify-content:center;flex-wrap:wrap}
.tip{background:var(--goldbg);border:1px solid var(--goldbd);border-radius:12px;padding:13px 16px;margin:10px 0;font-size:13px;color:var(--t);line-height:1.6}
.tip strong{color:var(--gold)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.q-opt{background:var(--s2);border:1.5px solid var(--bd);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--t);font-weight:500;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.q-opt:hover{border-color:var(--gold);background:var(--goldbg)}
.q-opt.ok{border-color:#16A34A;background:rgba(22,163,74,.08);color:#16A34A}
.q-opt.ko{border-color:#DC2626;background:rgba(220,38,38,.06);color:#DC2626}
.q-feedback{margin-top:10px;font-size:12px;font-weight:600;padding:8px 12px;border-radius:8px}
.q-feedback.ok{background:rgba(22,163,74,.1);color:#16A34A}
.q-feedback.ko{background:rgba(220,38,38,.08);color:#DC2626}
.q-progress{display:flex;gap:5px;margin-bottom:14px}
.q-dot{height:5px;border-radius:3px;flex:1;background:var(--bd2);transition:background .3s}
.q-dot.done{background:var(--gold)}
.badge-a2{display:flex;align-items:center;gap:10px;background:rgba(22,163,74,.1);border:2px solid rgba(22,163,74,.3);border-radius:14px;padding:14px 16px;margin-top:16px}
.badge-a2 .b-ico{width:44px;height:44px;border-radius:50%;background:rgba(22,163,74,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.badge-a2 .b-txt{flex:1}
.badge-a2 .b-title{font-size:14px;font-weight:800;color:#16A34A;margin-bottom:3px}
.badge-a2 .b-sub{font-size:11px;color:var(--t3)}</style>
  <script src="ks.js" defer></script>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<link rel="apple-touch-icon" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="ks-sync.js"></script>
</head>
<body>
<div class="bar">
  <a href="cours.html" class="bar-back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Parcours</a>
  <div class="bar-logo">Korean <em>Stories</em></div>
  <div class="bar-r">
    <button class="bar-theme" onclick="toggleTheme()" aria-label="Thème">
      <span class="ico-l"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>
      <span class="ico-d"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg></span>
    </button>
    <a href="profil.html" class="bar-xp"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span id="xpEl">0</span> XP</a>
  </div>
</div>
<div class="hero">
  <div class="hero-tag">Quiz A2 · Checkpoint Final</div>
  <h1 class="hero-title">Checkpoint A2 Final</h1>
  <p class="hero-sub">10 questions · TOPIK-style · Grammaire + Vocab + Shopping + Voyage · Badge A2</p>
  <div class="hero-meta">
    <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5"/><polyline points="6,3 6,6 8,8"/></svg>~15 min</span>
    <span><svg viewBox="0 0 12 12"><path d="M6 2l1.5 3 3.5.5-2.5 2.5.6 3.5L6 10l-3.1 1.5.6-3.5L1 5.5l3.5-.5z"/></svg>+30 XP</span>
  </div>
</div>
<div class="wrap">
  <div class="card" id="qcard">
    <div class="q-progress" id="prog"><div class="q-dot" id="d0"></div> <div class="q-dot" id="d1"></div> <div class="q-dot" id="d2"></div> <div class="q-dot" id="d3"></div> <div class="q-dot" id="d4"></div> <div class="q-dot" id="d5"></div> <div class="q-dot" id="d6"></div> <div class="q-dot" id="d7"></div> <div class="q-dot" id="d8"></div> <div class="q-dot" id="d9"></div></div>
    <div id="qzone"></div>
  </div>
  <div class="card" id="rcard" style="display:none;text-align:center">
    <div style="font-size:52px;font-weight:800;color:var(--gold)" id="sc">0/10</div>
    <div style="font-size:14px;color:var(--t2);margin:8px 0 16px" id="sm"></div>
    <div class="badge-a2" id="bdg" style="display:none">
      <div class="b-ico">A2</div>
      <div class="b-txt">
        <div class="b-title">Badge A2 Élémentaire débloqué !</div>
        <div class="b-sub">CEFR A2 · TOPIK 2 · Korean Stories certifié</div>
      </div>
    </div>
    <div class="btn-row" style="justify-content:center;margin-top:20px">
      <button class="btn btn-gold" onclick="finish()">Terminer A2 — +30 XP</button>
    </div>
  </div>
</div>
<script>
const QS=[["저는 식당___ 비빔밥___ 먹었어요", ["에서·를", "에·이", "로·를", "에서·은"], 0], ["이 옷 얼마예요? / ___ 비싸요", ["조금", "매우", "아주", "좀"], 3], ["배가 고파___ 밥을 먹어요", ["지만", "서", "니까", "고"], 1], ["한국어가 어렵___ 재미있어요", ["어서", "니까", "지만", "고"], 2], ["예쁜___ 여자를 만났어요", ["가", "는", "이", "(rien)"], 3], ["카드 ___?", ["돼요", "이에요", "있어요", "해요"], 0], ["호텔___ 예약했어요", ["를", "에서", "에", "로"], 0], ["지호가 밥___ 먹___ 커피를 마셔요", ["을·고", "를·지만", "이·어서", "을·니까"], 0], ["어제 제가 천천히 책___ 읽었어요", ["이", "는", "을", "가"], 2], ["서울에 사___ 친구가 왔어요", ["는", "은", "ㄴ", "ㅂ니다"], 0]];
const EX=["에서 = lieu d'action, 를 = objet", "'좀 비싸요' = c'est un peu cher (naturel)", "-아서/-어서 = cause naturelle → résultat", "-지만 = mais (contraste)", "En coréen, l'adjectif précède directement le nom", "카드 돼요? = Vous acceptez la carte ?", "호텔을 예약 — 을/를 = objet de 'réserver'", "를 먹고 = et (puis) — -고 enchaîne les actions", "책을 읽었어요 — 을/를 = objet", "서울에 사는 친구 — relative présent = 는"];
let qi=0,score=0;
function render(){
  if(qi>=QS.length){
    document.getElementById('qcard').style.display='none';
    document.getElementById('rcard').style.display='block';
    document.getElementById('sc').textContent=score+'/'+QS.length;
    const pct=score/QS.length;
    document.getElementById('sm').textContent=pct>=.8?'Excellent ! Tu as validé le niveau A2 !':pct>=.6?'Bien ! Quelques points à revoir avant le B1.':'Continue à pratiquer — révise les particules et conjonctions.';
    if(pct>=.6)document.getElementById('bdg').style.display='flex';
    return;
  }
  const q=QS[qi];
  document.querySelectorAll('.q-dot').forEach((d,i)=>{d.className='q-dot';if(i<qi)d.classList.add('done')});
  document.getElementById('qzone').innerHTML=`<p style="font-size:14px;font-weight:700;color:var(--t);margin-bottom:16px;line-height:1.4">${qi+1}/10 — Complète ou choisis : <span style="color:var(--gold)">${q[0]}</span></p><div style="display:flex;flex-direction:column;gap:8px" id="opts">${q[1].map((o,i)=>`<button class="q-opt" onclick="pick(${i})">${o}</button>`).join('')}</div><div class="q-feedback" id="fb" style="display:none"></div>`;
}
function pick(i){
  const q=QS[qi],btns=document.querySelectorAll('.q-opt');
  btns.forEach(b=>b.disabled=true);
  const ok=i===q[2];if(ok)score++;
  btns[i].classList.add(ok?'ok':'ko');
  btns[q[2]].classList.add('ok');
  const fb=document.getElementById('fb');fb.style.display='block';
  fb.className='q-feedback '+(ok?'ok':'ko');
  fb.innerHTML=(ok?'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> ':'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Réponse : '+q[1][q[2]]+'. ')+EX[qi];
  setTimeout(()=>{qi++;render();},2000);
}
function finish(){
  if(typeof ksAddXP==='function')ksAddXP(30);
  if(typeof ksMarkDone==='function')ksMarkDone('ks_b22');
  setTimeout(()=>window.location.href='cours.html',800);
}
render();
</script>
