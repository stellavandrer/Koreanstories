<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<script>try{if(localStorage.getItem('ks_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<script src="gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exercice : Commander au restaurant — Korean Stories</title>
  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#BE185D;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .q-fr{font-size:.82rem;color:var(--tx-muted);margin-bottom:.2rem}
    .q-txt{font-weight:600;font-size:1rem;margin-bottom:.8rem;line-height:1.5}
    .q-img{width:100%;max-width:240px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;margin:0 auto .8rem;box-shadow:0 2px 10px rgba(15,30,80,.12)}
    .opt{padding:.6rem .85rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.4rem 0;font-size:.92rem;background:var(--bg);transition:.15s}
    .opt:hover{border-color:#DB2777}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D;font-weight:600}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}
    .next{display:block;width:100%;padding:.85rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:#DB2777}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<link rel="apple-touch-icon" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="ks-sync.js"></script>
</head>
<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Commander au restaurant</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Commander au restaurant</h2>
  <span class="pill">A1 · 8 situations</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"Le serveur demande : « Vous êtes combien ? »",txt:"몇 ___이세요?",opts:["분","개","인분","원"],ans:0,exp:"분 = compteur poli pour les personnes."},
  {fr:"Tu veux le menu.",txt:"메뉴 ___",img:"img/vocab/resto-menu.webp",imgAlt:"메뉴 (menu)",opts:["주세요","얼마예요?","있어요"],ans:0,exp:"주세요 = donnez-moi / s'il vous plaît."},
  {fr:"Tu pointes une photo du menu.",txt:"___ 주세요",opts:["이거","여기","포장"],ans:0,exp:"이거 = ceci. « Celui-ci, s'il vous plaît. »"},
  {fr:"Tu commandes 2 portions de samgyeopsal.",txt:"삼겹살 ___ 주세요",img:"img/vocab/resto-samgyeopsal.webp",imgAlt:"삼겹살 (poitrine de porc grillée)",opts:["이 인분","두 명","이 개"],ans:0,exp:"인분 (portion) prend les nombres sino-coréens : 이 인분."},
  {fr:"Tu demandes que ce ne soit pas épicé.",txt:"안 ___ 해 주세요",img:"img/vocab/resto-epice.webp",imgAlt:"맵다 (épicé)",opts:["맵게","매워요","맛있게"],ans:0,exp:"안 맵게 해 주세요 = « faites-le pas épicé »."},
  {fr:"Tu veux savoir le prix.",txt:"___",opts:["얼마예요?","맛있어요","자리 있어요?"],ans:0,exp:"얼마예요? = c'est combien ?"},
  {fr:"À emporter.",txt:"___",img:"img/vocab/resto-takeout.webp",imgAlt:"포장 (à emporter)",opts:["포장이요","여기서 먹어요","계산할게요"],ans:0,exp:"포장 = emballage → à emporter."},
  {fr:"Juste avant de manger, par politesse.",txt:"___",opts:["잘 먹겠습니다","잘 먹었습니다","감사합니다"],ans:0,exp:"잘 먹겠습니다 (avant) · 잘 먹었습니다 (après le repas)."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  if(q.img){html+='<img class="q-img" src="'+q.img+'" alt="'+(q.imgAlt||'')+'" loading="lazy">';}
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(o,q));
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Excellent ! Tu peux commander en Corée.':score>=5?'Bien joué — révise les phrases ratées.':'Reprends la leçon « Au restaurant » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_a61',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_a61');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
