*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Inter','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.tnav-back{display:flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--bd);border-radius:100px;color:var(--gold);font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;transition:all .2s}
.tnav-back:hover{border-color:var(--gold);background:var(--gl)}
.tnav-title{font-family:'Playfair Display',serif;font-size:15px;font-style:italic}
.tnav-xp{font-size:12px;font-weight:700;color:var(--gold);background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.25);padding:5px 12px;border-radius:20px}
.unit-tabs{display:flex;gap:8px;padding:14px 18px;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none}
.unit-tabs::-webkit-scrollbar{display:none}
.utab{flex-shrink:0;padding:7px 14px;border-radius:100px;border:1.5px solid var(--bd);font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .2s;background:none}
.utab.active{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,0.1)}
.hero{padding:20px 18px 8px;text-align:center}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);border-radius:100px;padding:5px 14px;font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.hero h2{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px}
.hero h2 em{color:var(--gold);font-style:italic}
.hero-sub{font-size:13px;color:var(--t2)}
.prog-wrap{padding:12px 18px 0}
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--t2)}
.prog-row strong{color:var(--text)}
.prog-bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s ease}
.quiz-area{padding:20px 18px;max-width:520px;margin:0 auto}
.q-num{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.q-text{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:6px}
.q-kr{font-family:'Noto Sans KR',sans-serif;font-size:36px;font-weight:700;color:var(--gold);text-align:center;padding:20px;background:var(--bg3);border-radius:16px;border:1px solid var(--bd);margin-bottom:20px;cursor:pointer}
.q-kr:hover{background:rgba(201,169,110,0.08)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{padding:15px 18px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg3);font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;text-align:left}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(201,169,110,0.08)}
.opt.correct{border-color:var(--green)!important;background:rgba(34,197,94,0.12)!important;color:var(--green)}
.opt.wrong{border-color:var(--pink)!important;background:rgba(244,114,182,0.12)!important;color:var(--pink)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--green)}
.feedback.ko{background:rgba(244,114,182,0.1);border:1px solid rgba(244,114,182,0.3);color:var(--pink)}
.next-btn{width:100%;margin-top:14px;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#E8C98A);color:#0F1B2D;font-weight:800;font-size:15px;border:none;cursor:pointer;display:none}
.next-btn.show{display:block}
.speak-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.25);border-radius:100px;color:var(--gold);font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer;margin-bottom:16px}
.speak-btn:hover{background:rgba(201,169,110,0.2)}
/* RESULT */
.result-screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:40px 18px;gap:18px}
.result-screen.show{display:flex}
.score-ring{position:relative;width:120px;height:120px}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;color:var(--gold)}
.result-title{font-family:'Playfair Display',serif;font-size:26px}
.result-title em{color:var(--gold);font-style:italic}
.result-sub{font-size:14px;color:var(--t2);max-width:280px;line-height:1.6}
.badge-card{background:linear-gradient(135deg,rgba(201,169,110,0.2),rgba(201,169,110,0.05));border:2px solid rgba(201,169,110,0.4);border-radius:20px;padding:20px 28px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:320px}
.badge-icon{font-size:44px}
.badge-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:var(--gold)}
.badge-desc{font-size:12px;color:var(--t2)}
.xp-pill{display:flex;align-items:center;gap:8px;background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.3);border-radius:100px;padding:10px 20px;font-size:16px;font-weight:800;color:var(--gold)}
.res-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.btn-main{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#E8C98A);color:#0F1B2D;font-weight:800;font-size:15px;border:none;cursor:pointer}
.btn-sec{width:100%;padding:13px;border-radius:14px;background:var(--bg3);border:1.5px solid var(--bd);color:var(--t2);font-weight:600;font-size:14px;cursor:pointer}
.stats-row{display:flex;gap:16px;justify-content:center}
.sstat{text-align:center}
.sstat-val{font-size:24px;font-weight:800}
.sstat-lab{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}

<script>
const QUIZ_DATA = {
  u_d1:{name:'Voyelles',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'Expert Voyelles',questions:[
    {t:'kr',q:'Que signifie cette voyelle ?',kr:'ㅏ',opts:['ah (a)','"eu" fermé','ou','oh'],ans:0,exp:'ㅏ se prononce "a" — comme dans "papa"'},
    {t:'fr',q:'Quelle voyelle coréenne correspond à "ou" ?',opts:['ㅏ','ㅗ','ㅜ','ㅣ'],ans:2,exp:'ㅜ = "ou" — comme dans "loup"'},
    {t:'kr',q:'Que signifie ce mot ?',kr:'우리',opts:['toi','nous','eux','lui'],ans:1,exp:'우리 = nous / notre (mot très fréquent)'},
    {t:'kr',q:'Que signifie ce mot ?',kr:'어디',opts:['quand ?','qui ?','où ?','quoi ?'],ans:2,exp:'어디 = où ? (question très utile !)'},
    {t:'fr',q:'Comment dit-on "enfant" en coréen ?',opts:['이야기','아이','우리','어디'],ans:1,exp:'아이 = enfant — composé de ㅏ + ㅣ'},
    {t:'kr',q:'La voyelle ㅣ se prononce :',kr:'ㅣ',opts:['ou','eu','o','i'],ans:3,exp:'ㅣ = "i" — comme dans "vie"'},
    {t:'fr',q:'Comment dit-on "histoire" en coréen ?',opts:['아이','이야기','어디','우리'],ans:1,exp:'이야기 = histoire / récit'},
    {t:'kr',q:'Que signifie ㅡ ?',kr:'ㅡ',opts:['ou','eu fermé','a','i'],ans:1,exp:'ㅡ = "eu" fermé, pas de lèvres arrondies'},
    {t:'fr',q:'Quelle voyelle correspond à "o" ?',opts:['ㅏ','ㅜ','ㅗ','ㅡ'],ans:2,exp:'ㅗ = "o" — lèvres arrondies, langue en bas'},
    {t:'kr',q:'Que signifie ce mot ?',kr:'아이스크림',opts:['banane','glace','chocolat','gâteau'],ans:1,exp:'아이스크림 = ice cream — mot emprunté à l\'anglais'},
    {t:'fr',q:'ㅐ et ㅔ se prononcent tous les deux :',opts:['"a"','"ou"','"é"','"i"'],ans:2,exp:'ㅐ et ㅔ → "é" — distinction quasi disparue en coréen moderne'},
    {t:'fr',q:'Quelle voyelle est dans le mot 우리 ?',opts:['ㅏ','ㅜ et ㅣ','ㅗ','ㅡ'],ans:1,exp:'우(ㅜ) + 리(ㅣ) = 우리'},
    {t:'kr',q:'Que signifie 오이 ?',kr:'오이',opts:['banane','tomate','concombre','carotte'],ans:2,exp:'오이 = concombre — ㅗ(o) + ㅣ(i)'},
    {t:'fr',q:'Comment prononce-t-on ㅓ ?',opts:['"a"','"ou"','"o"','entre "eu" et "o"'],ans:3,exp:'ㅓ = entre "eu" et "o" — voyelle centrale-ouverte'},
    {t:'fr',q:'Combien y a-t-il de voyelles de base en coréen ?',opts:['6','8','10','21'],ans:2,exp:'Il y a 10 voyelles simples en coréen (dont 8 couramment enseignées en A1)'}
  ]},
  u_d2:{name:'Consonnes ①',badge:'●',badgeName:'Maître consonnes 1',questions:[
    {t:'kr',q:'Que signifie ce mot ?',kr:'가다',opts:['venir','partir','rester','manger'],ans:1,exp:'가다 = aller — verbe de base très fréquent'},
    {t:'kr',q:'Que signifie 나라 ?',kr:'나라',opts:['mer','forêt','pays','ville'],ans:2,exp:'나라 = pays — ex: 한국 = Corée (pays de Han)'},
    {t:'fr',q:'Comment dit-on "eau" en coréen ?',opts:['밥','달','물','눈'],ans:2,exp:'물 = eau — ex: 물 주세요 = de l\'eau svp'},
    {t:'kr',q:'Que signifie 밥 ?',kr:'밥',opts:['riz/repas','pain','soupe','légume'],ans:0,exp:'밥 = riz cuit / repas — mot central de la culture coréenne'},
    {t:'fr',q:'Comment dit-on "chanson" en coréen ?',opts:['나라','노래','마음','다리'],ans:1,exp:'노래 = chanson — norebang = karaoké (chambre de chansons)'},
    {t:'kr',q:'Que signifie 달 ?',kr:'달',opts:['soleil','étoile','lune','ciel'],ans:2,exp:'달 = lune — 달이 밝아요 = la lune est brillante'},
    {t:'fr',q:'Comment dit-on "cœur / esprit" ?',opts:['마음','나무','눈','다리'],ans:0,exp:'마음 = cœur / esprit / âme — ex: 마음이 넓어요 = il a le cœur large'},
    {t:'kr',q:'Que signifie 나무 ?',kr:'나무',opts:['fleur','arbre','herbe','feuille'],ans:1,exp:'나무 = arbre — 나무가 커요 = l\'arbre est grand'},
    {t:'fr',q:'Comment dit-on "bibliothèque" ?',opts:['도서관','라디오','모자','고모'],ans:0,exp:'도서관 = bibliothèque — 도서관에서 공부해요 = j\'étudie à la bibliothèque'},
    {t:'kr',q:'La consonne ㄹ ressemble à quel son français ?',kr:'ㄹ',opts:['l uniquement','r uniquement','entre l et r','d'],ans:2,exp:'ㄹ est entre "l" et "r" — selon sa position dans le mot'},
    {t:'fr',q:'Quelle consonne fait le son "g" ?',opts:['ㄴ','ㅁ','ㄷ','ㄱ'],ans:3,exp:'ㄱ = g/k selon la position — 가다 = aller'},
    {t:'kr',q:'Que signifie 고모 ?',kr:'고모',opts:['oncle','cousine','tante (côté père)','grand-mère'],ans:2,exp:'고모 = tante du côté du père — le coréen distingue très précisément les liens familiaux'},
    {t:'fr',q:'Comment dit-on "ramyeon" (nouilles) ?',opts:['모자','달','라면','눈'],ans:2,exp:'라면 = ramyeon / nouilles instantanées — repas iconique coréen'},
    {t:'kr',q:'눈 peut signifier :',kr:'눈',opts:['pluie et vent','neige et œil','soleil et lune','eau et feu'],ans:1,exp:'눈 = neige (sens 1) ET œil (sens 2) — même orthographe, contexte différent'},
    {t:'fr',q:'Combien de consonnes y a-t-il en coréen ?',opts:['10','14','19','24'],ans:2,exp:'Il y a 19 consonnes en coréen — dont 14 simples et 5 tendues'}
  ]},
  u_a1_6:{name:'Salutations',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'First Contact',questions:[
    {t:'kr',q:'Que signifie cette expression ?',kr:'안녕하세요',opts:['Merci','Bonjour','Au revoir','Excusez-moi'],ans:1,exp:'안녕하세요 = Bonjour (poli) — expression la plus utile en coréen !'},
    {t:'fr',q:'Comment dit-on "merci beaucoup" (très formel) ?',opts:['고맙습니다','반갑습니다','감사합니다','죄송합니다'],ans:2,exp:'감사합니다 = merci beaucoup (formel) — sinogramme 感謝'},
    {t:'kr',q:'Quelle formule dit-on quand ON PART ?',kr:'???',opts:['안녕히 계세요','안녕히 가세요','감사합니다','실례합니다'],ans:1,exp:'안녕히 가세요 = au revoir (dit à celui qui part) — "partez en paix"'},
    {t:'fr',q:'Comment dit-on "enchanté(e)" ?',opts:['감사합니다','죄송합니다','반갑습니다','괜찮아요'],ans:2,exp:'반갑습니다 = enchanté(e) — 반갑다 = être content de voir quelqu\'un'},
    {t:'kr',q:'Que signifie 괜찮아요 ?',kr:'괜찮아요',opts:["Je suis désolé","C'est pas grave/ça va","Merci","Excusez-moi"],ans:1,exp:'괜찮아요 = ça va / ce n\'est pas grave — très polyvalent'},
    {t:'fr',q:'Comment dit-on "désolé(e)" entre amis ?',opts:['죄송합니다','미안해요','실례합니다','감사합니다'],ans:1,exp:'미안해요 = désolé(e) (poli, amical) — 죄송합니다 est plus formel'},
    {t:'kr',q:'네 signifie :',kr:'네',opts:['Non','Peut-être','Oui','Pardon'],ans:2,exp:'네 = oui — 아니요 = non (ne pas confondre !)'},
    {t:'fr',q:'Quelle formule utilise-t-on dans un magasin ?',opts:['안녕히 가세요','처음 뵙겠습니다','어서 오세요','실례합니다'],ans:2,exp:'어서 오세요 = bienvenue ! / entrez ! — expression de commerçant'},
    {t:'kr',q:'Que signifie 실례합니다 ?',kr:'실례합니다',opts:['Merci','Bonjour','Excusez-moi','Au revoir'],ans:2,exp:'실례합니다 = excusez-moi — quand on veut attirer l\'attention poliment'},
    {t:'fr',q:'Comment dit-on "comment allez-vous ?" ?',opts:['몇 살이에요?','잘 지냈어요?','어디 가요?','이름이 뭐예요?'],ans:1,exp:'잘 지냈어요? = comment allez-vous ? / avez-vous bien été ?'},
    {t:'fr',q:'La formule 처음 뵙겠습니다 est utilisée :',opts:['Entre amis','Lors d\'une première rencontre formelle','Au restaurant','Pour partir'],ans:1,exp:'처음 뵙겠습니다 = enchanté (très formel, première rencontre) — 처음 = première fois'},
    {t:'kr',q:'아니요 signifie :',kr:'아니요',opts:['Oui','Merci','Non','Bonjour'],ans:2,exp:'아니요 = non (poli) — 아니 = non (familier)'},
    {t:'fr',q:'Quelle est la différence entre 안녕히 가세요 et 안녕히 계세요 ?',opts:['Matin vs soir','Formel vs informel','Dit à celui qui PART vs à celui qui RESTE','Homme vs femme'],ans:2,exp:'가세요 (partez) → dit à celui qui part ; 계세요 (restez) → dit quand c\'est soi qui part'},
    {t:'fr',q:'Comment dit-on "merci" de façon légèrement moins formelle ?',opts:['감사합니다','고맙습니다','죄송합니다','괜찮아요'],ans:1,exp:'고맙습니다 = merci — un peu moins formel que 감사합니다 mais toujours poli'},
    {t:'fr',q:'Quelle formule utilise-t-on pour s\'excuser d\'être en retard ?',opts:['감사합니다','반갑습니다','죄송합니다','괜찮아요'],ans:2,exp:'죄송합니다 = je suis désolé(e) (formel) — 늦어서 죄송합니다 = désolé d\'être en retard'}
  ]},
  u_a1_7:{name:'Se présenter',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'Premiers pas en coréen',questions:[

    {t:'fr',q:'Comment dit-on "grand frère" (pour une fille) ?',opts:['형','오빠','누나','언니'],ans:1,exp:'오빠 = grand frère (dit par une fille) — 형 est dit par un garçon'},
    {t:'kr',q:'Que signifie 선생님 ?',kr:'선생님',opts:['médecin','professeur','étudiant','cuisinier'],ans:1,exp:'선생님 = professeur — 님 est un suffixe honorifique'},

    {t:'fr',q:'Comment dit-on "grande sœur" (pour un garçon) ?',opts:['언니','누나','오빠','형'],ans:1,exp:'누나 = grande sœur (dit par un garçon) — 언니 est dit par une fille'},
    {t:'kr',q:'저는 프랑스 사람이에요 signifie :',kr:'저는 프랑스 사람이에요',opts:['J\'aime la France','Je vis en France','Je suis français(e)','Je parle français'],ans:2,exp:'사람 = personne — 프랑스 사람 = personne française'},
    {t:'fr',q:'회사원 signifie :',opts:['médecin','étudiant','employé de bureau','cuisinier'],ans:2,exp:'회사원 = employé(e) de bureau — 회사 = entreprise'},
    {t:'kr',q:'몇 살이에요? signifie :',kr:'몇 살이에요?',opts:['Où habitez-vous ?','Quel âge avez-vous ?','Que faites-vous ?','Comment vous appelez-vous ?'],ans:1,exp:'몇 살이에요? = quel âge avez-vous ? — 살 = année (pour l\'âge)'},
    {t:'fr',q:'Comment dit-on "père" de façon formelle ?',opts:['아빠','오빠','아버지','형'],ans:2,exp:'아버지 = père (formel) — 아빠 = papa (familier)'},
    {t:'fr',q:'La structure de base pour se présenter est :',opts:['저는 + 이름 + 이에요/예요','나는 + 직업 + 해요','저 + 이름 + 있어요','이름 + 나는 + 이에요'],ans:0,exp:'저는 [nom] 이에요/예요 — 이에요 après consonne, 예요 après voyelle'},
    {t:'kr',q:'어디 사세요? signifie :',kr:'어디 사세요?',opts:['Que faites-vous ?','Où travaillez-vous ?','Où habitez-vous ?','Combien ça coûte ?'],ans:2,exp:'어디 사세요? = où habitez-vous ? — 살다 = vivre/habiter'},
    {t:'fr',q:'Comment dit-on "je n\'aime pas" ?',opts:['좋아해요','알아요','모르겠어요','싫어해요'],ans:3,exp:'싫어해요 = je n\'aime pas — opposé de 좋아해요'},
    {t:'fr',q:'Quelle est la différence entre 형 et 오빠 ?',opts:['Âge différent','형 = dit par un homme, 오빠 = dit par une femme','Formel vs informel','Nord vs Sud Corée'],ans:1,exp:'형 = grand frère dit par un homme ; 오빠 = grand frère dit par une femme'}
  ]},
  u_a1_9:{name:'Nourriture',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'Gourmet coréen',questions:[
    {t:'kr',q:'Que signifie 주세요 ?',kr:'주세요',opts:["Au revoir","S'il vous plaît / donnez-moi","Merci","Combien ?"],ans:1,exp:'주세요 = s\'il vous plaît / donnez-moi — 주다 = donner'},
    {t:'fr',q:'Comment demande-t-on le prix ?',opts:['있어요?','주세요','얼마예요?','맛있어요?'],ans:2,exp:'얼마예요? = combien ça coûte ? — 얼마 = combien'},
    {t:'kr',q:'맛있어요 signifie :',kr:'맛있어요',opts:["C'est épicé","C'est délicieux","C'est cher","C'est froid"],ans:1,exp:'맛있어요 = c\'est délicieux — 맛 = goût + 있다 = avoir/exister'},
    {t:'fr',q:'Comment dit-on "l\'addition s\'il vous plaît" ?',opts:['물 주세요','메뉴 주세요','계산서 주세요','영수증 주세요'],ans:2,exp:'계산서 주세요 = l\'addition svp — 계산 = calcul'},

    {t:'fr',q:'Quel est ce plat coréen célèbre ?',opts:['김치찌개','비빔밥','떡볶이','냉면'],ans:2,exp:'떡볶이 = gâteaux de riz épicés — plat de rue iconique coréen'},
    {t:'kr',q:'있어요? (à la fin d\'une commande) signifie :',kr:'있어요?',opts:['C\'est bon ?','Est-ce que vous avez... ?','C\'est fini ?','C\'est tout ?'],ans:1,exp:'있어요? = est-ce que vous avez... ? — 있다 = exister/avoir'},
    {t:'fr',q:'Comment dit-on "un, s\'il vous plaît" ?',opts:['일 주세요','하나 주세요','둘 주세요','처음 주세요'],ans:1,exp:'하나 주세요 = un, s\'il vous plaît — hana = 1 en coréen natif'},
    {t:'kr',q:'Que signifie 김치 ?',kr:'김치',opts:['soupe','riz','kimchi','poulpe'],ans:2,exp:'김치 = kimchi — légumes fermentés, accompagnement incontournable'},
    {t:'fr',q:'Comment dit-on "vous avez une réduction ?" ?',opts:['더 주세요','할인 있어요?','싸요?','얼마예요?'],ans:1,exp:'할인 있어요? = vous avez une réduction ? — 할인 = réduction/rabais'},
    {t:'fr',q:'맵지 않아요? signifie :',opts:["C'est délicieux ?","C'est cher ?","Ce n'est pas épicé ?","C'est froid ?"],ans:2,exp:'맵지 않아요? = ce n\'est pas épicé ? — 맵다 = être épicé'},
    {t:'kr',q:'삼겹살 est :',kr:'삼겹살',opts:['soupe de bœuf','poitrine de porc grillée','poulet frit','poisson grillé'],ans:1,exp:'삼겹살 = poitrine de porc grillée — plat coréen par excellence (BBQ)'},
    {t:'fr',q:'냉면est :',opts:['soupe chaude','riz gluant','nouilles froides','purée d\'igname'],ans:2,exp:'냉면 = nouilles froides — 냉 = froid + 면 = nouilles'},
    {t:'fr',q:'Comment dit-on "il n\'y en a pas" ?',opts:['있어요','주세요','없어요','괜찮아요'],ans:2,exp:'없어요 = il n\'y en a pas / je n\'ai pas — 없다 = ne pas exister'},
    {t:'fr',q:'싸요 signifie :',opts:["C'est cher","C'est bon","C'est pas cher","C'est épicé"],ans:2,exp:'싸요 = c\'est bon marché / pas cher — opposé de 비싸요'}
  ]},
  u_a1_10:{name:'Se déplacer',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'Seoul Navigator',questions:[
    {t:'kr',q:'지하철 signifie :',kr:'지하철',opts:['bus','taxi','métro','avion'],ans:2,exp:'지하철 = métro — 지하 = souterrain + 철 = fer/ferrée'},
    {t:'fr',q:'Comment demande-t-on "où est... ?" ?',opts:['얼마예요?','어디예요?','몇 번이에요?','있어요?'],ans:1,exp:'어디예요? = où est... ? — 어디 = où'},
    {t:'kr',q:'왼쪽 signifie :',kr:'왼쪽',opts:['devant','derrière','droite','gauche'],ans:3,exp:'왼쪽 = gauche — 오른쪽 = droite (les retenir ensemble !)'},
    {t:'fr',q:'Comment dit-on "tout droit" ?',opts:['왼쪽','오른쪽','직진','환승'],ans:2,exp:'직진 = tout droit — 직 = direct + 진 = avancer'},
    {t:'kr',q:'환승 signifie :',kr:'환승',opts:['terminus','arrêt','correspondance','départ'],ans:2,exp:'환승 = correspondance / transfert — quand on change de ligne'},
    {t:'fr',q:'Comment dit-on "c\'est loin" ?',opts:['가깝다','멀다','크다','작다'],ans:1,exp:'멀다 = c\'est loin — 가깝다 = c\'est proche (retenir les deux ensemble)'},
    {t:'kr',q:'타다 signifie :',kr:'타다',opts:['descendre','payer','monter/prendre (transport)','attendre'],ans:2,exp:'타다 = monter dans / prendre un transport — 내리다 = descendre'},
    {t:'fr',q:'Comment demande-t-on le numéro de bus ?',opts:['어디예요?','몇 번 버스예요?','얼마예요?','있어요?'],ans:1,exp:'몇 번 버스예요? = c\'est le bus numéro combien ? — 몇 번 = quel numéro ?'},
    {t:'fr',q:'택시 est :',opts:['métro','bus','taxi','tramway'],ans:2,exp:'택시 = taxi — mot emprunté à l\'anglais "taxi"'},
    {t:'kr',q:'가깝다 signifie :',kr:'가깝다',opts:["c'est loin","c'est proche","c'est grand","c'est petit"],ans:1,exp:'가깝다 = c\'est proche / pas loin — ex: 여기서 가까워요 = c\'est proche d\'ici'},
    {t:'fr',q:'Comment dit-on "tournez à droite" ?',opts:['왼쪽으로 가세요','직진하세요','오른쪽으로 가세요','내려가세요'],ans:2,exp:'오른쪽으로 가세요 = tournez à droite — 으로 = vers (direction)'},
    {t:'kr',q:'기차역 signifie :',kr:'기차역',opts:['aéroport','gare','arrêt de bus','port'],ans:1,exp:'기차역 = gare — 기차 = train + 역 = station'},
    {t:'fr',q:'내리다 signifie :',opts:['monter','payer','attendre','descendre'],ans:3,exp:'내리다 = descendre (d\'un bus/métro) — 다음 역에서 내려요 = je descends à la prochaine'},
    {t:'fr',q:'La T-money est :',opts:['une monnaie coréenne','une carte de transport de Séoul','une appli de navigation','un titre de séjour'],ans:1,exp:'T-money = carte rechargeable pour métro, bus et taxi à Séoul'},
    {t:'fr',q:'Comment dit-on "tournez à gauche" ?',opts:['직진하세요','오른쪽으로 가세요','왼쪽으로 가세요','앞으로 가세요'],ans:2,exp:'왼쪽으로 가세요 = tournez à gauche — 왼쪽 = gauche'}
  ]},
  u_a1_11:{name:'Grammaire A1',badge:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',badgeName:'Fondations A1',questions:[
    {t:'fr',q:'En coréen, l\'ordre de base de la phrase est :',opts:['SVO (comme le français)','VSO','SOV','OVS'],ans:2,exp:'SOV = Sujet + Objet + Verbe — ex: 나는 밥을 먹어요 = Je riz mange'},
    {t:'fr',q:'La particule 을/를 indique :',opts:["le sujet","l'objet direct","le lieu","le temps"],ans:1,exp:'을/를 = particule d\'objet — 을 après consonne, 를 après voyelle'},
    {t:'kr',q:'Quelle particule complète cette phrase ? 저___ 학생이에요',kr:'저___ 학생이에요',opts:['이','은/는','을','에'],ans:1,exp:'저는 학생이에요 = je suis étudiant — 은/는 est la particule de thème après 저 (je)'},
    {t:'fr',q:'La particule 에서 indique :',opts:["l'existence dans un lieu","l'action dans un lieu","la destination","la possession"],ans:1,exp:'에서 = lieu d\'action — 카페에서 공부해요 = j\'étudie au café'},
    {t:'kr',q:'Comment nie-t-on 먹어요 ?',kr:'먹어요 → ???',opts:['안 먹어요','없 먹어요','못 먹어요 (impossibilité)','아니 먹어요'],ans:0,exp:'안 먹어요 = je ne mange pas (simple négation) — 안 se place avant le verbe'},
    {t:'fr',q:'La particule 에 (sans 서) indique :',opts:["l'action dans un lieu","la destination / l'existence","l'objet direct","le sujet"],ans:1,exp:'에 = destination ou lieu d\'existence — 학교에 가요 = je vais à l\'école'},
    {t:'kr',q:'이/가 est :',kr:'이/가',opts:['particule de thème','particule de sujet','particule d\'objet','particule de lieu'],ans:1,exp:'이/가 = particule de sujet grammatical — 이 après consonne, 가 après voyelle'},
    {t:'fr',q:'Comment dit-on "il n\'y a pas" / "je n\'ai pas" ?',opts:['있어요','아니에요','없어요','안 해요'],ans:2,exp:'없어요 = il n\'y a pas / je n\'ai pas — 없다 est le verbe d\'inexistence'},
    {t:'fr',q:'Le verbe 하다 au présent poli devient :',opts:['하요','해요','했어요','할 거예요'],ans:1,exp:'하다 → 해요 (présent poli) — règle des verbes en 하다 : drop 다, add 여요 → 해요'},
    {t:'kr',q:'아니에요 signifie :',kr:'아니에요',opts:["Je n'ai pas","Il n'y a pas","Ce n'est pas...","Je ne vais pas"],ans:2,exp:'아니에요 = ce n\'est pas... — 학생이 아니에요 = je ne suis pas étudiant'},
    {t:'fr',q:'La différence entre 은/는 et 이/가 est :',opts:['Aucune différence','은/는 = thème (contraste/généralité) ; 이/가 = sujet grammatical','은/는 = masculin ; 이/가 = féminin','은/는 = oral ; 이/가 = écrit'],ans:1,exp:'은/는 met en valeur le sujet comme thème (contraste) — 이/가 désigne le sujet grammatical simple'},
    {t:'kr',q:'Complétez : 카페___ 공부해요',kr:'카페___ 공부해요',opts:['에서','에','을','는'],ans:0,exp:'카페에서 공부해요 = j\'étudie au café — 에서 = lieu d\'action (on fait quelque chose là)'},
    {t:'fr',q:'먹지 않아요 et 안 먹어요 :',opts:['Signifient des choses différentes','La 1ère est plus formelle','La 2ème est plus formelle','Sont identiques'],ans:1,exp:'먹지 않아요 = forme longue (plus formelle/littéraire) ; 안 먹어요 = forme courte (plus naturelle à l\'oral)'},
    {t:'fr',q:'가요 est la forme polie de :',opts:['가다','오다','하다','있다'],ans:0,exp:'가다 → 가요 (présent poli) — verbe aller, très fréquent'},
    {t:'fr',q:'Pour dire "j\'étudie coréen", on dit :',opts:['저는 한국어를 공부해요','저는 한국어가 공부해요','저는 한국어는 공부해요','저는 한국어에서 공부해요'],ans:0,exp:'한국어를 공부해요 — 를 = particule d\'objet direct (ce qu\'on fait = le coréen)'}
  ]},
  u_a1_12:{name:'Météo',badge:'●',badgeName:'날씨 박사',questions:[
    {t:'kr',q:'날씨가 어때요? signifie :',kr:'날씨가 어때요?',opts:['Il fait beau ?','Quel temps fait-il ?','Il fait chaud ?','Tu vas bien ?'],ans:1,exp:'날씨가 어때요? = quel temps fait-il ? — 날씨 = météo/temps'},
    {t:'fr',q:'Comment dit-on "il pleut" ?',opts:['눈이 와요','바람이 불어요','비가 와요','구름이 와요'],ans:2,exp:'비가 와요 = il pleut — 비 = pluie + 오다 = venir'},
    {t:'kr',q:'더워요 signifie :',kr:'더워요',opts:['Il fait froid','Il fait frais','Il fait chaud','Il fait doux'],ans:2,exp:'더워요 = il fait chaud — 춥다/추워요 = il fait froid (contraire)'},
    {t:'fr',q:'Quel mot signifie "automne" ?',opts:['봄','여름','가을','겨울'],ans:2,exp:'가을 = automne — les 4 saisons : 봄(printemps) 여름(été) 가을(automne) 겨울(hiver)'},
    {t:'kr',q:'눈이 와요 signifie :',kr:'눈이 와요',opts:['Il pleut','Il neige','Il vente','Il fait soleil'],ans:1,exp:'눈이 와요 = il neige — attention : 눈 = aussi "œil" selon le contexte !'},
    {t:'fr',q:'따뜻해요 signifie :',opts:['Il fait froid','Il fait chaud (agréable/doux)','Il est nuageux','Il pleut'],ans:1,exp:'따뜻해요 = il fait doux/chaud (agréable) — ex: 봄에 따뜻해요 = il fait doux au printemps'},
    {t:'kr',q:'여름 signifie :',kr:'여름',opts:['printemps','automne','hiver','été'],ans:3,exp:'여름 = été — 여름 방학 = vacances d\'été'},
    {t:'fr',q:'Comment dit-on "il y a du vent" ?',opts:['비가 와요','눈이 와요','구름이 와요','바람이 불어요'],ans:3,exp:'바람이 불어요 = il y a du vent — 바람 = vent + 불다 = souffler'},

const UNIT_ORDER = ['u_d1','u_d2','u_d3','u_d4','u_d5','u_a1_6','u_a1_7','u_a1_8','u_a1_9','u_a1_10','u_a1_11','u_a1_12','u_a1_13','u_a1_14','u_a1_15'];

let currentUnit = 'u_d1';
let questions = [];
let qIdx = 0;
let score = 0;
let answered = false;
let totalXP = parseInt(localStorage.getItem('ks_prem_quiz_xp')||'0');
let currentKr = '';

function goBack(){
  if(window.parent&&typeof window.parent.closeCPanel==='function'){window.parent.closeCPanel();}
  else{history.back();}
}

function speakCurrent(){
  if(!currentKr)return;
  /* Priorité au système InJoon (ks.js → audio/injoon/*.mp3) */

  if (typeof window.speak === 'function') { window.speak(currentKr); return; }

  const u=new SpeechSynthesisUtterance(currentKr);
  u.lang='ko-KR';u.rate=0.8;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}

function buildTabs(){
  const wrap=document.getElementById('unitTabs');wrap.innerHTML='';
  UNIT_ORDER.forEach(uid=>{
    if(!QUIZ_DATA[uid])return;
    const btn=document.createElement('button');
    btn.className='utab'+(uid===currentUnit?' active':'');
    btn.textContent=QUIZ_DATA[uid].name;
    btn.onclick=()=>startQuiz(uid);
    wrap.appendChild(btn);
  });
}

function startQuiz(uid){
  currentUnit=uid;buildTabs();
  const data=QUIZ_DATA[uid];
  questions=[...data.questions].sort(()=>Math.random()-.5).slice(0,15);
  qIdx=0;score=0;answered=false;
  document.getElementById('unitSub').textContent=data.name+' · '+questions.length+' questions';
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizArea').style.display='block';
  const _xpb=document.getElementById('xpBadge')||document.getElementById('xpEl'); if(_xpb)_xpb.textContent=totalXP+' XP';
  showQuestion();
}

function showQuestion(){
  if(qIdx>=questions.length){showResult();return;}
  const q=questions[qIdx];
  answered=false;
  const pct=Math.round(qIdx/questions.length*100);
  document.getElementById('qNum').textContent=qIdx+1;
  document.getElementById('qTotal').textContent=questions.length;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('qNumLabel').textContent='Question '+(qIdx+1)+' / '+questions.length;
  document.getElementById('scoreLabel').innerHTML=score>0?score+' <svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>':'';
  // Korean display
  currentKr='';
  const krWrap=document.getElementById('qKrWrap');
  if(q.kr){
    currentKr=q.kr;
    document.getElementById('qKr').textContent=q.kr;
    krWrap.style.display='block';
  } else {
    krWrap.style.display='none';
  }
  document.getElementById('qText').textContent=q.q;
  // Options
  const optsEl=document.getElementById('opts');
  optsEl.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=opt;
    btn.onclick=()=>selectAnswer(i,btn,q);
    optsEl.appendChild(btn);
  });
  document.getElementById('feedback').className='feedback';
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').className='next-btn';
}

function selectAnswer(i,btn,q){
  if(answered)return;
  answered=true;
  const correct=q.ans;
  const opts=document.querySelectorAll('.opt');
  opts.forEach(o=>o.disabled=true);
  if(i===correct){
    btn.classList.add('correct');score++;
    const fb=document.getElementById('feedback');
    fb.className='feedback ok show';
    fb.innerHTML='<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Correct ! '+q.exp;
  } else {
    btn.classList.add('wrong');
    opts[correct].classList.add('correct');
    const fb=document.getElementById('feedback');
    fb.className='feedback ko show';
    fb.innerHTML='<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> La bonne réponse était : <strong>'+q.opts[correct]+'</strong><br>'+q.exp;
  }
  qIdx++;
  document.getElementById('nextBtn').className='next-btn show';
}

function nextQuestion(){showQuestion();}

function showResult(){
  document.getElementById('quizArea').style.display='none';
  const total=questions.length;
  const pct=Math.round(score/total*100);
  const xp=score*8;
  totalXP+=xp;
  localStorage.setItem('ks_prem_quiz_xp',totalXP);
  const _xpb=document.getElementById('xpBadge')||document.getElementById('xpEl'); if(_xpb)_xpb.textContent=totalXP+' XP';
  // Animate ring
  setTimeout(()=>{
    const circ=document.getElementById('scoreCircle');
    const offset=314-(314*pct/100);
    circ.style.strokeDashoffset=offset;
    let n=0;const iv=setInterval(()=>{
      n+=2;document.getElementById('scoreVal').textContent=Math.min(n,pct)+'%';
      if(n>=pct)clearInterval(iv);
    },20);
  },200);
  const data=QUIZ_DATA[currentUnit];
  let title,sub;
  if(pct>=90){title='Excellent !';sub='Maîtrise parfaite — tu es prêt(e) pour le niveau suivant !';}
  else if(pct>=80){title='Très bien !';sub='Belle performance — quelques révisions et tu seras parfait(e) !';}
  else if(pct>=60){title='Bien joué !';sub='Bonne base — continue à pratiquer pour consolider !';}
  else{title='Continue !';sub='Pas de découragement — reviens après avoir révisé les leçons !';}
  document.getElementById('resultTitle').innerHTML=title.replace('!','<em>!</em>');
  document.getElementById('resultSub').textContent=sub;
  document.getElementById('statsRow').innerHTML=
    '<div class="sstat"><div class="sstat-val" style="color:var(--green)">'+score+'</div><div class="sstat-lab">Bonnes</div></div>'+
    '<div class="sstat"><div class="sstat-val" style="color:var(--pink)">'+(total-score)+'</div><div class="sstat-lab">Erreurs</div></div>'+
    '<div class="sstat"><div class="sstat-val" style="color:var(--gold)">'+pct+'%</div><div class="sstat-lab">Score</div></div>';
  document.getElementById('xpPill').textContent='+'+xp+' XP gagné !';
  if(pct>=80){
    document.getElementById('badgeCard').style.display='flex';
    document.getElementById('badgeIcon').innerHTML=data.badge||'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
    document.getElementById('badgeName').textContent=data.badgeName||'Badge '+data.name;
  }
  document.getElementById('resultScreen').classList.add('show');
}

function restartQuiz(){startQuiz(currentUnit);}

document.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(window.location.search);
  const u=params.get('u');
  if(u&&QUIZ_DATA[u])currentUnit=u;
  buildTabs();
  startQuiz(currentUnit);
});
</script>

<script>
(function(){
  var SVG_MOON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
  var SVG_SUN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  try{var t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  function sync(){var b=document.getElementById('darkFab');if(!b)return;var d=document.documentElement.getAttribute('data-theme')==='dark';b.innerHTML=d?SVG_SUN:SVG_MOON;b.style.opacity=d?'1':'.7';}
  window.toggleDarkGlobal=function(){var d=document.documentElement.getAttribute('data-theme')==='dark';var t=d?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ks_theme',t);}catch(e){}sync();};
  sync();
})();
</script>
<button id="darkFab" onclick="toggleDarkGlobal()" title="Mode sombre" aria-label="Basculer mode sombre" style="position:fixed;bottom:82px;right:14px;z-index:150;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:all .2s;opacity:.75"></button>


  <script src="ks-menu.js" defer></script>
