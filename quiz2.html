<script>
const rawQuestions = [
  {q:"'Bonjour' (formel) en coréen ?", ans:["안녕하세요","안녕","여보세요","반가워요"], expl:"안녕하세요 = bonjour formel. Utilisé avec tout inconnu ou supérieur."},
  {q:"'Merci' en coréen ?", ans:["감사합니다","미안해요","괜찮아요","주세요"], expl:"감사합니다 = merci (formel). 고마워요 = merci (informel)."},
  {q:"Comment dit-on 'Je m'appelle Emma' ?", ans:["저는 엠마예요","나는 엠마야","엠마 이에요","제 이름 엠마"], expl:"저는 [nom]이에요/예요 = formule standard de présentation."},
  {q:"Que signifie 반가워요 ?", ans:["Enchanté(e)","Merci","Au revoir","Bonjour"], expl:"반가워요 = enchanté(e) de vous rencontrer."},
  {q:"'Au revoir' à quelqu'un qui PART en coréen ?", ans:["안녕히 가세요","안녕히 계세요","잘 가요","바이바이"], expl:"안녕히 가세요 = partez en paix (à qui part). 계세요 = restez en paix (à qui reste)."},
  {q:"Sino-coréen pour '3' ?", ans:["삼","셋","세","서"], expl:"삼 = 3 en sino-coréen (pour prix, dates, étages...)."},
  {q:"Natif coréen pour '2' ?", ans:["둘","이","두개","둘째"], expl:"둘 = 2 en natif coréen (pour âge, objets...). Mais 두 devant un compteur."},
  {q:"Comment dit-on l'âge '25 ans' ?", ans:["스물다섯 살","이십오 살","스물다섯 해","이오 살"], expl:"L'âge utilise le système natif : 스물다섯 살."},
  {q:"Que signifie 엄마 ?", ans:["Maman","Papa","Grand-mère","Sœur aînée"], expl:"엄마 = maman (informel). 어머니 = mère (formel)."},
  {q:"'Grande sœur aînée' (pour un garçon) ?", ans:["누나","언니","오빠","형"], expl:"누나 = grande sœur (d'un frère). 언니 = grande sœur (d'une sœur)."},
  {q:"'Rouge' en coréen (adjectif) ?", ans:["빨갛다","파랗다","노랗다","하얗다"], expl:"빨갛다 = être rouge. Forme conjuguée : 빨개요."},
  {q:"Que signifie 맛있어요 ?", ans:["C'est délicieux","C'est épicé","J'ai faim","Je mange"], expl:"맛있어요 = c'est délicieux. 맛없어요 = sans goût."},
  {q:"'Boulangerie' en coréen ?", ans:["빵집","카페","식당","편의점"], expl:"빵집 = boulangerie (빵 = pain + 집 = maison/lieu)."},
  {q:"Particule de direction 'vers' ?", ans:["으로/로","에서","이/가","을/를"], expl:"으로/로 = vers, en direction de. Ex: 왼쪽으로 = vers la gauche."},
  {q:"'Je ne peux pas manger' (incapacité) ?", ans:["못 먹어요","안 먹어요","먹지 않아요","안 먹을 거예요"], expl:"못 = impossibilité (capacité). 안 = refus/habitude."},
  {q:"'Où' en coréen ?", ans:["어디","언제","뭐","왜"], expl:"어디 = où. Les 7 mots interrogatifs : 뭐 어디 언제 왜 어떻게 누구 얼마나"},
  {q:"'Comment' en coréen ?", ans:["어떻게","어디","언제","왜"], expl:"어떻게 = comment. Ex: 어떻게 가요? = Comment y aller ?"},
  {q:"가다 au passé formel ?", ans:["갔어요","갔습니다","가요","갈 거예요"], expl:"가다 → 갔어요 (passé informel-poli). 갔습니다 = passé formel."},
  {q:"먹다 au futur ?", ans:["먹을 거예요","먹겠어요","먹었어요","먹어요"], expl:"먹다 → 먹을 거예요 (futur probable). 먹겠어요 = intention forte."},
  {q:"Que signifie 지하철 ?", ans:["Métro","Bus","Taxi","Train"], expl:"지하철 = métro (lit. 'fer souterrain'). 지하 = souterrain, 철 = fer."},
  {q:"'Sortie' dans un bâtiment/métro ?", ans:["출구","입구","환승","승강장"], expl:"출구 = sortie (출 = sortir, 구 = bouche/ouverture). 입구 = entrée."},
  {q:"'Devant' en coréen ?", ans:["앞","뒤","위","아래"], expl:"앞 = devant. 뒤 = derrière. 위 = haut. 아래 = bas."},
  {q:"치맥 = ?", ans:["Poulet frit + bière","Riz + kimchi","Nouilles + soupe","Viande + légumes"], expl:"치맥 = 치킨(chicken) + 맥주(bière). Combo national coréen !"},
  {q:"Que signifie 배달 ?", ans:["Livraison","Cuisson","Restaurant","Commande"], expl:"배달 = livraison. La culture delivery est très développée en Corée."},
  {q:"'S'il vous plaît' (en donnant quelque chose) ?", ans:["여기 있어요","주세요","괜찮아요","됐어요"], expl:"여기 있어요 = voilà (en tendant quelque chose). 주세요 = donnez-moi s.v.p."},
  {q:"Quel système pour les heures ?", ans:["Natif coréen","Sino-coréen","Les deux","Aucun des deux"], expl:"Heures → natif (하나 시, 두 시...). Minutes → sino (삼십 분...)."},
  {q:"'Combien ça coûte ?' en coréen ?", ans:["얼마예요?","어디예요?","뭐예요?","언제예요?"], expl:"얼마예요? = combien ça coûte ? 얼마 = combien (prix)."},
  {q:"Que signifie 한국 ?", ans:["Corée","Séoul","Hangeul","Coréen (langue)"], expl:"한국 = Corée du Sud. 한국어 = langue coréenne. 한국인 = Coréen."},
  {q:"'Non' en coréen ?", ans:["아니요","네","맞아요","괜찮아요"], expl:"아니요 = non (formel). 아니 = non (informel)."},
  {q:"'Je ne sais pas' en coréen ?", ans:["모르겠어요","알아요","괜찮아요","없어요"], expl:"모르겠어요 = je ne sais pas. 알아요 = je sais."},
  {q:"'Hôpital' en coréen ?", ans:["병원","학교","카페","공항"], expl:"병원 = hôpital. 학교 = école. 카페 = café. 공항 = aéroport."},
  {q:"Famille : 할머니 = ?", ans:["Grand-mère","Grand-père","Tante","Belle-mère"], expl:"할머니 = grand-mère. 할아버지 = grand-père."},
  {q:"'J'aime le kimchi' en coréen ?", ans:["저는 김치를 좋아해요","저는 김치가 싫어요","김치를 먹어요","김치 있어요"], expl:"좋아해요 = j'aime. 싫어요 = je n'aime pas."},
  {q:"Que dit-on AVANT de manger ?", ans:["잘 먹겠습니다","잘 먹었습니다","감사합니다","안녕하세요"], expl:"잘 먹겠습니다 = je vais bien manger (avant). 잘 먹었습니다 = j'ai bien mangé (après)."},
  {q:"'Beau/Belle' en coréen ?", ans:["예뻐요","무서워요","슬퍼요","작아요"], expl:"예뻐요 = c'est beau/joli. 잘생겼어요 = beau (pour un homme)."},
  {q:"'Station de métro' en coréen ?", ans:["지하철역","버스 정류장","공항","기차역"], expl:"지하철역 = station de métro. 역 = gare/station."},
  {q:"'Allons-y !' en coréen ?", ans:["가자!","가요!","갑시다!","가세요!"], expl:"가자! = allons-y ! (informel). 갑시다! = allons-y (formel/groupe)."},
  {q:"Que signifie 괜찮아요 ?", ans:["Ça va / C'est OK","Merci","Bonjour","Au revoir"], expl:"괜찮아요 = ça va, c'est OK, pas de problème. Très polyvalent !"},
  {q:"'Eau' en coréen ?", ans:["물","밥","국","차"], expl:"물 = eau. 밥 = riz cuit. 국 = soupe. 차 = thé."},
  {q:"Niveau A1 terminé ! Tu mérites ton badge. Lequel ?", ans:[`<svg viewBox="0 0 24 24" style="width:13px;height:13px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M6 9H4a2 2 0 01-2-2V5h4"/><path d="M18 9h2a2 2 0 002-2V5h-4"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="M6 2h12v7a6 6 0 01-12 0V2z"/></svg> Badge A1`,`<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Badge Débutant`,`<svg viewBox="0 0 24 24" style="width:13px;height:13px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Badge Parcours`,`<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Badge TOPIK`], expl:"Félicitations ! Tu as validé le niveau A1 de Korean Stories !"}
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareQuestions() {
  return rawQuestions.map(q => {
    const correct = q.ans[0];
    const shuffled = shuffle(q.ans);
    return { ...q, correct, shuffledAns: shuffled };
  });
}

let questions = prepareQuestions();
let current = 0;
let score = 0;
let answered = 0;
const TOTAL = 40;

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qNum').textContent = `Question ${current + 1} / ${TOTAL}`;
  document.getElementById('liveScore').textContent = `${score} / ${answered}`;
  const pct = Math.round((current / TOTAL) * 100);
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progLabel').textContent = pct + '%';
  document.getElementById('qText').textContent = q.q;

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.shuffledAns.forEach(ans => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = ans;   /* ans peut contenir une icône SVG (ex. choix du badge) */
    btn._ans = ans;        /* identité fiable : textContent perdrait le SVG */
    btn.onclick = () => selectAnswer(ans, btn, q);
    choicesEl.appendChild(btn);
  });

  document.getElementById('expl').className = 'expl';
  document.getElementById('expl').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
}

function selectAnswer(ans, btn, q) {
  answered++;
  const allBtns = document.querySelectorAll('.choice');
  allBtns.forEach(b => b.disabled = true);

  if (ans === q.correct) {
    btn.classList.add('correct');
    score++;
    const expl = document.getElementById('expl');
    expl.className = 'expl ok';
    expl.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> ' + q.expl;
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if (b._ans === q.correct) b.classList.add('correct'); });
    const expl = document.getElementById('expl');
    expl.className = 'expl ko';
    expl.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ' + q.expl;
  }

  document.getElementById('liveScore').textContent = `${score} / ${answered}`;
  /* La barre d'avancement progresse dès la réponse (sinon « 1/1 » côtoie
     « 0% » et se lit comme un score nul) */
  const donePct = Math.round(((current + 1) / TOTAL) * 100);
  document.getElementById('progBar').style.width = donePct + '%';
  document.getElementById('progLabel').textContent = donePct + '%';
  document.getElementById('nextBtn').style.display = 'flex';
}

function nextQuestion() {
  current++;
  if (current >= TOTAL) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  const screen = document.getElementById('successScreen');
  screen.classList.add('show');
  document.getElementById('finalScore').textContent = score;

  try {
    localStorage.setItem('ks_a30', '1');
    localStorage.setItem('ks_a30_score', score);
  } catch(e) {}

  let badgeHTML = '';
  let msg = '';
  let sub = '';
  let stars = '';

  if (score < 20) {
    msg = "Continue, tu progresses ! ";
    sub = `${score}/40 — Revois les leçons A1 et retente le quiz. Tu vas y arriver !`;
    stars = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  } else if (score < 30) {
    msg = `Très bon niveau A1 ! <svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    sub = `${score}/40 — Tu maîtrises bien le A1, continue sur cette lancée !`;
    stars = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    badgeHTML = `<div class="badge-box"><span class="badge-icon"><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><div class="badge-title">Bon niveau A1</div></div>`;
  } else {
    msg = `Badge A1 TOPIK <svg viewBox="0 0 24 24" style="width:13px;height:13px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M6 9H4a2 2 0 01-2-2V5h4"/><path d="M18 9h2a2 2 0 002-2V5h-4"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="M6 2h12v7a6 6 0 01-12 0V2z"/></svg> débloqué !`;
    sub = `Exceptionnel ! ${score}/40 — Tu es prêt(e) pour le niveau A2 !`;
    stars = `<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:currentColor;stroke:none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    badgeHTML = `<div class="badge-box"><span class="badge-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M6 9H4a2 2 0 01-2-2V5h4"/><path d="M18 9h2a2 2 0 002-2V5h-4"/><path d="M12 17v4"/><path d="M8 21h8"/><path d="M6 2h12v7a6 6 0 01-12 0V2z"/></svg></span><div class="badge-title">Badge A1 TOPIK</div></div>`;
    launchConfetti();
  }

  document.getElementById('badgeArea').innerHTML = badgeHTML;
  document.getElementById('resultMsg').innerHTML = msg;
  document.getElementById('resultSub').innerHTML = sub;
  document.getElementById('starsDisplay').innerHTML = stars;
}

function launchConfetti() {
  const colors = ['#B8924E','#FFD800','#22C55E','#3B82F6','#EF4444','#A855F7','#EC4899','#F97316'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      const size = 6 + Math.random() * 10;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
      el.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 40);
  }
}

function restartQuiz() {
  questions = prepareQuestions();
  current = 0;
  score = 0;
  answered = 0;
  document.getElementById('successScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = 'block';
  renderQuestion();
}

renderQuestion();
</script>
