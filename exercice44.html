<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">&larr;</button><span class="bar-title">Choisir la bonne cause</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Choisir la bonne cause</h1>
  <span class="pill">B2 · 10 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">-</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +14 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[{"fr": "« J'étais au travail, je n'ai pas pu répondre. » (mon temps est passé là-dedans)", "txt": "일하___ 전화를 못 받았어요.", "opts": ["느라고", "는 통에", "ㄴ 탓에"], "ans": 0, "exp": "느라고 : mon temps et mon énergie sont passés dans cette activité."}, {"fr": "« À cause de la pluie, on n'a pas pu pique-niquer. » (un imprévu qui me tombe dessus)", "txt": "비가 오___ 소풍을 못 갔어요.", "opts": ["느라고", "는 바람에", "는 통에"], "ans": 1, "exp": "La pluie n'est pas mon activité : sujet différent, donc jamais 느라고. C'est 는 바람에."}, {"fr": "« Avec les travaux, je n'ai pas pu dormir. » (le bruit, le désordre)", "txt": "공사를 하___ 잠을 못 잤어요.", "opts": ["는 통에", "느라고", "ㄴ 덕분에"], "ans": 0, "exp": "통 = le remue-ménage. C'est la forme du bazar qui t'empêche de faire autre chose."}, {"fr": "« Je me suis levé tard, et c'est bien ma faute. »", "txt": "늦게 일어___ 학교에 늦었어요.", "opts": ["나느라고", "난 탓에", "나는 통에"], "ans": 1, "exp": "탓 = la faute de. Après un verbe au passé : -(으)ㄴ 탓에."}, {"fr": "« Grâce à un ami, j'ai appris le coréen. » (une bonne chose)", "txt": "친구 ___ 한국어를 배웠어요.", "opts": ["탓에", "덕분에", "느라고"], "ans": 1, "exp": "덕분에 pour ce qui est positif. 탓에 ici reviendrait à reprocher à ton ami de t'avoir appris le coréen."}, {"fr": "« C'est ma faute. » (pour désamorcer un conflit)", "txt": "___", "opts": ["제 탓이에요.", "제 덕분이에요.", "제 때문이에요."], "ans": 0, "exp": "탓 est un nom, il se construit directement avec 이다. 때문 exige 이기 때문이다, pas 때문이에요 tout seul."}, {"fr": "« J'ai passé la nuit à préparer les documents. » (attention au ㄹ de 만들다)", "txt": "발표 자료를 ___ 밤을 새웠어요.", "opts": ["만들느라고", "만드느라고", "만들었느라고"], "ans": 1, "exp": "Le ㄹ tombe devant ㄴ : 만들다 → 만드느라고. Et jamais de passé devant 느라고."}, {"fr": "« Merci d'avoir fait le déplacement. » (à quelqu'un qui vient d'arriver)", "txt": "___ 고생하셨어요.", "opts": ["오느라고", "온 탓에", "오는 통에"], "ans": 0, "exp": "느라고 + 고생하다 : la formule de politesse qui reconnaît l'effort de l'autre."}, {"fr": "« Dans la bousculade, j'ai perdu mon portefeuille. »", "txt": "사람들이 밀치___ 지갑을 잃어버렸어요.", "opts": ["느라고", "는 통에", "ㄴ 덕분에"], "ans": 1, "exp": "Une scène de cohue : c'est le terrain de 통에."}, {"fr": "« Par manque de préparation, j'ai raté ma présentation. » (je m'en veux)", "txt": "준비를 안 ___ 발표를 망쳤어요.", "opts": ["하느라고", "한 탓에", "하는 통에"], "ans": 1, "exp": "Ne pas préparer n'est pas une activité qui consomme du temps : c'est une faute. Donc 탓에."}];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant &rarr;</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='\u2713 '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='\u2717 '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=9?'Les cinq causales sont en place. C\'est exactement ce que le TOPIK II teste.':score>=6?'Bien. Reprends le tableau des 5 formes en fin de leçon 통에 : la question à se poser tient en une ligne.':'Reprends les trois leçons de l\'unité, puis reviens : ces cinq formes se distinguent par l\'intention, pas par le sens.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_d42',xp:14});else{if(typeof ksAddXP==='function')ksAddXP(14);if(typeof ksMarkDone==='function')ksMarkDone('ks_d42');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
