<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Guichet express — Banque</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Guichet express</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Guichet express</h2>
  <span class="pill">B1 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Le guichetier t'attend ! Choisis la bonne phrase ou le bon mot d'administration avant la fin du chrono.</p>
    <button class="start-btn" onclick="startGame()">Commencer →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"« Je voudrais ouvrir un compte »",ok:"계좌를 개설하고 싶어요",alts:["계좌를 재발급받고 싶어요","계좌를 서명하고 싶어요"]},
  {sit:"« Avez-vous votre carte de résident étranger ? »",ok:"외국인등록증 있으세요?",alts:["통장 있으세요?","번호표 있으세요?"]},
  {sit:"« Prenez un ticket et patientez »",ok:"번호표 뽑고 기다리세요",alts:["번호표 팔고 기다리세요","비밀번호 뽑고 기다리세요"]},
  {sit:"« Je signe ici, c'est bon ? »",ok:"여기에 서명하면 돼요?",alts:["여기에 송금하면 돼요?","여기에 개설하면 돼요?"]},
  {sit:"« Le livret et la carte arrivent quand ? »",ok:"통장이랑 카드는 언제 나와요?",alts:["통장이랑 카드는 어디예요?","통장이랑 카드는 얼마예요?"]},
  {sit:"« Veuillez entrer votre code »",ok:"비밀번호 눌러 주세요",alts:["잔액 눌러 주세요","서명 눌러 주세요"]},
  {sit:"« Compte bancaire »",ok:"계좌",alts:["번호표","우체국"]},
  {sit:"« Livret bancaire »",ok:"통장",alts:["여권","계약"]},
  {sit:"« Faire un virement »",ok:"송금하다",alts:["서명하다","개설하다"]},
  {sit:"« Solde du compte »",ok:"잔액",alts:["수수료","비밀번호"]},
  {sit:"« Je voudrais un duplicata de ma carte »",ok:"외국인등록증을 재발급받고 싶어요",alts:["외국인등록증을 개설하고 싶어요","외국인등록증을 서명하고 싶어요"]},
  {sit:"« Comment je remplis ça ? »",ok:"이거 어떻게 작성해요?",alts:["이거 얼마예요?","이거 어디에 있어요?"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=12?'Le guichetier te prend pour une locale !':score>=7?'Bien joué — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_c44',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_c44');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
