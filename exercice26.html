  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(37,99,235,.12);color:#1D4ED8;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#93c5fd}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#2563EB;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .q-fr{font-size:.82rem;color:var(--tx-muted);margin-bottom:.2rem}
    .q-txt{font-weight:600;font-size:1rem;margin-bottom:.8rem;line-height:1.5}
    .q-img{width:100%;max-width:240px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;display:block;margin:0 auto .8rem;box-shadow:0 2px 10px rgba(15,30,80,.12)}
    .opt{padding:.6rem .85rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.4rem 0;font-size:.92rem;background:var(--bg);transition:.15s}
    .opt:hover{border-color:#2563EB}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D;font-weight:600}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}
    .next{display:block;width:100%;padding:.85rem;background:#2563EB;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:#2563EB}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#2563EB;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Décrire quelqu'un</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Décrire quelqu'un</h1>
  <span class="pill">A1 · 8 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"« Mon ami est gentil. »",txt:"제 친구는 ___",opts:["친절해요","키가 커요","머리가 길어요"],ans:0,exp:"친절해요 = est gentil/serviable."},
  {fr:"« Elle est grande. »",txt:"___ 커요",img:"img/vocab/decrire-tall.webp",imgAlt:"키가 커요 (grand)",opts:["키가","머리가","눈이"],ans:0,exp:"키 = la taille → 키가 커요 = être grand."},
  {fr:"« Une personne gentille » (adjectif + nom).",txt:"___ 사람",opts:["친절한","친절해요","친절하다"],ans:0,exp:"Adjectif + nom : 친절하다 → 친절한 사람."},
  {fr:"« Cheveux longs » (adjectif + nom).",txt:"___ 머리",img:"img/vocab/decrire-longhair.webp",imgAlt:"긴 머리 (cheveux longs)",opts:["긴","길은","길다"],ans:0,exp:"길다 → 긴 (le ㄹ tombe devant ㄴ)."},
  {fr:"« C'est quel genre de personne ? »",txt:"___ 사람이에요?",opts:["어떤","누구","몇"],ans:0,exp:"어떤 = quel genre de…"},
  {fr:"« Il est mignon. »",txt:"___",opts:["귀여워요","똑똑해요","조용해요"],ans:0,exp:"귀여워요 = mignon (귀엽다, ㅂ irrégulier)."},
  {fr:"« Quelqu'un de drôle » (adjectif + nom).",txt:"___ 사람",opts:["재미있는","재미있은","재미있어요"],ans:0,exp:"-있다/-없다 → -는 : 재미있는 사람."},
  {fr:"« Ma mère est intelligente. »",txt:"엄마는 ___",opts:["똑똑해요","작아요","포장이요"],ans:0,exp:"똑똑해요 = est intelligent·e."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  if(q.img){html+='<img class="q-img" src="'+q.img+'" alt="'+(q.imgAlt||'')+'" loading="lazy">';}
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(o,q));
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Bravo ! Tu sais décrire les gens.':score>=5?'Bien — revois la forme adjectif + nom.':'Reprends la leçon « Décrire quelqu\'un » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_a64',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_a64');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
