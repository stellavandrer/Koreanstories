<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Savoir ou Pouvoir ?</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Savoir ou Pouvoir ?</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Savoir ou Pouvoir ?</h2>
  <span class="pill">A2 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Choisis la bonne phrase — 줄 알다/모르다 (compétence) ou 수 있다/없다 (possibilité) — avant la fin du chrono !</p>
    <button class="start-btn" onclick="startGame()">Commencer →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"« Je sais nager » (compétence)",ok:"수영할 줄 알아요",alts:["수영할 수 없어요","수영하고 싶어요"]},
  {sit:"« Je ne peux pas venir demain » (empêché·e)",ok:"내일 올 수 없어요",alts:["내일 올 줄 몰라요","내일 오고 싶어요"]},
  {sit:"« Je ne sais pas conduire » (jamais appris)",ok:"운전할 줄 몰라요",alts:["운전할 수 없어요","운전 안 해요"]},
  {sit:"« Tu sais jouer du piano ? »",ok:"피아노 칠 줄 알아요?",alts:["피아노 칠 수 있어요?","피아노 치고 싶어요?"]},
  {sit:"« Je ne peux pas t'aider ce soir » (occupé·e)",ok:"오늘 저녁에 도와줄 수 없어요",alts:["오늘 저녁에 도와줄 줄 몰라요","도와주기 싫어요"]},
  {sit:"« Je sais faire du kimchi » (recette apprise)",ok:"김치를 만들 줄 알아요",alts:["김치를 만들 수 없어요","김치를 만들고 있어요"]},
  {sit:"« Le médecin ne peut pas vous recevoir aujourd'hui » (agenda complet)",ok:"오늘은 만날 수 없어요",alts:["오늘은 만날 줄 몰라요","만나기 싫어요"]},
  {sit:"« Je sais lire le coréen »",ok:"한국어를 읽을 줄 알아요",alts:["한국어를 읽을 수 없어요","한국어를 읽고 싶어요"]},
  {sit:"« Je ne sais pas encore écrire en coréen »",ok:"아직 한국어를 쓸 줄 몰라요",alts:["아직 한국어를 쓸 수 없어요","한국어를 쓰기 싫어요"]},
  {sit:"« Je sais faire du vélo »",ok:"자전거 탈 줄 알아요",alts:["자전거 탈 수 없어요","자전거 타고 있어요"]},
  {sit:"« Je ne peux pas sortir aujourd'hui » (il pleut)",ok:"오늘은 나갈 수 없어요",alts:["오늘은 나갈 줄 몰라요","나가기 싫어요"]},
  {sit:"« Savoir faire » (structure)",ok:"줄 알다",alts:["수 있다","고 싶다"]},
  {sit:"« Pouvoir, possibilité du moment » (structure)",ok:"수 있다",alts:["줄 알다","기로 하다"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=13?'줄 알다 et 수 있다 dans la poche !':score>=8?'Bien joué — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b24g',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_b24g');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
