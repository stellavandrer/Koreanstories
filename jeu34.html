  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:540px;margin:0 auto}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(37,99,235,.12);color:#2563EB;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#93c5fd}
    .hud{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 .6rem;font-weight:700}
    .timer{color:#2563EB}.timer.low{color:#ef4444}
    .streak{font-size:.85rem;color:var(--tx-muted)}

    .start-btn,.again-btn{display:block;width:100%;padding:.9rem;background:#2563EB;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1rem}

<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Réaction ou Fait ?</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Réaction ou Fait ?</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Réaction ou Fait ?</h2>
  <span class="pill">A2 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Choisis la bonne phrase — -네요 (tu viens de le remarquer) ou -아요/어요 (simple fait) — avant la fin du chrono !</p>
    <button class="start-btn" onclick="startGame()">Commencer →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"« Oh, c'est près ! » (tu viens de réaliser)",ok:"가깝네요!",alts:["가까워요!","가까울 거예요!"]},
  {sit:"« Oh, c'est vraiment délicieux ! C'est combien ? » (au moment de goûter)",ok:"정말 맛있네요! 얼마예요?",alts:["정말 맛있어요! 얼마예요?","정말 맛있고 싶어요! 얼마예요?"]},
  {sit:"« La maison est vraiment jolie ! Oh, il y a même une télé. » (en visitant)",ok:"집이 정말 예뻐요! 텔레비전도 있네요.",alts:["집이 정말 예뻐요! 텔레비전도 있어요.","집이 정말 예뻐요! 텔레비전도 있을 거예요."]},
  {sit:"« Vous parlez vraiment bien coréen ! » (compliment poli)",ok:"한국어를 정말 잘하시네요.",alts:["한국어를 정말 잘해요.","한국어를 정말 잘할 거예요."]},
  {sit:"« Vous connaissez bien l'étiquette coréenne ! » (admiration polie)",ok:"한국 예절을 잘 아시네요!",alts:["한국 예절을 잘 알아요!","한국 예절을 잘 알 거예요!"]},
  {sit:"« Vous n'avez pas pris de parapluie aujourd'hui. » (remarque polie)",ok:"오늘은 우산을 안 쓰시네요.",alts:["오늘은 우산을 안 써요.","오늘은 우산을 안 쓸 거예요."]},
  {sit:"« Wow, c'est grand, qu'est-ce que tu vas acheter ? » (en découvrant la taille)",ok:"와 크네요 뭐 살 거예요",alts:["와 커요 뭐 살 거예요","와 크고 싶어요 뭐 살 거예요"]},
  {sit:"« Le sikhye est vraiment délicieux, je peux en reprendre ? » (en goûtant)",ok:"식혜가 정말 맛있네요 또 마실 수 있어요",alts:["식혜가 정말 맛있어요 또 마실 수 있어요","식혜가 정말 맛있고 싶어요 또 마실 수 있어요"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=10?'-네요 dans la poche !':score>=5?'Bien joué — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b36d',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_b36d');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
