  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#DB2777;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .q-fr{font-size:.82rem;color:var(--tx-muted);margin-bottom:.2rem}
    .q-txt{font-weight:600;font-size:1rem;margin-bottom:.8rem;line-height:1.5}
    .opt{padding:.6rem .85rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.4rem 0;font-size:.92rem;background:var(--bg);transition:.15s}
    .opt:hover{border-color:#DB2777}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.1);color:#15803D;font-weight:600}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}
    .next{display:block;width:100%;padding:.85rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:#DB2777}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">&larr;</button><span class="bar-title">Les tournures de l'écrit</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Les tournures de l'écrit</h1>
  <span class="pill">B2 · 10 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">-</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +14 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[{"fr": "« En tant qu'étudiant, il faut travailler avec sérieux. »", "txt": "학생___ 열심히 공부해야 합니다.", "opts": ["으로서", "으로써", "이야말로"], "ans": 0, "exp": "로서 : la position depuis laquelle tu parles. Être étudiant n'est pas un outil."}, {"fr": "« Le problème a été résolu par le dialogue. »", "txt": "대화___ 문제를 해결했습니다.", "opts": ["로서", "로써", "야말로"], "ans": 1, "exp": "로써 : le moyen. Le test : si tu peux dire « avec », c'est 로써."}, {"fr": "« L'éducation est précisément l'investissement le plus important. »", "txt": "교육___ 가장 중요한 투자입니다.", "opts": ["으로서", "으로써", "이야말로"], "ans": 2, "exp": "야말로 désigne LA chose qui compte, à l'exclusion des autres. La formule des conclusions."}, {"fr": "« Dans ce texte, nous nous proposons d'examiner… » (ouverture d'une dissertation)", "txt": "이 글에서는 변화를 ___", "opts": ["살펴보려고 해요.", "살펴보고자 합니다.", "살펴볼까 봐요."], "ans": 1, "exp": "고자 하다 : l'équivalent écrit de -(으)려고 하다. On ne le dit jamais à l'oral."}, {"fr": "« Je n'ai même pas pu boire d'eau, alors manger… »", "txt": "___ 물도 못 마셨습니다.", "opts": ["밥은커녕", "물은커녕", "밥도커녕"], "ans": 0, "exp": "La grande chose d'abord, la petite ensuite. L'inverse ne veut rien dire."}, {"fr": "« Loin de me reposer, je suis devenu encore plus occupé. » (après un verbe)", "txt": "___ 더 바빠졌습니다.", "opts": ["쉬는커녕", "쉬기는커녕", "쉬고자"], "ans": 1, "exp": "Après un verbe, c'est -기는커녕."}, {"fr": "« Le succès dépend de l'effort. »", "txt": "성공은 노력___", "opts": ["으로서 있습니다.", "에 달려 있습니다.", "이야말로입니다."], "ans": 1, "exp": "에 달려 있다 désigne le facteur décisif. La formule qui referme un paragraphe."}, {"fr": "« Le résultat dépend de l'ampleur de la préparation. » (après un verbe)", "txt": "결과는 준비를 얼마나 ___ 달려 있습니다.", "opts": ["한 것으로서", "했느냐에", "하고자"], "ans": 1, "exp": "Après un verbe, la construction est -느냐에 달려 있다."}, {"fr": "« C'est tout naturel, en tant que parent. »", "txt": "부모___ 당연한 일입니다.", "opts": ["로서", "로써", "야말로"], "ans": 0, "exp": "Encore une position, donc 로서. Après une voyelle, pas de 으."}, {"fr": "« C'est maintenant, justement, qu'il faut agir. »", "txt": "지금___ 행동할 때입니다.", "opts": ["으로서", "이야말로", "으로써"], "ans": 1, "exp": "야말로 insiste sur le moment décisif : c'est MAINTENANT et pas un autre."}];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant &rarr;</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='\u2713 '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='\u2717 '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=9?"Tu as les six armatures d'un essai TOPIK. Il ne te reste qu'à les remplir.":score>=6?"Bien. La paire 로서 / 로써 mérite un second passage : c'est celle que la plupart des candidats ratent.":"Reprends les leçons 93 et 94 : ces tournures ne s'improvisent pas, elles se mémorisent comme des formules.";
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_d60',xp:14});else{if(typeof ksAddXP==='function')ksAddXP(14);if(typeof ksMarkDone==='function')ksMarkDone('ks_d60');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
