  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#DB2777;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}

    .opt:hover{border-color:#DB2777}

    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.08);color:#dc2626}
    .fb{font-size:.85rem;margin-top:.6rem;min-height:1.2em;line-height:1.5}

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Résolution -아/어야지</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Résolution -아/어야지</h1>
  <span class="pill">A2 · 8 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"« Bon, je devrais aller dormir maintenant » (tu te motives toi-même)",txt:"이제 ___",opts:["자야지","자야 해요","자고 싶어요"],ans:0,exp:"-아/어야지 = résolution personnelle décidée sur le moment."},
  {fr:"« Les élèves doivent étudier » (règle générale)",txt:"학생은 ___",opts:["공부해야지","공부해야 해요","공부하나 봐요"],ans:1,exp:"-아/어야 하다 = obligation générale, valable pour n'importe qui."},
  {fr:"« Ah, c'est vrai ! Je devrais appeler maman » (tu réalises à l'instant)",txt:"엄마한테 ___",opts:["전화해야지","전화해야 해요?","전화하러 가요"],ans:0,exp:"Résolution spontanée à la première personne : -아/어야지."},
  {fr:"« Cette fois, je devrais vraiment perdre du poids » (résolution personnelle)",txt:"이번에는 진짜 살을 ___",opts:["빼야지","뺄 수 있어요","빼나 봐요"],ans:0,exp:"Encore une résolution personnelle, typique des bonnes résolutions répétées !"},
  {fr:"« Tu dois étudier aujourd'hui ? » (question sur l'obligation d'un tiers)",txt:"오늘 ___",opts:["공부해야지?","공부해야 해요?","공부하고 싶어요?"],ans:1,exp:"On ne pose jamais une question sur l'obligation de quelqu'un d'autre avec -아/어야지."},
  {fr:"« Je devrais faire un peu de sport » (constat + résolution)",txt:"운동을 좀 ___",opts:["해야지","해야 해요","하러 가요"],ans:0,exp:"Constat personnel suivi d'une résolution : -아/어야지."},
  {fr:"« Tout le monde doit porter un masque ici » (règle affichée, générale)",txt:"여기서는 마스크를 ___",opts:["써야지","써야 해요","쓰나 봐요"],ans:1,exp:"Règle générale affichée pour tout le monde : -아/어야 하다, jamais -아/어야지."},
  {fr:"« Bon, je devrais vraiment étudier le coréen maintenant » (résolution)",txt:"이제 진짜 한국어 ___",opts:["공부해야지","공부해야 해요","공부할 줄 알아요"],ans:0,exp:"La phrase de survie de cette leçon : résolution personnelle, -아/어야지."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Parfait ! Résolution personnelle ou obligation générale, tu sais choisir.':score>=5?'Bien — repense à te demander : tu te motives toi-même, ou tu parles d\'une règle générale ?':'Reprends la leçon « Résolution » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b24i',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_b24i');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
