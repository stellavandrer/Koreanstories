  <meta charset="UTF-8">

<link rel="canonical" href="https://koreanstories.fr/jeu22.html"/>
<meta name="description" content="Shopping Match : 90 secondes pour choisir le bon verbe « porter » et la bonne phrase de shopping en coréen. Jeu A2 sur Korean Stories."/>
  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:540px;margin:0 auto}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(124,58,237,.12);color:#6D28D9;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#c4b5fd}
    .hud{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 .6rem;font-weight:700}
    .timer{color:var(--accent-purple)}.timer.low{color:#ef4444}
    .streak{font-size:.85rem;color:var(--tx-muted)}
    .bar2{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin-bottom:1rem}
    .bar2-fill{height:100%;background:#7C3AED;width:100%;border-radius:100px;transition:width 1s linear}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.3rem 1.2rem;text-align:center}
    .sit{font-size:1.05rem;font-weight:600;line-height:1.5;margin-bottom:1rem}
    .opt{padding:.7rem .9rem;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;margin:.45rem 0;font-size:1.05rem;font-weight:600;background:var(--bg);transition:.12s}
    .opt:hover{border-color:var(--accent-purple)}
    .opt.ok{border-color:#16A34A;background:rgba(22,163,74,.12);color:#15803D}
    .opt.ko{border-color:#ef4444;background:rgba(239,68,68,.1);color:#dc2626}
    .start-btn,.again-btn{display:block;width:100%;padding:.9rem;background:#7C3AED;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1rem}
    .result{text-align:center;padding:1.5rem 0}
    .result .big{font-size:2.6rem;font-weight:800;color:var(--accent-purple)}
    .intro{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;text-align:center}
  </style>

<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Shopping Match — Vêtements</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Shopping Match</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Shopping Match</h2>
  <span class="pill">A2 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">입다, 신다 ou 쓰다 ? Choisis le bon verbe « porter » et la bonne phrase de shopping avant la fin du chrono !</p>
    <button class="start-btn" onclick="startGame()">Commencer →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"« Je porte un t-shirt »",ok:"티셔츠를 입어요",alts:["티셔츠를 신어요","티셔츠를 써요"]},
  {sit:"« Je porte des chaussures »",ok:"신발을 신어요",alts:["신발을 입어요","신발을 써요"]},
  {sit:"« Je porte un chapeau »",ok:"모자를 써요",alts:["모자를 입어요","모자를 신어요"]},
  {sit:"« Essayez ce pantalon ! »",ok:"이 바지를 입어 보세요",alts:["이 바지를 입어 있어요","이 바지를 입어 했어요"]},
  {sit:"« Vous avez une taille au-dessus ? »",ok:"더 큰 사이즈 있어요?",alts:["더 작은 사이즈 있어요?","사이즈가 없어요?"]},
  {sit:"« C'est en soldes »",ok:"이거 세일 중이에요",alts:["이거 세일 아니에요","이거 세일 밖이에요"]},
  {sit:"« Je regarde seulement »",ok:"그냥 구경하고 있어요",alts:["그냥 사고 있어요","그냥 입고 있어요"]},
  {sit:"« C'est combien ? »",ok:"얼마예요?",alts:["어디예요?","언제예요?"]},
  {sit:"« La taille, ça va ? »",ok:"사이즈가 어때요?",alts:["사이즈가 얼마예요?","사이즈가 어디예요?"]},
  {sit:"« Vêtements »",ok:"옷",alts:["집","몸"]},
  {sit:"« Jupe »",ok:"치마",alts:["바지","모자"]},
  {sit:"« Boutique de vêtements »",ok:"옷 가게",alts:["꽃 가게","신발"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=12?'Reine du shopping à Séoul !':score>=7?'Bien joué — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b64',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_b64');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
