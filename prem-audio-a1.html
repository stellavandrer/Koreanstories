  <style>
* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0f1a 0%, #1a2a3f 100%);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
    }

    /* Top Navigation */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--bd);
      gap: 12px;
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: rgba(201, 169, 110, 0.1);
    }

    .nav-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.5px;
    }

    .xp-badge {
      background: linear-gradient(135deg, var(--gold), #d4a574);
      color: var(--bg);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      min-width: 50px;
      text-align: center;
    }

    /* Warning banner */
    .warning-banner {
      display: none;
      background: rgba(201, 169, 110, 0.15);
      border-left: 4px solid var(--gold);
      padding: 12px 20px;
      font-size: 13px;
      color: var(--subtle);
      text-align: center;
    }

    .warning-banner.show {
      display: block;
    }

    /* Unit tabs */
    .units-container {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--bd);
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .unit-tab {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--subtle);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .unit-tab:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .unit-tab.active {
      background: var(--card-bg);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Main content area */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      overflow-y: auto;
    }

    /* Card display */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), #d4a574);
      border-radius: 20px 0 0 0;
      transition: width 0.3s ease;
    }

    .korean-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .korean-text.playing {
      color: var(--gold);
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .romanization-toggle {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin: 8px auto 12px;
      display: block;
      transition: all 0.2s ease;
    }

    .romanization-toggle:hover {
      background: rgba(201, 169, 110, 0.1);
    }

    .romanization {
      display: none;
      font-size: 16px;
      color: var(--subtle);
      margin-bottom: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .romanization.show {
      display: block;
    }

    .french {
      font-size: 16px;
      color: var(--subtle);
      font-style: italic;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .play-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #d4a574);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(201, 169, 110, 0.3);
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(201, 169, 110, 0.4);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn svg {
      width: 32px;
      height: 32px;
      fill: var(--bg);
    }

    .voice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
    }

    .voice-btn {
      background: var(--card-bg);
      border: 1px solid var(--bd);
      color: var(--subtle);
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .voice-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201, 169, 110, 0.1);
    }

    .voice-btn.active {
      background: rgba(201, 169, 110, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .speed-control {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .speed-btn {
      background: var(--card-bg);
      border: 1px solid var(--bd);
      color: var(--subtle);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .speed-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .speed-btn.active {
      background: rgba(201, 169, 110, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Auto-play toggle */
    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 8px;
    }

    .toggle-label {
      font-size: 12px;
      color: var(--subtle);
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s ease;
      border: 1px solid var(--bd);
    }

    .toggle-switch.active {
      background: rgba(201, 169, 110, 0.3);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: var(--text);
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.3s ease;
    }

    .toggle-switch.active::after {
      left: 19px;
      background: var(--gold);
    }

    /* Navigation */
    .nav-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--bd);
    }

    .nav-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--bd);
      color: var(--subtle);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--gold);
      color: var(--gold);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .card-counter {
      flex: 0 0 auto;
      font-size: 12px;
      color: var(--subtle);
      min-width: 50px;
      text-align: center;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(201, 169, 110, 0.3);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(201, 169, 110, 0.5);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }

      .card {
        padding: 24px 20px;
      }

      .korean-text {
        font-size: 44px;
      }
    }
  
    /* ── BOTTOM NAV ── */

    body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
    @media(min-width:640px){body{padding-bottom:0}}

    // State
    let currentUnitId = 'u_d1';
    let currentCardIndex = 0;
    let currentSpeed = 1;
    let currentVoice = 1;
    let autoPlay = false;
    let showRomanization = false;

    // Voice configs: [rate, pitch]
    const voiceConfigs = {
      1: { rate: 0.85, pitch: 1.0 },
      2: { rate: 0.9, pitch: 0.85 },
      3: { rate: 0.75, pitch: 1.1 },
      4: { rate: 0.95, pitch: 0.95 }
    };

    // Check TTS support
    const hasTTS = window.speechSynthesis !== undefined;

    // Init
    function init() {
      if (!hasTTS) {
        document.getElementById('warningBanner').classList.add('show');
      }

      // Check URL for unit param
      const params = new URLSearchParams(window.location.search);
      const unitParam = params.get('u');
      if (unitParam && UNITS[unitParam]) {
        currentUnitId = unitParam;
      }

      renderUnits();
      updateCard();
    }

    // Render unit tabs
    function renderUnits() {
      const container = document.getElementById('unitsContainer');
      container.innerHTML = '';
      Object.entries(UNITS).forEach(([id, unit]) => {
        const btn = document.createElement('button');
        btn.className = 'unit-tab' + (id === currentUnitId ? ' active' : '');
        btn.textContent = unit.title;
        btn.onclick = () => switchUnit(id);
        container.appendChild(btn);
      });
    }

    // Switch unit
    function switchUnit(unitId) {
      currentUnitId = unitId;
      currentCardIndex = 0;
      showRomanization = false;
      renderUnits();
      updateCard();
    }

    // Update card display
    function updateCard() {
      const unit = UNITS[currentUnitId];
      const card = unit.cards[currentCardIndex];

      document.getElementById('koreanText').textContent = card.kr;
      document.getElementById('romanization').textContent = card.rom;
      document.getElementById('french').textContent = card.fr;
      document.getElementById('cardCounter').textContent = currentCardIndex + 1;
      document.getElementById('cardTotal').textContent = unit.cards.length;

      // Update progress bar
      const progress = ((currentCardIndex + 1) / unit.cards.length) * 100;
      document.getElementById('progressBar').style.width = progress + '%';

      // Update nav buttons
      document.getElementById('prevBtn').disabled = currentCardIndex === 0;
      document.getElementById('nextBtn').disabled = currentCardIndex === unit.cards.length - 1;

      // Hide romanization on card change
      if (!showRomanization) {
        document.getElementById('romanization').classList.remove('show');
      }

      // Update localStorage
      const progress_data = JSON.parse(localStorage.getItem('ks_prem_audio') || '{}');
      progress_data[currentUnitId] = currentCardIndex + 1;
      localStorage.setItem('ks_prem_audio', JSON.stringify(progress_data));
    }

    // Play current card
    function playCard() {
      if (!hasTTS) return;

      const unit = UNITS[currentUnitId];
      const card = unit.cards[currentCardIndex];

      /* Priorité au système InJoon (ks.js → audio/injoon/*.mp3) */


      if (typeof window.speak === 'function') { window.speak(card.kr); return; }


      const utt = new SpeechSynthesisUtterance(card.kr);
      utt.lang = 'ko-KR';
      const config = voiceConfigs[currentVoice];
      utt.rate = currentSpeed * config.rate;
      utt.pitch = config.pitch;

      // Add pulse animation
      const textEl = document.getElementById('koreanText');
      textEl.classList.remove('playing');
      void textEl.offsetWidth; // Trigger reflow
      textEl.classList.add('playing');

      utt.onend = () => {
        textEl.classList.remove('playing');
        if (autoPlay) {
          setTimeout(() => {
            if (currentCardIndex < unit.cards.length - 1) {
              nextCard();
            }
          }, 500);
        }
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utt);
    }

    // Navigation
    function previousCard() {
      if (currentCardIndex > 0) {
        currentCardIndex--;
        showRomanization = false;
        updateCard();
      }
    }

    function nextCard() {
      const unit = UNITS[currentUnitId];
      if (currentCardIndex < unit.cards.length - 1) {
        currentCardIndex++;
        showRomanization = false;
        updateCard();
      }
    }

    // Controls
    function setSpeed(speed) {
      currentSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function setVoice(voice) {
      currentVoice = voice;
      document.querySelectorAll('.voice-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelectorAll('.voice-btn')[voice - 1].classList.add('active');
    }

    function toggleAutoPlay() {
      autoPlay = !autoPlay;
      document.getElementById('autoPlayToggle').classList.toggle('active');
    }

    function toggleRomanization() {
      showRomanization = !showRomanization;
      document.getElementById('romanization').classList.toggle('show');
    }

    // Back button
    function goBack() {
      if (window.parent && typeof window.parent.closeCPanel === 'function') {
        window.parent.closeCPanel();
      } else {
        history.back();
      }
    }

    // Start
    init();
  </script>
