<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);min-height:100svh;-webkit-font-smoothing:antialiased;padding-bottom:90px}

<script src="ks-dictionary.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Dictionnaire intelligent — recherche, romanisation auto, conjugaison.
   Données : KSDict.raw() (noyau curé, chargé immédiatement)
   + ks-krdict.json (한국어기초사전 du 국립국어원, CC BY-SA) chargé en différé.
   ═══════════════════════════════════════════════════════════════════ */
var DICT = (window.KSDict && KSDict.raw()) ? KSDict.raw() : {};
var ENTRIES = Object.keys(DICT).map(function(ko){ var e=DICT[ko]; return {ko:ko, fr:e.fr||'', rom:e.rom||'', pos:e.pos||'', ex:e.ex||''}; });

/* ── Élargissement différé : dictionnaire complet krdict (≈40k mots, CC BY-SA).
   Le noyau curé reste instantané ; krdict se fond dans l'index une fois chargé. ── */
(function(){
  var seen={}; for(var i=0;i<ENTRIES.length;i++) seen[ENTRIES[i].ko]=1;
  fetch('ks-krdict.json').then(function(r){ return r.ok?r.json():null; }).then(function(extra){
    if(!extra) return;
    var added=0;
    for(var ko in extra){ if(seen[ko]) continue; var e=extra[ko]; ENTRIES.push({ko:ko, fr:e.fr||'', rom:'', pos:e.pos||'', ex:''}); seen[ko]=1; added++; }
    if(!added) return;
    if(qEl && !qEl.value.trim()){ if(dirHint) dirHint.textContent=ENTRIES.length+' mots · tape un mot coréen ou français'; }
    else if(typeof run==='function'){ run(); }   /* relance la recherche en cours avec le corpus complet */
  }).catch(function(){});
})();

/* ── Hangeul : décomposition / composition ── */
var LITS=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var VOWS=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
function dec(ch){var c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return {l:Math.floor(c/588),v:Math.floor((c%588)/28),t:c%28};}
function comp(l,v,t){return String.fromCharCode(0xAC00+(l*21+v)*28+(t||0));}
function isHangeul(s){return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(s);}

/* ── Romanisation (RR, syllabe par syllabe, approximation pédagogique) ── */
var L_ROM=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
var V_ROM=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
var T_ROM=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
function romanize(text){
  var out='';
  for(var i=0;i<text.length;i++){
    var d=dec(text[i]);
    if(d){ out+=L_ROM[d.l]+V_ROM[d.v]+T_ROM[d.t]; }
    else out+=text[i];
  }
  return out;
}

/* ── Conjugueur ──────────────────────────────────────────────────────
   Couvre régulier + 하다 + contractions vocaliques + irréguliers
   ㄷ, ㅂ, ㅅ, 르, 으, ㅎ, ㄹ. Formes générées (haut→bas registre). */
var IRR_D={'듣':1,'걷':1,'묻':1,'싣':1,'깨닫':1,'붇':1};            // ㄷ → ㄹ
var IRR_B={'덥':1,'춥':1,'쉽':1,'어렵':1,'무겁':1,'가볍':1,'아름답':1,'반갑':1,'맵':1,'싱겁':1,'귀엽':1,'더럽':1,'눕':1,'줍':1,'곱':1,'돕':1,'굽':1,'고맙':1};  // ㅂ → 우/와
var IRR_S={'짓':1,'낫':1,'붓':1,'긋':1,'잇':1};                    // ㅅ drop
var IRR_H={'그렇':1,'어떻':1,'이렇':1,'저렇':1,'빨갛':1,'파랗':1,'노랗':1,'하얗':1,'까맣':1,'동그랗':1};  // ㅎ
var REU_REGULAR={'따르':1,'들르':1,'치르':1};                      // 르 mais régulier (으-drop)
function bright(v){return v===0||v===8;}  // ㅏ ou ㅗ → voyelle claire (아)

/* Forme « 아/어 » (= base du présent poli sans 요, et du tutoiement) */
function infin(stem){
  if(stem.charAt(stem.length-1)==='하') return stem.slice(0,-1)+'해';
  var last=stem.charAt(stem.length-1), d=dec(last), pre=stem.slice(0,-1);
  if(!d) return stem+'어';
  /* 르 irrégulier */
  if(last==='르' && stem.length>=2 && !REU_REGULAR[stem]){
    var pc=dec(stem.charAt(stem.length-2));
    if(pc){ var nv=bright(pc.v)?0:4; return stem.slice(0,-2)+comp(pc.l,pc.v,8)+comp(5,nv,0); }
  }
  if(d.t!==0){
    if(d.t===7 && IRR_D[stem]){ var vv=bright(d.v)?'아':'어'; return pre+comp(d.l,d.v,8)+vv; }          // ㄷ→ㄹ +아/어
    if(d.t===17 && IRR_B[stem]){ var base=comp(d.l,d.v,0); return pre+base+((stem==='돕'||stem==='곱')?'와':'워'); } // ㅂ→우/와
    if(d.t===19 && IRR_S[stem]){ var v2=bright(d.v)?'아':'어'; return pre+comp(d.l,d.v,0)+v2; }          // ㅅ drop
    if(d.t===27 && IRR_H[stem]){ var nv2=(d.v===2)?3:1; return pre+comp(d.l,nv2,0); }                    // ㅎ → ㅐ/ㅒ
    return stem+(bright(d.v)?'아':'어');                                                                  // régulier consonne
  }
  switch(d.v){
    case 0: case 4: case 1: case 5: return stem;                 // ㅏㅓㅐㅔ : pas de changement
    case 8: return pre+comp(d.l,9,0);                            // ㅗ→ㅘ
    case 13: return pre+comp(d.l,14,0);                          // ㅜ→ㅝ
    case 20: return pre+comp(d.l,6,0);                           // ㅣ→ㅕ
    case 11: return pre+comp(d.l,10,0);                          // ㅚ→ㅙ
    case 18: { var hb=false; if(pre){var pd=dec(pre.charAt(pre.length-1)); if(pd) hb=bright(pd.v);} return pre+comp(d.l,hb?0:4,0); } // ㅡ drop
    default: return stem+'어';
  }
}
function addSS(infForm){ /* ajoute ㅆ à la dernière syllabe (pour le passé) */
  var last=infForm.charAt(infForm.length-1), d=dec(last);
  if(!d) return infForm+'었';
  return infForm.slice(0,-1)+comp(d.l,d.v,20)+'어'; /* ㅆ=20 */
}
function formal(stem){
  var last=stem.charAt(stem.length-1), d=dec(last), pre=stem.slice(0,-1);
  if(!d) return stem+'습니다';
  if(d.t===0||d.t===8) return pre+comp(d.l,d.v,17)+'니다';  /* voyelle ou ㄹ → ㅂ니다 (합니다, 삽니다) */
  return stem+'습니다';
}
function vstem(stem){ /* radical avant 으/ㄹ (futur, impératif) → {s, eul:bool} */
  if(stem.charAt(stem.length-1)==='하') return {s:stem, eul:false};
  var last=stem.charAt(stem.length-1), d=dec(last), pre=stem.slice(0,-1);
  if(!d) return {s:stem, eul:true};
  if(last==='르' && !REU_REGULAR[stem]) return {s:stem, eul:false};     /* 르 → +ㄹ */
  if(d.t===0) return {s:stem, eul:false};                               /* voyelle → +ㄹ */
  if(d.t===8) return {s:pre+comp(d.l,d.v,0), eul:false};                /* ㄹ drop → +ㄹ */
  if(d.t===7 && IRR_D[stem]) return {s:pre+comp(d.l,d.v,8), eul:true}; /* ㄷ→ㄹ +을 */
  if(d.t===17 && IRR_B[stem]) return {s:pre+comp(d.l,d.v,0)+'우', eul:false}; /* ㅂ→우 +ㄹ */
  if(d.t===19 && IRR_S[stem]) return {s:pre+comp(d.l,d.v,0), eul:true}; /* ㅅ drop +을 */
  if(d.t===27 && IRR_H[stem]) return {s:pre+comp(d.l,d.v,0), eul:false}; /* ㅎ drop → +ㄹ */
  return {s:stem, eul:true};                                           /* régulier consonne +을 */
}
function addRieul(s){ var last=s.charAt(s.length-1),d=dec(last); if(!d)return s+'ㄹ'; return s.slice(0,-1)+comp(d.l,d.v,8); }
function conjugate(word){
  if(!word||word.charAt(word.length-1)!=='다') return null;
  var stem=word.slice(0,-1);
  if(!stem||!dec(stem.charAt(stem.length-1))) return null;
  var inf=infin(stem);
  var vs=vstem(stem);
  var futurBase = vs.eul ? vs.s+'을' : addRieul(vs.s);
  var imper = vs.eul ? (vs.s+'으세요') : (vs.s+'세요');  /* voyelle → 세요 ; consonne → 으세요 */
  var forms=[
    ['Présent (poli)', inf+'요'],
    ['Présent (formel)', formal(stem)],
    ['Passé', addSS(inf)+'요'],
    ['Futur', futurBase+' 거예요'],
    ['Impératif (poli)', imper],
    ['Tutoiement', inf]
  ];
  return forms;
}

/* ── Audio : uniquement la vraie voix Typecast/neuronale (ks.js) — jamais de
   synthèse robotique. Le dico couvre ~45 000 mots (2 081 curés +
   ks-krdict.json) ; seuls ceux du vocabulaire des leçons/histoires ont un
   fichier audio pré-généré. Pour les autres, le bouton signale juste que
   l'audio n'est pas encore disponible pour ce mot (pas de son de secours). ── */
/* MISE A JOUR 2026-08-06 : audio/manifest-dict.json et les 42 711 fichiers
   .m4a du dictionnaire ne sont PLUS publies — ils pesaient 375 Mo et
   faisaient expirer le deploiement GitHub Pages (voir .gitignore). Seuls
   les ~2 765 mots deja couverts par l'audio des lecons sonnent encore.
   Le repli ci-dessous ne change pas : c'est exactement le chemin prevu
   pour un mot sans fichier, il sert juste beaucoup plus souvent. */
function dictSpeak(text,btn){
  if(typeof window.speak==='function'){
    window.speak(text,btn,{onerror:function(){
      if(btn){ btn.classList.add('unavailable'); setTimeout(function(){btn.classList.remove('unavailable');},350); }
    }});
  }
}

/* ── Recherche ── */
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }
function search(qRaw){
  var q=norm(qRaw); if(!q) return [];
  var kr=isHangeul(qRaw);
  var scored=[];
  for(var i=0;i<ENTRIES.length;i++){
    var e=ENTRIES[i], sc=-1;
    if(kr){
      if(e.ko===qRaw) sc=100; else if(e.ko.indexOf(qRaw)===0) sc=80; else if(e.ko.indexOf(qRaw)>=0) sc=55;
      else if(norm(e.rom).indexOf(q)>=0) sc=30;
    } else {
      var f=norm(e.fr), r=norm(e.rom);
      if(f===q) sc=100; else if(f.split(/[\s/(),]+/).indexOf(q)>=0) sc=82;
      else if(f.indexOf(q)===0) sc=70; else if(f.indexOf(q)>=0) sc=50;
      else if(r===q) sc=60; else if(r.indexOf(q)===0) sc=40; else if(r.indexOf(q)>=0) sc=25;
    }
    if(sc>=0) scored.push({e:e,sc:sc});
  }
  scored.sort(function(a,b){ return b.sc-a.sc || a.e.ko.length-b.e.ko.length || a.e.ko.localeCompare(b.e.ko); });
  return scored.slice(0,60).map(function(x){return x.e;});
}

/* ── Rendu ── */
var POS_LBL={nom:'nom',verbe:'verbe',adj:'adjectif',adv:'adverbe',expr:'expression',conj:'conjonction',part:'particule',pron:'pronom',num:'nombre',interr:'interrogatif',interj:'interjection',salut:'salutation'};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
var SPK_SVG='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/></svg>';

function entryHTML(e){
  var canConj=(e.pos==='verbe'||e.pos==='adj') && e.ko.charAt(e.ko.length-1)==='다';
  var h='<div class="entry'+(canConj?' has-conj':'')+'" data-ko="'+esc(e.ko)+'">';
  h+='<div class="entry-head">';
  h+='<div class="entry-main">';
  h+='<div class="entry-ko">'+esc(e.ko)+(e.pos?'<span class="pos-tag pos-'+e.pos+'">'+(POS_LBL[e.pos]||e.pos)+'</span>':'')+'</div>';
  h+='<div class="entry-rom">'+esc(e.rom||romanize(e.ko))+'</div>';
  h+='<div class="entry-fr">'+esc(e.fr)+'</div>';
  if(e.ex) h+='<div class="entry-ex"><span class="exk">'+esc(e.ex)+'</span></div>';
  if(canConj) h+='<button class="conj-toggle" type="button">Conjuguer <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>';
  h+='</div>';
  h+='<button class="spk" aria-label="Écouter" data-say="'+esc(e.ko)+'">'+SPK_SVG+'</button>';
  h+='</div>';
  if(canConj){
    var forms=conjugate(e.ko);
    if(forms){
      h+='<div class="conj-panel"><div class="conj-inner">';
      h+='<div class="conj-title">Conjugaison · '+esc(e.ko)+'</div>';
      forms.forEach(function(f){
        h+='<div class="conj-row"><span class="conj-lbl">'+f[0]+'</span><span class="conj-val">'+esc(f[1])+'<span class="rom">'+esc(romanize(f[1].replace(/\s/g,'')))+'</span></span><button class="conj-spk" aria-label="Écouter" data-say="'+esc(f[1])+'">'+SPK_SVG+'</button></div>';
      });
      h+='<div class="conj-note">Formes générées automatiquement — les cas très irréguliers peuvent varier.</div>';
      h+='</div></div>';
    }
  }
  h+='</div>';
  return h;
}

var main=document.getElementById('main'), qEl=document.getElementById('q'), qClear=document.getElementById('qClear'), dirHint=document.getElementById('dirHint');

function renderResults(list, q){
  if(!list.length){ renderEmpty(q); return; }
  var h='<div class="res-count">'+list.length+(list.length>=60?'+':'')+' résultat'+(list.length>1?'s':'')+'</div>';
  list.forEach(function(e){ h+=entryHTML(e); });
  main.innerHTML=h;
}
function renderEmpty(q){
  var kr=isHangeul(q);
  var h='<div class="empty">';
  if(kr){
    var conj=conjugate(q);
    h+='<div class="big">'+esc(q)+'</div><div class="rom">'+esc(romanize(q))+'</div>';
    h+='<button class="spk" aria-label="Écouter" data-say="'+esc(q)+'">'+SPK_SVG+'</button>';
    h+='<p>Ce mot n\'est pas encore dans notre dictionnaire, mais voici sa lecture'+(conj?' et sa conjugaison':'')+'.</p>';
    h+='</div>';
    if(conj){
      h+='<div class="entry open" style="margin-top:8px"><div class="conj-panel" style="max-height:640px"><div class="conj-inner"><div class="conj-title">Conjugaison · '+esc(q)+'</div>';
      conj.forEach(function(f){ h+='<div class="conj-row"><span class="conj-lbl">'+f[0]+'</span><span class="conj-val">'+esc(f[1])+'<span class="rom">'+esc(romanize(f[1].replace(/\s/g,'')))+'</span></span><button class="conj-spk" data-say="'+esc(f[1])+'" aria-label="Écouter">'+SPK_SVG+'</button></div>'; });
      h+='<div class="conj-note">Formes générées automatiquement.</div></div></div></div>';
    }
  } else {
    h+='<div class="big" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;opacity:.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div><p>Aucun résultat pour « '+esc(q)+' ».</p><p style="color:var(--t3)">Essaie un autre mot, en français ou en coréen.</p></div>';
  }
  main.innerHTML=h;
}
function renderHome(){
  var samples=['사랑','학교','먹다','예쁘다','감사합니다','가다','행복','시간','친구','맛있다','공부하다','물'];
  var h='';
  h+='<div class="intro-card"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><div><h3>Un dictionnaire qui conjugue pour toi</h3><p>Cherche un mot en français ou en coréen. Pour chaque verbe et adjectif, retrouve la conjugaison complète — présent, passé, futur, formel… avec l\'audio.</p></div></div>';
  h+='<div class="sec-lbl">Essaie avec</div><div class="suggest">';
  samples.forEach(function(w){ var e=DICT[w]; h+='<button class="chip" data-go="'+esc(w)+'"><span class="k">'+esc(w)+'</span>'+(e?esc(e.fr.split('/')[0].trim()):'')+'</button>'; });
  h+='</div>';
  main.innerHTML=h;
}

/* ── Événements ── */
var t;
function run(){
  var q=qEl.value.trim();
  qClear.classList.toggle('show', !!q);
  if(!q){ renderHome(); dirHint.textContent=ENTRIES.length+' mots · tape un mot coréen ou français'; return; }
  var list=search(q);
  dirHint.textContent = isHangeul(q)? 'Recherche coréen → français' : 'Recherche français → coréen';
  renderResults(list,q);
}
qEl.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(run,120); });
qClear.addEventListener('click', function(){ qEl.value=''; qEl.focus(); run(); });

main.addEventListener('click', function(ev){
  var spk=ev.target.closest('.spk,.conj-spk');
  if(spk){ ev.stopPropagation(); dictSpeak(spk.getAttribute('data-say'), spk.classList.contains('spk')?spk:null); return; }
  var tog=ev.target.closest('.conj-toggle');
  if(tog){ tog.closest('.entry').classList.toggle('open'); return; }
  var chip=ev.target.closest('.chip');
  if(chip){ qEl.value=chip.getAttribute('data-go'); run(); window.scrollTo({top:0,behavior:'smooth'}); qEl.focus(); return; }
  var head=ev.target.closest('.entry-head');
  if(head && head.parentNode.classList.contains('has-conj')) head.parentNode.classList.toggle('open');
});

/* préremplissage via ?q= ou #mot */
var pre=new URLSearchParams(location.search).get('q')||decodeURIComponent((location.hash||'').slice(1));
if(pre){ qEl.value=pre; }
run();
</script>
