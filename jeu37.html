<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Comme un natif</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">&larr;</button><span class="bar-title">Comme un natif</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Comme un natif</h2>
  <span class="pill">B2 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Six tournures de conversation, une seule qui colle à la situation. Choisis vite : 길래, 김에, 었더니, 더라고요, 던데요 ou 고 말다.</p>
    <button class="start-btn" onclick="startGame()">Commencer &rarr;</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[{"sit": "Il faisait beau. Tu racontes ce que tu as fait en le voyant.", "ok": "날씨가 좋길래 산책했어요.", "alts": ["날씨가 좋은 김에 산책했어요.", "날씨가 좋았더니 산책했어요."]}, {"sit": "Ce n'était pas cher. Tu expliques pourquoi tu en as pris deux.", "ok": "싸길래 두 개 샀어요.", "alts": ["싼 김에 두 개 샀어요.", "쌌더니 두 개 샀어요."]}, {"sit": "Tu faisais le ménage, tu en as profité pour les fenêtres.", "ok": "청소하는 김에 창문도 닦았어요.", "alts": ["청소하길래 창문도 닦았어요.", "청소했더니 창문도 닦았어요."]}, {"sit": "Tu allais en ville, tu es passé à la poste au passage.", "ok": "시내에 나가는 김에 우체국에 들렀어요.", "alts": ["시내에 나가길래 우체국에 들렀어요.", "시내에 나갔더니 우체국에 들렀어요."]}, {"sit": "Tu n'as pas déjeuné, et maintenant tu as faim.", "ok": "아침을 안 먹었더니 배가 고파요.", "alts": ["아침을 안 먹길래 배가 고파요.", "아침을 안 먹는 김에 배가 고파요."]}, {"sit": "Tu as ouvert la fenêtre ce matin et tu as découvert la neige.", "ok": "아침에 창문을 열었더니 눈이 왔어요.", "alts": ["아침에 창문을 열길래 눈이 왔어요.", "아침에 창문을 여는 김에 눈이 왔어요."]}, {"sit": "Tu as vu ce film. Tu dis qu'il était bien.", "ok": "그 영화 재미있더라고요.", "alts": ["그 영화 재미있대요.", "그 영화 재미있었더니요."]}, {"sit": "On te dit que ce restaurant est cher. Toi, tu l'as trouvé correct.", "ok": "아니요, 괜찮던데요.", "alts": ["아니요, 괜찮더라고요.", "아니요, 괜찮았더니요."]}, {"sit": "Tu te retenais de rire. Tu as craqué.", "ok": "참으려고 했지만 웃고 말았어요.", "alts": ["참으려고 했지만 웃어 버렸어요.", "참으려고 했지만 웃더라고요."]}, {"sit": "Tu as tout mangé, et franchement c'est très bien ainsi.", "ok": "다 먹어 버렸어요.", "alts": ["다 먹고 말았어요.", "다 먹었더니요."]}];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length){order=shuffle(QUESTIONS.slice());idx=0;}
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},700);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=12?'Ces tournures sont devenues un réflexe. C\'est ça, parler coréen.':score>=6?'Bien joué. Le couple 길래 / 김에 mérite encore un tour.':'Reprends les trois leçons de l\'unité, puis rejoue.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_d56',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_d56');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
