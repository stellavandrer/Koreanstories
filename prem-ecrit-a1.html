<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Inter','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
/* NAV */

.tnav-back{display:flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--bd);border-radius:100px;color:var(--gold);font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;transition:all .2s}
.tnav-back:hover{border-color:var(--gold);background:var(--gold-light)}
.tnav-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--text);font-style:italic}
.tnav-xp{font-size:12px;font-weight:700;color:var(--gold);background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.25);padding:5px 12px;border-radius:20px}
/* UNIT TABS */
.unit-tabs{display:flex;gap:8px;padding:14px 18px;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none}
.unit-tabs::-webkit-scrollbar{display:none}
.utab{flex-shrink:0;padding:7px 14px;border-radius:100px;border:1.5px solid var(--bd);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .2s;background:none}
.utab.active{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,0.1)}
/* HERO */
.hero{padding:20px 18px 8px;text-align:center}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);border-radius:100px;padding:5px 14px;font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.hero h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin-bottom:4px}
.hero h2 em{color:var(--gold);font-style:italic}
.hero-sub{font-size:13px;color:var(--text2)}
/* PROGRESS BAR */
.prog-bar-wrap{padding:12px 18px 0}
.prog-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--text2)}
.prog-info strong{color:var(--text);font-weight:700}
.prog-bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .5s ease}
/* STATS ROW */
.stats-row{display:flex;gap:8px;padding:12px 18px;justify-content:center}
.stat-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bd);border-radius:100px;padding:6px 14px;font-size:12px;font-weight:600}
.stat-chip .sc-icon{font-size:14px}
/* FLASHCARD AREA */
.card-area{padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:16px}
/* 3D Flip Card */
.flip-card{width:100%;max-width:380px;height:220px;perspective:1000px;cursor:pointer}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;border:1px solid var(--bd)}
.flip-front{background:var(--bg2);border-color:rgba(201,169,110,0.2)}
.flip-back{background:linear-gradient(135deg,#1a2e45,#162236);transform:rotateY(180deg);border-color:rgba(201,169,110,0.3)}
.card-unit-tag{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;opacity:.7}
.card-kr{font-family:'Noto Sans KR',sans-serif;font-size:44px;font-weight:700;color:var(--text);text-align:center;line-height:1.2;margin-bottom:8px}
.card-hint{font-size:12px;color:var(--text3);margin-top:8px}
.card-tap{font-size:11px;color:var(--text3);margin-top:12px;display:flex;align-items:center;gap:4px}
.card-fr{font-size:20px;font-weight:700;color:var(--text);text-align:center;margin-bottom:8px;line-height:1.3}
.card-rom{font-size:13px;color:var(--gold);font-style:italic;margin-bottom:12px}
.card-example{font-size:12px;color:var(--text2);text-align:center;line-height:1.6;max-width:280px;background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 14px;width:100%}
/* ACTION BUTTONS */
.action-btns{display:flex;gap:10px;width:100%;max-width:380px}
.action-btn{flex:1;padding:13px 8px;border-radius:14px;border:1.5px solid;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-wrong{border-color:rgba(244,114,182,0.4);color:#f472b6;background:rgba(244,114,182,0.08)}
.btn-wrong:hover{background:rgba(244,114,182,0.15)}
.btn-hard{border-color:rgba(251,191,36,0.4);color:#fbbf24;background:rgba(251,191,36,0.08)}
.btn-hard:hover{background:rgba(251,191,36,0.15)}
.btn-easy{border-color:rgba(34,197,94,0.4);color:#22c55e;background:rgba(34,197,94,0.08)}
.btn-easy:hover{background:rgba(34,197,94,0.15)}
.action-btns.hidden{opacity:0;pointer-events:none}
/* FLIP HINT */
.flip-hint{font-size:12px;color:var(--text3);text-align:center;padding:4px 0}
/* COMPLETION */
.completion{display:none;flex-direction:column;align-items:center;text-align:center;padding:40px 18px;gap:16px}
.completion.show{display:flex}
.comp-icon{width:72px;height:72px;border-radius:50%;background:rgba(201,169,110,0.15);border:2px solid rgba(201,169,110,0.4);display:flex;align-items:center;justify-content:center;font-size:32px}
.comp-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:600}
.comp-title em{color:var(--gold);font-style:italic}
.comp-sub{font-size:14px;color:var(--text2);line-height:1.6;max-width:280px}
.comp-xp{display:flex;align-items:center;gap:8px;background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.3);border-radius:100px;padding:10px 20px;font-size:16px;font-weight:800;color:var(--gold)}
.comp-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.btn-main{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#E8C98A);color:#0F1B2D;font-weight:800;font-size:15px;border:none;cursor:pointer}
.btn-secondary{width:100%;padding:13px;border-radius:14px;background:var(--bg3);border:1.5px solid var(--bd);color:var(--text2);font-weight:600;font-size:14px;cursor:pointer}
/* MAIN visible area */
.main-content{display:block}
/* SRS BADGE */
.srs-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:100px;padding:4px 12px;border:1px solid}
.srs-easy{color:#22c55e;border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.08)}
.srs-hard{color:#fbbf24;border-color:rgba(251,191,36,0.3);background:rgba(251,191,36,0.08)}
.srs-wrong{color:#f472b6;border-color:rgba(244,114,182,0.3);background:rgba(244,114,182,0.08)}
/* ACCURACY ROW */
.acc-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.acc-item{text-align:center}
.acc-val{font-size:22px;font-weight:800}
.acc-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}

    /* ── BOTTOM NAV ── */
    
    
    
    
    .bni.act svg{stroke:var(--gold)}.bni.act span{color:var(--gold)}
    body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
    @media(min-width:640px){body{padding-bottom:0}}

/* ── BNAV DOT NOTIFICATION ── */

const UNIT_ORDER = ['u_d1','u_d2','u_d3','u_d4','u_d5','u_a1_6','u_a1_7','u_a1_8','u_a1_9','u_a1_10','u_a1_11','u_a1_12','u_a1_13','u_a1_14','u_a1_15'];

// ── STATE ──────────────────────────────────────────────────────────────────
let currentUnit = 'u_d1';
let deck = [];        // cards still to review
let wrongPile = [];   // cards to repeat
let doneEasy = 0, doneHard = 0, doneWrong = 0;
let isFlipped = false;
let totalXP = parseInt(localStorage.getItem('ks_prem_ecrit_xp') || '0');

// ── INIT ──────────────────────────────────────────────────────────────────
function init() {
  const params = new URLSearchParams(window.location.search);
  const u = params.get('u');
  if (u && UNITS[u]) currentUnit = u;
  buildTabs();
  loadUnit(currentUnit);
  const _xpb=document.getElementById('xpBadge')||document.getElementById('xpEl'); if(_xpb)_xpb.textContent=totalXP+' XP';
}

function buildTabs() {
  const wrap = document.getElementById('unitTabs');
  wrap.innerHTML = '';
  UNIT_ORDER.forEach(uid => {
    const u = UNITS[uid];
    const btn = document.createElement('button');
    btn.className = 'utab' + (uid === currentUnit ? ' active' : '');
    btn.textContent = u.name;
    btn.onclick = () => loadUnit(uid);
    wrap.appendChild(btn);
  });
}

function loadUnit(uid) {
  currentUnit = uid;
  buildTabs();
  const u = UNITS[uid];
  document.getElementById('unitSub').textContent = u.sub;
  deck = [...u.cards].sort(() => Math.random() - 0.5);
  wrongPile = [];
  doneEasy = 0; doneHard = 0; doneWrong = 0;
  document.getElementById('completionScreen').classList.remove('show');
  document.getElementById('mainContent').style.display = 'block';
  showCard();
  updateStats();
}

function showCard() {
  if (deck.length === 0 && wrongPile.length === 0) {
    showCompletion();
    return;
  }
  if (deck.length === 0) {
    deck = [...wrongPile];
    wrongPile = [];
  }
  const card = deck[0];
  const u = UNITS[currentUnit];
  isFlipped = false;
  document.getElementById('flipCard').classList.remove('flipped');
  document.getElementById('actionBtns').classList.add('hidden');
  document.getElementById('flipHint').style.opacity = '1';

  document.getElementById('cardUnitTag').textContent = u.name.toUpperCase();
  document.getElementById('cardKr').textContent = card.kr;
  document.getElementById('cardFr').textContent = card.fr;
  document.getElementById('cardRom').textContent = '[ ' + card.rom + ' ]';
  document.getElementById('cardEx').textContent = card.ex;

  const total = u.cards.length;
  const done = doneEasy + doneHard;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('cardNum').textContent = done + 1;
  document.getElementById('cardTotal').textContent = total;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').innerHTML = 'Carte <strong>' + (done + 1) + '</strong> / <strong>' + total + '</strong>';
  if (pct > 0) document.getElementById('accLabel').textContent = pct + '% vu';
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  document.getElementById('flipCard').classList.add('flipped');
  document.getElementById('actionBtns').classList.remove('hidden');
  document.getElementById('flipHint').style.opacity = '0';
}

function rate(result) {
  const card = deck.shift();
  if (result === 'easy') { doneEasy++; }
  else if (result === 'hard') { doneHard++; deck.push(card); }
  else { doneWrong++; wrongPile.push(card); }
  updateStats();
  showCard();
}

function updateStats() {
  document.getElementById('statEasy').textContent = doneEasy + ' sus';
  document.getElementById('statHard').textContent = doneHard + ' difficile';
  document.getElementById('statWrong').textContent = doneWrong + ' à revoir';
}

function showCompletion() {
  document.getElementById('mainContent').style.display = 'none';
  const total = doneEasy + doneHard + doneWrong;
  const accuracy = total > 0 ? Math.round(doneEasy / total * 100) : 0;
  const xpEarned = doneEasy * 5 + doneHard * 2;
  totalXP += xpEarned;
  localStorage.setItem('ks_prem_ecrit_xp', totalXP);
  const _xpb=document.getElementById('xpBadge')||document.getElementById('xpEl'); if(_xpb)_xpb.textContent=totalXP+' XP';

  let msg = accuracy >= 80 ? 'Excellent ! Tu maîtrises ce vocabulaire.' : accuracy >= 50 ? 'Bien joué ! Continue à pratiquer.' : 'Continue — chaque révision t\'améliore !';
  document.getElementById('compSub').textContent = msg;
  document.getElementById('compStats').innerHTML =
    '<div class="acc-item"><div class="acc-val" style="color:#22c55e">' + doneEasy + '</div><div class="acc-label">Sus</div></div>' +
    '<div class="acc-item"><div class="acc-val" style="color:#fbbf24">' + doneHard + '</div><div class="acc-label">Difficile</div></div>' +
    '<div class="acc-item"><div class="acc-val" style="color:#f472b6">' + doneWrong + '</div><div class="acc-label">À revoir</div></div>' +
    '<div class="acc-item"><div class="acc-val" style="color:var(--gold)">' + accuracy + '%</div><div class="acc-label">Précision</div></div>';
  document.getElementById('compXP').textContent = '+' + xpEarned + ' XP gagné !';
  document.getElementById('completionScreen').classList.add('show');
}

function restartSession() {
  loadUnit(currentUnit);
}

function goBack() {
  if (window.parent && typeof window.parent.closeCPanel === 'function') {
    window.parent.closeCPanel();
  } else {
    history.back();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
