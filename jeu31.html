<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Déplacement ou pas ?</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Déplacement ou pas ?</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Déplacement ou pas ?</h2>
  <span class="pill">B1 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Choisis la bonne phrase — -(으)러 가다/오다 (déplacement) ou -기 위해서 (n'importe quel verbe) — avant la fin du chrono !</p>
    <button class="start-btn" onclick="startGame()">Commencer →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"« Je suis venu(e) voir la chambre » (오다 = déplacement)",ok:"방 보러 왔어요",alts:["방 보기 위해서 왔어요","방 보면 왔어요"]},
  {sit:"« Qu'est-ce qu'il faut pour réussir ? » (aucun déplacement)",ok:"성공하기 위해 뭐가 필요해요?",alts:["성공하러 뭐가 필요해요?","성공하고 뭐가 필요해요?"]},
  {sit:"« Je suis venu(e) pour prendre des photos » (오다 = déplacement)",ok:"사진을 찍으러 왔어요",alts:["사진을 찍기 때문에 왔어요","사진을 찍는가 봐요"]},
  {sit:"« J'étudie dur pour réussir l'examen » (합격하다 n'est pas un déplacement)",ok:"시험에 합격하기 위해서 열심히 공부해요",alts:["시험에 합격하러 열심히 공부해요","시험에 합격할 줄 알아요"]},
  {sit:"« Je vais à l'institut pour apprendre le coréen » (다니다 = déplacement)",ok:"한국어를 배우러 학원에 다녀요",alts:["한국어를 배우기 위해서 학원이에요","한국어를 배우는가 봐요"]},
  {sit:"« Je fais un petit boulot pour économiser » (모으다 n'est pas un déplacement)",ok:"돈을 모으기 위해서 아르바이트를 해요",alts:["돈을 모으러 아르바이트를 해요","돈을 모으니까 아르바이트를 해요"]},
  {sit:"« Il est allé au marché pour acheter des légumes » (가다 = déplacement)",ok:"채소를 사러 시장에 갔어요",alts:["채소를 사기 위해서 시장이었어요","채소를 사고 시장에 갔어요"]},
  {sit:"« Nous étudions pour protéger l'environnement » (보호하다 n'est pas un déplacement)",ok:"환경을 보호하기 위해서 공부해요",alts:["환경을 보호하러 공부해요","환경을 보호하기 때문에 공부해요"]},
  {sit:"« Réservé aux verbes de déplacement » (structure)",ok:"으러 가다/오다",alts:["기 위해서","기 때문에"]},
  {sit:"« Fonctionne avec n'importe quel verbe » (structure)",ok:"기 위해서",alts:["으러 가다","는가 봐요"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.tabIndex=0;b.setAttribute('role','button');b.onclick=()=>pick(b,o.c,q);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' réponses';
  document.getElementById('finalMsg').textContent=score>=11?'-(으)러 et -기 위해서 dans la poche !':score>=6?'Bien joué — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_c09bd',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_c09bd');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
