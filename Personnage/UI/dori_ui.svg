<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" fill="none">
<defs>
  <!-- Warm sunny gold -->
  <radialGradient id="dBody" cx="38%" cy="22%" r="68%">
    <stop offset="0%"  stop-color="#FFFCE0"/>
    <stop offset="45%" stop-color="#FFD800"/>
    <stop offset="100%" stop-color="#E09000"/>
  </radialGradient>
  <radialGradient id="dShine" cx="36%" cy="20%" r="60%">
    <stop offset="0%"  stop-color="rgba(255,255,248,0.58)"/>
    <stop offset="100%" stop-color="rgba(255,248,180,0)"/>
  </radialGradient>
  <!-- Deep navy iris -->
  <radialGradient id="dEye" cx="35%" cy="30%" r="64%">
    <stop offset="0%"  stop-color="#1E2060"/>
    <stop offset="100%" stop-color="#060212"/>
  </radialGradient>
  <!-- Soft glow aura -->
  <radialGradient id="dGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#FFE840" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#FFE840" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ▸ GLOW aura -->
<ellipse cx="110" cy="130" rx="96" ry="90" fill="url(#dGlow)"/>

<!-- ▸ STAR BODY — 5 pointed, rounded Q bezier, Korean 별 style
     Outer r=82 (tips), Inner r=45 (valleys) — clearly a star, softly rounded -->
<path d="
  M 123,69
  Q 136,92   162,97.5
  Q 188,103  170.5,122.5
  Q 153,142  155.5,168
  Q 158,194  134,183.5
  Q 110,173  86,183.5
  Q 62,194   64.5,168
  Q 67,142   49.5,122.5
  Q 32,103   58,97.5
  Q 84,92    97,69
  Q 110,46   123,69Z
" fill="url(#dBody)" stroke="#C88800" stroke-width="2.5"/>

<!-- Shine overlay -->
<path d="
  M 123,69
  Q 136,92   162,97.5
  Q 188,103  170.5,122.5
  Q 153,142  155.5,168
  Q 158,194  134,183.5
  Q 110,173  86,183.5
  Q 62,194   64.5,168
  Q 67,142   49.5,122.5
  Q 32,103   58,97.5
  Q 84,92    97,69
  Q 110,46   123,69Z
" fill="url(#dShine)"/>

<!-- ▸ ROSY CHEEKS -->
<ellipse cx="80"  cy="122" rx="18" ry="12" fill="#FF8EA8" opacity=".36"/>
<ellipse cx="140" cy="122" rx="18" ry="12" fill="#FF8EA8" opacity=".36"/>

<!-- ▸ LEFT EYE — pure round, zero lashes, Disney/Sanrio clean -->
<circle cx="88" cy="108" r="18" fill="white"/>
<circle cx="88" cy="109" r="14" fill="url(#dEye)"/>
<circle cx="88" cy="110" r="9"  fill="#040212"/>
<circle cx="82" cy="103" r="6"  fill="white"/>
<circle cx="94" cy="117" r="2.5" fill="white" opacity=".50"/>

<!-- ▸ RIGHT EYE — mirror -->
<circle cx="132" cy="108" r="18" fill="white"/>
<circle cx="132" cy="109" r="14" fill="url(#dEye)"/>
<circle cx="132" cy="110" r="9"  fill="#040212"/>
<circle cx="126" cy="103" r="6"  fill="white"/>
<circle cx="138" cy="117" r="2.5" fill="white" opacity=".50"/>

<!-- ▸ CUTE SMILE — soft gentle arc, no W, no nose -->
<path d="M 100,134 Q 110,145 120,134" stroke="#D08090" stroke-width="2.5" stroke-linecap="round" fill="none"/>

<!-- ▸ Korean dancheong dots — belly -->
<circle cx="103" cy="157" r="3"   fill="#CC3040" opacity=".48"/>
<circle cx="110" cy="159" r="3.5" fill="#2044B8" opacity=".44"/>
<circle cx="117" cy="157" r="3"   fill="#CC3040" opacity=".48"/>

<!-- ▸ Korean star tip accents — dancheong red & blue on each point -->
<circle cx="110" cy="50"  r="4"   fill="#CC3040" opacity=".42"/>
<circle cx="186" cy="105" r="3.5" fill="#2044B8" opacity=".38"/>
<circle cx="157" cy="192" r="3.5" fill="#CC3040" opacity=".35"/>
<circle cx="63"  cy="192" r="3.5" fill="#2044B8" opacity=".35"/>
<circle cx="34"  cy="105" r="3.5" fill="#CC3040" opacity=".38"/>

<!-- ▸ Floating sparkle stars -->
<path d="M176 50 L178.5 43 L181 50 L188 52.5 L181 55 L178.5 62 L176 55 L169 52.5Z" fill="#FFD800" opacity=".86"/>
<path d="M38 72 L40.5 65 L43 72 L50 74.5 L43 77 L40.5 84 L38 77 L31 74.5Z" fill="#C9A96E" opacity=".68"/>
<circle cx="190" cy="80"  r="3"   fill="#FFF8A0" opacity=".80"/>
<circle cx="35"  cy="118" r="3"   fill="#C9A96E" opacity=".44"/>
<circle cx="200" cy="152" r="2"   fill="#FFF8A0" opacity=".55"/>
<circle cx="50"  cy="50"  r="2"   fill="#FFF8A0" opacity=".50"/>

<!-- ▸ Floating shadow below -->
<ellipse cx="110" cy="246" rx="46" ry="9" fill="#B87800" opacity=".13"/>
</svg>
