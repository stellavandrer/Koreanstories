<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" fill="none">
<defs>
  <linearGradient id="jSkin" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#FDE8D2"/><stop offset="100%" stop-color="#F2C8A8"/>
  </linearGradient>
  <linearGradient id="jHair" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#2C1E10"/><stop offset="100%" stop-color="#180C06"/>
  </linearGradient>
  <linearGradient id="jJacket" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#DAD2C6"/><stop offset="100%" stop-color="#C8C0B4"/>
  </linearGradient>
  <linearGradient id="jHoodie" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#EEEAE2"/><stop offset="100%" stop-color="#E0DACE"/>
  </linearGradient>
  <linearGradient id="jPants" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#2E3444"/><stop offset="100%" stop-color="#1C2030"/>
  </linearGradient>
  <linearGradient id="jEye" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#6B4030"/><stop offset="100%" stop-color="#3E2018"/>
  </linearGradient>
</defs>

