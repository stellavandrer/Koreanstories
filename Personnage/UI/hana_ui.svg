<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" fill="none">
<defs>
  <linearGradient id="hSkin" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#FDE8D2"/><stop offset="100%" stop-color="#F2C8A8"/>
  </linearGradient>
  <linearGradient id="hHair" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#3E2412"/><stop offset="100%" stop-color="#240E06"/>
  </linearGradient>
  <linearGradient id="hHairHi" x1=".3" y1="0" x2=".7" y2="1">
    <stop offset="0%" stop-color="#5C3420" stop-opacity=".5"/><stop offset="100%" stop-color="#3E2412" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hSweater" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#EDE5D8"/><stop offset="100%" stop-color="#DDD5C8"/>
  </linearGradient>
  <linearGradient id="hSkirt" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#8A5C3C"/><stop offset="100%" stop-color="#6A4028"/>
  </linearGradient>
  <linearGradient id="hEye" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0%" stop-color="#7B4D38"/><stop offset="100%" stop-color="#4A2418"/>
  </linearGradient>
</defs>

<!-- ▸ SKIRT (warm brown) -->
<path d="M74 355 Q70 398 55 460 L245 460 Q230 398 226 355Z" fill="url(#hSkirt)"/>
