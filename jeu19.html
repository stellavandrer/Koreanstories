  <meta charset="UTF-8">

  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto;width:100%}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#BE185D;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .listen{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:1rem;background:#DB2777;color:#fff;border:none;border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:.4rem}
    .listen svg{width:22px;height:22px;fill:currentColor}
    .hint{text-align:center;font-size:.82rem;color:var(--tx-muted);margin-bottom:.9rem}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
    .ph{position:relative;border:2.5px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1/1;background:var(--s2);transition:.15s}
    .ph img{width:100%;height:100%;object-fit:cover;display:block}
    .ph:hover{border-color:var(--accent-pink)}
    .ph.ok{border-color:#16A34A;box-shadow:0 0 0 3px rgba(22,163,74,.25)}
    .ph.ko{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
    .ph .tag{position:absolute;left:0;right:0;bottom:0;background:rgba(15,27,45,.72);color:#fff;font-size:1rem;font-weight:700;text-align:center;padding:.35rem;opacity:0;transition:.2s}
    .ph.reveal .tag{opacity:1}
    .fb{font-size:.9rem;margin-top:.8rem;min-height:1.2em;line-height:1.5;text-align:center}
    .next{display:block;width:100%;padding:.85rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:.8rem}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:var(--accent-pink)}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>

<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Jeu : Écoute &amp; Trouve</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Écoute & Trouve</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Écoute & Trouve</h2>
  <span class="pill">Écoute · 12 mots</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Rejouer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const POOL=[
  {img:'img/vocab/resto-samgyeopsal.webp',kr:'삼겹살',fr:'poitrine de porc grillée'},
  {img:'img/vocab/resto-menu.webp',kr:'메뉴',fr:'le menu'},
  {img:'img/vocab/resto-epice.webp',kr:'떡볶이',fr:'tteokbokki'},
  {img:'img/vocab/resto-takeout.webp',kr:'포장',fr:'à emporter'},
  {img:'img/vocab/transport-metro.webp',kr:'지하철',fr:'le métro'},
  {img:'img/vocab/transport-taxi.webp',kr:'택시',fr:'le taxi'},
  {img:'img/vocab/transport-station.webp',kr:'역',fr:'la station'},
  {img:'img/vocab/loisir-film.webp',kr:'영화',fr:'le film'},
  {img:'img/vocab/loisir-cuisine.webp',kr:'요리',fr:'la cuisine'},
  {img:'img/vocab/loisir-sport.webp',kr:'운동',fr:'le sport'},
  {img:'img/vocab/loisir-musique.webp',kr:'음악',fr:'la musique'},
  {img:'img/vocab/famille-famille.webp',kr:'가족',fr:'la famille'},
  {img:'img/vocab/famille-doctor.webp',kr:'의사',fr:'le médecin'},
  {img:'img/vocab/ex5-dress.webp',kr:'드레스',fr:'la robe'},
  {img:'img/vocab/ex5-sky.webp',kr:'하늘',fr:'le ciel'},
  {img:'img/vocab/ex5-house.webp',kr:'집',fr:'la maison'},
  {img:'img/vocab/ex5-coffee.webp',kr:'커피',fr:'le café'},
  {img:'img/vocab/ex5-cat.webp',kr:'고양이',fr:'le chat'},
  {img:'img/vocab/ex5-snow.webp',kr:'눈',fr:'la neige'},
  {img:'img/vocab/ex5-bag.webp',kr:'가방',fr:'le sac'},
  {img:'img/vocab/ex5-flowers.webp',kr:'꽃',fr:'les fleurs'},
  {img:'img/vocab/magasin-shoes.webp',kr:'신발',fr:'les chaussures'},
  {img:'img/vocab/magasin-store.webp',kr:'백화점',fr:'le grand magasin'}
];
const ROUNDS=12;
let order=[],cur=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function say(w){ if(typeof window.speak==='function'){ try{window.speak(w);}catch(e){} } }
function start(){
  order=shuffle(POOL.slice()).slice(0,ROUNDS);
  cur=0;score=0;
  document.getElementById('resultArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  render();
}
function render(){
  answered=false;
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const others=shuffle(POOL.filter(p=>p.kr!==q.kr)).slice(0,3);
  const cells=shuffle([q,...others]);
  let html='<div class="card">';
  html+='<button class="listen" id="listenBtn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07" fill="none" stroke="currentColor" stroke-width="2"/></svg> Écouter le mot</button>';
  html+='<div class="hint">Touche la photo qui correspond au mot entendu</div>';
  html+='<div class="grid">';
  cells.forEach(c=>{html+='<div class="ph" data-c="'+(c.kr===q.kr?1:0)+'" data-kr="'+c.kr+'"><img src="'+c.img+'" alt="" loading="lazy"><span class="tag">'+c.kr+'</span></div>';});
  html+='</div><div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.getElementById('listenBtn').onclick=()=>say(q.kr);
  document.querySelectorAll('.ph').forEach(p=>{p.onclick=()=>pick(p,q);p.tabIndex=0;p.setAttribute('role','button');p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(p,q);}};});
  setTimeout(()=>say(q.kr),350); /* lecture auto au début du round */
}
function pick(el,q){
  if(answered)return; answered=true;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  document.querySelectorAll('.ph').forEach(p=>{
    p.classList.add('reveal');
    if(p.getAttribute('data-c')==='1')p.classList.add('ok');
  });
  if(correct){score++;fb.style.color='#16A34A';fb.innerHTML='✓ <b>'+q.kr+'</b> — '+q.fr;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();fb.style.color='#dc2626';fb.innerHTML='✗ C\'était <b>'+q.kr+'</b> — '+q.fr;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=11?'Oreille parfaite ! Tu reconnais les mots au son.':score>=8?'Bien joué — réécoute les mots ratés.':'Continue : l\'écoute progresse vite avec la pratique !';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_a67',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_a67');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
