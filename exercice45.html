  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:560px;margin:0 auto}
    h1{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h1{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(219,39,119,.12);color:#DB2777;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#f9a8d4}
    .prog{height:6px;background:var(--bd);border-radius:100px;overflow:hidden;margin:1rem 0}
    .prog-fill{height:100%;background:#DB2777;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}
    .consigne{font-size:.8rem;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:.3rem}
    .phrase-fr{font-size:1rem;font-weight:600;line-height:1.5;margin-bottom:.9rem}
    .ligne{min-height:58px;border:1.5px dashed var(--bd);border-radius:10px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:flex-start;background:var(--bg)}
    .ligne.vide::before{content:'Touche les mots dans le bon ordre';color:var(--tx-muted);font-size:.85rem;font-style:italic}
    .ligne.ok{border-style:solid;border-color:#16A34A;background:rgba(22,163,74,.07)}
    .ligne.ko{border-style:solid;border-color:#ef4444;background:rgba(239,68,68,.06)}
    .banque{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
    .mot{padding:.45rem .7rem;border:1.5px solid var(--bd);border-radius:9px;background:var(--surf);font-size:.95rem;font-weight:600;cursor:pointer;transition:.12s;line-height:1.2}
    .mot:hover{border-color:#DB2777}
    .mot.pose{border-color:#DB2777;background:rgba(219,39,119,.08);color:#DB2777}
    [data-theme="dark"] .mot.pose{color:#f9a8d4}
    .mot:disabled,.mot.utilise{opacity:.28;cursor:default;pointer-events:none}
    .barre-btn{display:flex;gap:.5rem;margin-top:.9rem}
    .btn{flex:1;padding:.8rem;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx)}
    .btn.plein{background:#DB2777;color:#fff;border-color:#DB2777}
    .btn:disabled{opacity:.45;cursor:default}
    .fb{font-size:.86rem;margin-top:.7rem;line-height:1.55;min-height:1.2em}
    .fb .sol{font-weight:700;color:#16A34A}
    .result{text-align:center;padding:2rem 1rem}
    .result .score{font-size:2.4rem;font-weight:800;color:#DB2777}
    .result-btn{display:inline-block;margin-top:1.2rem;padding:.8rem 1.6rem;background:#DB2777;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-decoration:none}

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">&larr;</button><span class="bar-title">Construire son excuse</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Construire son excuse</h1>
  <span class="pill">B2 · 8 phrases à bâtir</span>
  <p style="color:var(--tx-muted);font-size:.9rem;margin:.5rem 0 0">Reconnaître la bonne forme est une chose, la produire en est une autre. Ici, tu reconstruis la phrase entière, dans l'ordre coréen.</p>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="zone"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">-</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="start()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +14 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const ITEMS=[{"fr": "J'étais au travail, je n'ai pas pu répondre.", "mots": ["일하느라고", "전화를", "못", "받았어요."], "note": "느라고 : mon temps y est passé."}, {"fr": "J'ai révisé pour l'examen, du coup je n'ai pas dormi.", "mots": ["시험", "공부를", "하느라고", "잠을", "못", "잤어요."], "note": "L'activité qui a englouti la nuit vient en premier."}, {"fr": "À cause de la pluie battante, la route était bouchée.", "mots": ["비가", "많이", "온", "탓에", "길이", "막혔어요."], "note": "Verbe au passé + -(으)ㄴ 탓에."}, {"fr": "Avec les travaux, je n'ai pas pu dormir.", "mots": ["공사를", "하는", "통에", "잠을", "못", "잤어요."], "note": "통에 reste toujours au présent en 는."}, {"fr": "Je me suis levé tard, et c'est bien ma faute.", "mots": ["늦게", "일어난", "탓에", "학교에", "늦었어요."], "note": "탓 désigne un responsable, ici moi-même."}, {"fr": "Avec les enfants qui criaient, je n'ai pas entendu le téléphone.", "mots": ["아이들이", "떠드는", "통에", "전화", "소리를", "못", "들었어요."], "note": "Le désordre d'abord, le dégât ensuite."}, {"fr": "Grâce à un ami, j'ai appris le coréen.", "mots": ["친구", "덕분에", "한국어를", "배웠어요."], "note": "덕분에 se pose directement après le nom."}, {"fr": "J'ai fait mes bagages en catastrophe, et j'ai oublié mon passeport.", "mots": ["급하게", "짐을", "싸는", "통에", "여권을", "두고", "왔어요."], "note": "두고 오다 : laisser derrière soi en partant."}];
let cur=0,score=0,pose=[],valide=false;

function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(){cur=0;score=0;document.getElementById('resultArea').style.display='none';document.getElementById('zone').style.display='block';render();}

function render(){
  const it=ITEMS[cur];pose=[];valide=false;
  document.getElementById('progFill').style.width=(cur/ITEMS.length*100)+'%';
  // un melange qui ne retombe pas sur l'ordre correct
  let banque=melange(it.mots);
  if(it.mots.length>1&&banque.join(' ')===it.mots.join(' '))banque=melange(it.mots.slice().reverse());
  const z=document.getElementById('zone');
  z.innerHTML='<div class="card">'
    +'<div class="consigne">Dis-le en coréen</div>'
    +'<div class="phrase-fr">'+it.fr+'</div>'
    +'<div class="ligne vide" id="ligne" aria-live="polite"></div>'
    +'<div class="banque" id="banque"></div>'
    +'<div class="barre-btn"><button class="btn" id="btnEffacer" onclick="effacer()">Effacer</button>'
    +'<button class="btn plein" id="btnValider" onclick="valider()" disabled>Vérifier</button></div>'
    +'<div class="fb" id="fb"></div></div>';
  const b=document.getElementById('banque');
  banque.forEach((m,i)=>{
    const el=document.createElement('button');
    el.className='mot';el.type='button';el.textContent=m;el.dataset.i=i;
    el.onclick=()=>poser(el,m);
    b.appendChild(el);
  });
}

function poser(el,mot){
  if(valide)return;
  el.classList.add('utilise');
  pose.push({mot:mot,src:el});
  majLigne();
}

function retirer(idx){
  if(valide)return;
  const e=pose.splice(idx,1)[0];
  e.src.classList.remove('utilise');
  majLigne();
}

function majLigne(){
  const l=document.getElementById('ligne');
  l.innerHTML='';
  l.classList.toggle('vide',pose.length===0);
  pose.forEach((e,i)=>{
    const el=document.createElement('button');
    el.className='mot pose';el.type='button';el.textContent=e.mot;
    el.setAttribute('aria-label','Retirer '+e.mot);
    el.onclick=()=>retirer(i);
    l.appendChild(el);
  });
  document.getElementById('btnValider').disabled=(pose.length!==ITEMS[cur].mots.length);
}

function valider(){
  if(valide)return;
  valide=true;
  const it=ITEMS[cur];
  const rep=pose.map(e=>e.mot).join(' ');
  const sol=it.mots.join(' ');
  const l=document.getElementById('ligne'),fb=document.getElementById('fb');
  document.getElementById('btnEffacer').disabled=true;
  document.getElementById('btnValider').disabled=true;
  if(rep===sol){
    score++;l.classList.add('ok');
    fb.innerHTML='<span style="color:#16A34A;font-weight:700">\u2713 '+it.note+'</span>';
    if(window.speak)window.speak(sol);
  }else{
    l.classList.add('ko');
    if(window.KSLives)KSLives.lose();
    fb.innerHTML='<span style="color:#dc2626;font-weight:700">\u2717 La phrase juste :</span> <span class="sol">'+sol+'</span><br><span style="color:var(--tx-muted)">'+it.note+'</span>';
    if(window.speak)window.speak(sol);
  }
  const btn=document.createElement('button');
  btn.className='btn plein';btn.style.marginTop='.8rem';btn.style.width='100%';
  btn.textContent=(cur+1<ITEMS.length)?'Suivant \u2192':'Voir mon score';
  btn.onclick=suivant;
  fb.parentNode.appendChild(btn);
}

function effacer(){if(valide)return;while(pose.length)retirer(pose.length-1);}

function suivant(){cur++;if(cur>=ITEMS.length){fin();return;}render();}

function fin(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('zone').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+ITEMS.length;
  document.getElementById('resultMsg').textContent=score>=7?'Tu construis ces phrases sans passer par le français. C\'est le but.':score>=4?'L\'ordre coréen est acquis, la forme causale hésite encore. Reprends le tableau des 5.':'Relis les trois leçons de l\'unité : ici il ne s\'agit plus de reconnaître, mais de produire.';
}

function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_d43',xp:14});else{if(typeof ksAddXP==='function')ksAddXP(14);if(typeof ksMarkDone==='function')ksMarkDone('ks_d43');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
