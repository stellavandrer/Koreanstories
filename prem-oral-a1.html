* {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--gold);
    }

    .topbar-title {
      flex: 1;
      text-align: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.125rem;
      font-weight: 700;
    }

    .topbar-mic {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
    }

    /* Unit tabs */
    .unit-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      background-color: var(--bg2);
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
      scroll-behavior: smooth;
    }

    .unit-tab {
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(201, 169, 110, 0.3);
      background-color: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .unit-tab.active {
      background-color: var(--gold);
      color: var(--bg);
      border-color: var(--gold);
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Status pill */
    .status-pill {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: rgba(201, 169, 110, 0.15);
      border: 1px solid rgba(201, 169, 110, 0.3);
      border-radius: 20px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: flex-start;
    }

    /* Card */
    .card {
      background-color: var(--bg2);
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .card-korean {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1.2;
    }

    .card-french {
      font-size: 1rem;
      color: rgba(247, 248, 250, 0.8);
      font-weight: 400;
    }

    /* Progress */
    .progress-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.875rem;
      color: rgba(247, 248, 250, 0.7);
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background-color: rgba(201, 169, 110, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--gold);
      transition: width 0.3s ease;
    }

    /* Buttons */
    .btn {
      padding: 1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background-color: var(--gold);
      color: var(--bg);
      width: 100%;
    }

    .btn-primary:hover {
      background-color: #d4b896;
      transform: translateY(-2px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      width: 100%;
    }

    .btn-secondary:hover {
      background-color: rgba(201, 169, 110, 0.1);
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    .btn-group button {
      flex: 1;
    }

    /* Mic button */
    .mic-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--gold);
      color: var(--bg);
      border: none;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1rem auto;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .mic-btn:hover {
      transform: scale(1.05);
    }

    .mic-btn:active {
      transform: scale(0.95);
    }

    .mic-btn.recording {
      animation: pulse-glow 1.5s infinite;
    }

    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 0 0 rgba(201, 169, 110, 0.7);
      }
      70% {
        box-shadow: 0 0 0 20px rgba(201, 169, 110, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(201, 169, 110, 0);
      }
    }

    /* Transcript box */
    .transcript-box {
      background-color: rgba(201, 169, 110, 0.1);
      border: 1px solid rgba(201, 169, 110, 0.2);
      border-radius: 8px;
      padding: 1rem;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(247, 248, 250, 0.8);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 1.125rem;
      word-break: break-word;
    }

    .transcript-box.empty {
      color: rgba(247, 248, 250, 0.4);
    }

    /* Score circle */
    .score-circle-wrapper {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      position: relative;
    }

    .score-circle svg {
      width: 100%;
      height: 100%;
    }

    .score-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Feedback */
    .feedback {
      text-align: center;
      padding: 1rem;
    }

    .feedback-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .feedback-message {
      font-size: 0.875rem;
      color: rgba(247, 248, 250, 0.8);
      line-height: 1.6;
    }

    /* Comparison */
    .comparison {
      background-color: rgba(201, 169, 110, 0.05);
      border: 1px solid rgba(201, 169, 110, 0.15);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.875rem;
    }

    .comparison-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      gap: 1rem;
    }

    .comparison-row:last-child {
      margin-bottom: 0;
    }

    .comparison-label {
      color: rgba(247, 248, 250, 0.6);
    }

    .comparison-value {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 600;
      color: var(--text);
    }

    /* Completion banner */
    .completion-banner {
      background: linear-gradient(135deg, rgba(201, 169, 110, 0.2), rgba(34, 197, 94, 0.1));
      border: 1px solid var(--gold);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .completion-xp {
      font-size: 2.5rem;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .completion-text {
      color: var(--text);
      margin-bottom: 1rem;
    }

    /* Warning banner */
    .warning-banner {
      background-color: rgba(244, 114, 182, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.3);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      color: rgba(247, 248, 250, 0.9);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .hidden {
      display: none;
    }

    let currentPhase = 1; // 1: listen, 2: repeat, 3: result
    let currentScore = 0;
    let attemptCount = 0;
    let recognitionText = '';
    let recognizer = null;

    if (hasSpeechRecognition) {
      recognizer = new SR();
      recognizer.lang = 'ko-KR';
      recognizer.continuous = false;
      recognizer.interimResults = true;
    }

    function initApp() {
      renderUnitTabs();
      renderContent();
      if (!hasSpeechRecognition) {
        document.getElementById('warningBanner').classList.remove('hidden');
      }
    }

    function renderUnitTabs() {
      const tabsContainer = document.getElementById('unitTabs');
      tabsContainer.innerHTML = '';
      Object.entries(UNITS_DATA).forEach(([key, data]) => {
        const tab = document.createElement('button');
        tab.className = `unit-tab ${key === currentUnit ? 'active' : ''}`;
        tab.textContent = data.title;
        tab.onclick = () => {
          currentUnit = key;
          currentPhrase = 0;
          currentPhase = 1;
          renderUnitTabs();
          renderContent();
        };
        tabsContainer.appendChild(tab);
      });
    }

    function scorePhrase(expected, recognized) {
      const e = expected.replace(/[^가-힣]/g, '').toLowerCase();
      const r = (recognized || '').replace(/[^가-힣]/g, '').toLowerCase();
      if (!r) return 0;
      if (e === r) return 100;
      let matches = 0;
      for (let i = 0; i < Math.min(e.length, r.length); i++) {
        if (e[i] === r[i]) matches++;
      }
      const overlap = matches / Math.max(e.length, r.length);
      const bonus = r.includes(e) || e.includes(r) ? 0.3 : 0;
      return Math.min(100, Math.round((overlap + bonus) * 100));
    }

    function renderContent() {
      const unit = UNITS_DATA[currentUnit];
      const phrase = unit.phrases[currentPhrase];
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '';

      const progressPercent = ((currentPhrase + 1) / unit.phrases.length) * 100;

      let html = `
        <div class="status-pill">Phase ${currentPhase} — ${currentPhase === 1 ? 'Écouter' : currentPhase === 2 ? 'Répéter' : 'Résultat'}</div>
        <div class="card">
          <div class="card-korean">${phrase.kr}</div>
          <div class="card-french">${phrase.fr}</div>
        </div>
        <div class="progress-section">
          <span>${currentPhrase + 1} / ${unit.phrases.length}</span>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%"></div>
          </div>
        </div>
      `;

      if (currentPhase === 1) {
        html += `
          <button class="btn btn-primary" onclick="playTTS('${phrase.kr}')"><svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round"><polyline points="9 18 15 12 9 6"/></svg> Écouter</button>
          <button id="nextPhaseBtn" class="btn btn-secondary hidden" onclick="goToPhase2()">J'ai écouté →</button>
        `;
      } else if (currentPhase === 2) {
        html += `
          <button class="mic-btn" id="micBtn" onclick="toggleRecording()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
          <div class="transcript-box empty" id="transcriptBox">En attente...</div>
          <div id="attemptsInfo" style="text-align: center; font-size: 0.875rem; color: rgba(247, 248, 250, 0.6);">Tentatives: ${attemptCount}/3</div>
          <button id="viewScoreBtn" class="btn btn-secondary hidden" onclick="goToPhase3()">Voir mon score</button>
          <button id="retryBtn" class="btn btn-secondary hidden" onclick="resetPhase2()">Réessayer</button>
        `;
      } else {
        const feedback = currentScore >= 80 ? 'Excellent !' : currentScore >= 50 ? 'Bien !' : 'À améliorer !';
        const feedbackColor = currentScore >= 80 ? '#22c55e' : currentScore >= 50 ? '#C9A96E' : '#f472b6';
        html += `
          <div class="score-circle-wrapper">
            <div class="score-circle">
              <svg viewBox="0 0 140 140">
                <circle cx="70" cy="70" r="65" fill="none" stroke="rgba(201, 169, 110, 0.2)" stroke-width="4" />
                <circle id="scoreCircle" cx="70" cy="70" r="65" fill="none" stroke="${feedbackColor}" stroke-width="4"
                  stroke-dasharray="408" stroke-dashoffset="408" style="transform: rotate(-90deg); transform-origin: 70px 70px; transition: stroke-dashoffset 1s ease-out;" />
              </svg>
              <div class="score-text">${currentScore}%</div>
            </div>
          </div>
          <div class="feedback">
            <div class="feedback-title">${feedback}</div>
            <div class="feedback-message" id="feedbackMsg"></div>
          </div>
          <div class="comparison">
            <div class="comparison-row">
              <span class="comparison-label">Attendu:</span>
              <span class="comparison-value">${phrase.kr}</span>
            </div>
            <div class="comparison-row">
              <span class="comparison-label">Reconnu:</span>
              <span class="comparison-value">${recognitionText || '(silence)'}</span>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn btn-secondary" onclick="resetPhase2()">Réessayer</button>
            <button class="btn btn-primary" onclick="nextPhrase()">Suivant →</button>
          </div>
        `;
      }

      contentArea.innerHTML = html;

      if (currentPhase === 1) {
        setTimeout(() => {
          document.getElementById('nextPhaseBtn').classList.remove('hidden');
        }, 500);
      } else if (currentPhase === 3) {
        setTimeout(() => {
          const offset = 408 - (currentScore / 100) * 408;
          document.getElementById('scoreCircle').style.strokeDashoffset = offset;
        }, 100);
      }
    }

    function playTTS(text) {
      /* Priorité au système InJoon (ks.js → audio/injoon/*.mp3) */

      if (typeof window.speak === 'function') { window.speak(text); return; }

      /* pas de repli en voix de synthèse : règle produit « zéro voix robotique » */
    }

    function goToPhase2() {
      currentPhase = 2;
      attemptCount = 0;
      recognitionText = '';
      renderContent();
    }

    function toggleRecording() {
      if (!hasSpeechRecognition) return;
      if (recognizer.isRecording) {
        recognizer.stop();
      } else {
        attemptCount++;
        recognitionText = '';
        recognizer.start();
        document.getElementById('micBtn').classList.add('recording');
      }
    }

    if (hasSpeechRecognition && recognizer) {
      recognizer.onstart = () => {
        document.getElementById('micBtn').classList.add('recording');
      };

      recognizer.onresult = (event) => {
        const transcript = Array.from(event.results)
          .map(r => r[0].transcript)
          .join('');
        recognitionText = transcript;
        const box = document.getElementById('transcriptBox');
        if (box) {
          box.textContent = transcript;
          box.classList.remove('empty');
        }
      };

      recognizer.onend = () => {
        document.getElementById('micBtn').classList.remove('recording');
        const unit = UNITS_DATA[currentUnit];
        const phrase = unit.phrases[currentPhrase];
        currentScore = scorePhrase(phrase.kr, recognitionText);

        const viewScoreBtn = document.getElementById('viewScoreBtn');
        const retryBtn = document.getElementById('retryBtn');
        if (viewScoreBtn && attemptCount >= 3) {
          viewScoreBtn.classList.remove('hidden');
          if (retryBtn) retryBtn.classList.add('hidden');
        } else if (viewScoreBtn) {
          retryBtn.classList.remove('hidden');
          viewScoreBtn.classList.add('hidden');
        }
      };

      recognizer.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
      };
    }

    function resetPhase2() {
      currentPhase = 2;
      recognitionText = '';
      renderContent();
    }

    function goToPhase3() {
      currentPhase = 3;
      renderContent();
    }

    function nextPhrase() {
      const unit = UNITS_DATA[currentUnit];
      if (currentPhrase < unit.phrases.length - 1) {
        currentPhrase++;
        currentPhase = 1;
        attemptCount = 0;
        recognitionText = '';
        renderContent();
      } else {
        // Unit complete
        saveProgress();
        showCompletion();
      }
    }

    function saveProgress() {
      let progress = JSON.parse(localStorage.getItem('ks_prem_oral') || '{}');
      const unit = UNITS_DATA[currentUnit];
      progress[currentUnit] = unit.phrases.length;
      localStorage.setItem('ks_prem_oral', JSON.stringify(progress));
    }

    function showCompletion() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = `
        <div class="completion-banner">
          <div class="completion-xp">+75 XP</div>
          <div class="completion-text">Unité complétée !</div>
          <button class="btn btn-primary" onclick="location.reload()">Retour aux unités</button>
        </div>
      `;
    }

    initApp();
  </script>

<script>
(function(){
  var SVG_MOON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
  var SVG_SUN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  try{var t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  function sync(){var b=document.getElementById('darkFab');if(!b)return;var d=document.documentElement.getAttribute('data-theme')==='dark';b.innerHTML=d?SVG_SUN:SVG_MOON;b.style.opacity=d?'1':'.7';}
  window.toggleDarkGlobal=function(){var d=document.documentElement.getAttribute('data-theme')==='dark';var t=d?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ks_theme',t);}catch(e){}sync();};
  sync();
})();
</script>
<button id="darkFab" onclick="toggleDarkGlobal()" title="Mode sombre" aria-label="Basculer mode sombre" style="position:fixed;bottom:82px;right:14px;z-index:150;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bd);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:all .2s;opacity:.75"></button>


  <script src="ks-menu.js" defer></script>
</body>
