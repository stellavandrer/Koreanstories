    .prog-fill{height:100%;background:#4F46E5;width:0;border-radius:100px;transition:width .4s}
    .card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:1.1rem 1.2rem;margin:.9rem 0}

<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Le but</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Le but : -(으)러 vs -기 위해서</h1>
  <span class="pill">B1 · 8 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">—</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +12 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[
  {fr:"« Je vais au restaurant pour manger » (가다 = déplacement)",txt:"밥을 먹___ 식당에 가요",opts:["으러","기 위해서","으면"],ans:0,exp:"-(으)러 marche car le verbe principal est 가다 (déplacement)."},
  {fr:"« Je fais du sport pour ma santé » (운동하다 n'est pas un déplacement)",txt:"건강___ 운동해요",opts:["을 위해서","하러","하고"],ans:0,exp:"운동하다 ne mène nulle part : impossible d'utiliser -(으)러 ici, il faut -기/을 위해서."},
  {fr:"« Je suis venu(e) pour prendre des photos » (오다 = déplacement)",txt:"사진을 찍___ 왔어요",opts:["으러","기 때문에","는가 봐요"],ans:0,exp:"오다 est un verbe de déplacement : -(으)러 est la structure naturelle."},
  {fr:"« J'étudie dur pour réussir l'examen » (합격하다 n'est pas un déplacement)",txt:"시험에 합격___ 열심히 공부해요",opts:["하기 위해서","하러","할 줄 알아요"],ans:0,exp:"합격하다 n'implique aucun déplacement : -기 위해서 est obligatoire."},
  {fr:"« Je vais à l'institut pour apprendre le coréen » (다니다 = fréquenter, déplacement)",txt:"한국어를 배우___ 학원에 다녀요",opts:["러","기 위해서","면"],ans:0,exp:"다니다 (fréquenter un lieu) est un verbe de déplacement : -(으)러 convient."},
  {fr:"« Je fais un petit boulot pour économiser de l'argent » (모으다 n'est pas un déplacement)",txt:"돈을 모으___ 아르바이트를 해요",opts:["기 위해서","러","니까"],ans:0,exp:"모으다 (économiser) n'est pas un verbe de déplacement : -기 위해서 s'impose."},
  {fr:"« Il est allé au marché pour acheter des légumes » (가다 = déplacement)",txt:"채소를 사___ 시장에 갔어요",opts:["러","기 위해서","고"],ans:0,exp:"가다 est un verbe de déplacement : -(으)러 fonctionne parfaitement."},
  {fr:"« Nous étudions pour protéger l'environnement » (보호하다 n'est pas un déplacement)",txt:"환경을 보호하___ 공부해요",opts:["기 위해서","러","기 때문에"],ans:0,exp:"보호하다 n'implique aucun déplacement : -기 위해서 est la seule option correcte."}
];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant →</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='✓ '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='✗ '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=7?'Parfait ! Déplacement ou pas, tu sais choisir la bonne structure.':score>=5?'Bien — repense à te demander : le verbe principal mène-t-il quelque part ?':'Reprends la leçon « Le but » puis réessaie.';
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_c09bc',xp:12});else{if(typeof ksAddXP==='function')ksAddXP(12);if(typeof ksMarkDone==='function')ksMarkDone('ks_c09bc');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
