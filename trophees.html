<script>
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsi(k){var v=parseInt(ls(k)||'0',10);return isNaN(v)?0:v;}

/* Compteurs dérivés du localStorage */
function countDone(prefix){
  var n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf(prefix)===0 && (localStorage.getItem(k)==='done'||localStorage.getItem(k)==='1')){
        n++;
      }
    }
  }catch(e){}
  return n;
}
function countActivities(){
  /* Total d'activités complétées via ks_h*, ks_a*, ks_b*, ks_c*, ks_d* */
  var n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(!k) continue;
      var m=k.match(/^ks_[habcd][_0-9a-z]+$/);
      if(m && (localStorage.getItem(k)==='done'||localStorage.getItem(k)==='1')) n++;
    }
  }catch(e){}
  return n;
}
function getXP(){return lsi('ks_xp');}
function getStreak(){return lsi('ks_streak');}
function getBestStreak(){return lsi('ks_beststreak');}
function getVocab(){
  if(window.KSSRS){try{return KSSRS.stats().available||0;}catch(e){}}
  return 0;
}
function getActiveDays(){
  /* Reconstruit l'activité réelle depuis les clés ks_xp_day_<date>
     (ks_heatmap n'est écrit nulle part dans le code — clé morte) */
  var n=0;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('ks_xp_day_')===0 && (parseInt(localStorage.getItem(k))||0)>0) n++;
    }
  }catch(e){}
  return n;
}
function countByPrefix(prefix){return countDone(prefix);}

/* Icônes SVG */
function ico(color,svg){return '<svg viewBox="0 0 24 24" style="width:30px;height:30px;fill:none;stroke:'+color+';stroke-width:2;stroke-linecap:round;stroke-linejoin:round">'+svg+'</svg>';}
function bigIco(color,svg){return '<svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:none;stroke:'+color+';stroke-width:2;stroke-linecap:round;stroke-linejoin:round">'+svg+'</svg>';}

/* Définition des trophées avec catégorie, condition, progression */
var TROPHIES = [
  /* Régularité */
  {cat:'regular',id:'first',name:'Premier Pas',desc:'Complète ta première activité',ico:ico('#22C55E','<path d="M6 21c0-6 5-9 9-12V3l-3 3-3-3v6"/><path d="M6 21h12"/>'),target:1,progress:countActivities},
  {cat:'regular',id:'streak3',name:'Flamme x3',desc:'Maintiens un streak de 3 jours',ico:ico('#FF8B5C','<path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/>'),target:3,progress:function(){return Math.max(getStreak(),getBestStreak());}},
  {cat:'regular',id:'streak7',name:'Semaine de feu',desc:'Maintiens un streak de 7 jours',ico:ico('#F59E0B','<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'),target:7,progress:function(){return Math.max(getStreak(),getBestStreak());}},
  {cat:'regular',id:'streak30',name:'Mois Marathon',desc:'Maintiens un streak de 30 jours',ico:ico('#EF4444','<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'),target:30,progress:function(){return Math.max(getStreak(),getBestStreak());}},
  {cat:'regular',id:'streak100',name:'Centurion',desc:'Maintiens un streak de 100 jours',ico:ico('#7C3AED','<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>'),target:100,progress:function(){return Math.max(getStreak(),getBestStreak());}},

  /* Maîtrise */

  {cat:'mastery',id:'b1Done',name:'Niveau B1',desc:'Complète toutes les activités B1',ico:'<span style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:22px;color:#F59E0B;line-height:1">B1</span>',target:29,progress:function(){return countByPrefix('ks_c');}},

  /* Exploration */
  {cat:'explo',id:'vocab50',name:'Vocabulaire x50',desc:'Apprends 50 mots distincts en SRS',ico:ico('#8B5CF6','<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>'),target:50,progress:getVocab},
  {cat:'explo',id:'vocab200',name:'Polyglotte en herbe',desc:'Apprends 200 mots distincts en SRS',ico:ico('#8B5CF6','<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="12" y1="6" x2="12" y2="18"/>'),target:200,progress:getVocab},
  {cat:'explo',id:'activities50',name:'Explorateur·rice',desc:'Termine 50 activités sur le parcours',ico:ico('#10B981','<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>'),target:50,progress:countActivities},

  {cat:'explo',id:'community',name:'Communauté',desc:'Active ton classement public dans Réglages',ico:ico('#DB2777','<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/>'),target:1,progress:function(){return ls('ks_leaderboard_opt')==='yes'?1:0;}}
];

/* ── Badges de blocs thématiques — un badge par groupe du parcours ──
   Chaque badge se débloque quand TOUTES les activités du bloc sont
   faites (alias historiques ks_l, ks_h et ks_jeu pris en compte). */
var BLOC_ALIAS={'ks_a01':'ks_l5','ks_a05':'ks_l6','ks_a09':'ks_l7','ks_a12':'ks_l8','ks_a14':'ks_l10','ks_a22':'ks_l9','ks_a03':'ks_h1','ks_a15':'ks_h2','ks_a27':'ks_h3','ks_h01':'ks_l1','ks_h04':'ks_l2','ks_h07':'ks_l3','ks_h09':'ks_l4','ks_d30':'ks_jeu11','ks_a45':'ks_jeu12'};
function blocDone(k){
  var v=ls(k); if(v==='done'||v==='1'||v==='true')return true;
  var a=BLOC_ALIAS[k]; if(a){var v2=ls(a); return v2==='done'||v2==='1'||v2==='true';}
  return false;
}
function blocProgress(keys){
  return function(){ var n=0; keys.forEach(function(k){ if(blocDone(k)) n++; }); return n; };
}
function emo(e){return '<span style="font-size:28px;line-height:1">'+e+'</span>';}
function blocBadge(id,name,icoSvg,keys,desc){
  TROPHIES.push({cat:'blocs',id:'bloc_'+id,name:name,desc:desc||('Termine tout le bloc « '+name+' »'),ico:icoSvg,target:keys.length,progress:blocProgress(keys)});
}

function isEarned(t){return t.progress()>=t.target;}

function renderCat(catId,containerId){
  var html='';
  var c=0;
  TROPHIES.filter(function(t){return t.cat===catId;}).forEach(function(t){
    var earned=isEarned(t);
    var prog=t.progress();
    var pct=Math.min(100,Math.round((prog/t.target)*100));
    if(earned)c++;
    var progBar='';
    if(!earned && t.target>1){
      progBar='<div class="t-progress"><div class="t-progress-bar" style="width:'+pct+'%"></div></div>'+
        '<div class="t-progress-text">'+prog+' / '+t.target+'</div>';
    }
    html+='<div class="trophy '+(earned?'earned':'locked')+'" onclick="openM(\''+t.id+'\')">'+
      '<div class="t-ico">'+t.ico+'</div>'+
      '<div class="t-name">'+t.name+'</div>'+
      '<div class="t-desc">'+t.desc+'</div>'+
      progBar+
      '</div>';
  });
  document.getElementById(containerId).innerHTML=html;
  return c;
}

function refresh(){
  var earned=0;
  earned+=renderCat('regular','catRegular');
  earned+=renderCat('xp','catXP');
  earned+=renderCat('mastery','catMastery');
  earned+=renderCat('blocs','catBlocs');
  earned+=renderCat('explo','catExplo');
  var total=TROPHIES.length;
  document.getElementById('sEarned').textContent=earned;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sPercent').textContent=Math.round(earned/total*100)+'%';
}

function openM(id){
  var t=TROPHIES.find(function(x){return x.id===id;});
  if(!t) return;
  var earned=isEarned(t);
  var prog=t.progress();
  document.getElementById('mIco').innerHTML=t.ico.replace(/width:30px;height:30px/,'width:48px;height:48px').replace(/font-size:28px/,'font-size:42px');
  document.getElementById('mIco').className='m-ico'+(earned?'':' locked');
  document.getElementById('mName').textContent=t.name;
  document.getElementById('mStatus').textContent=earned?'Débloqué':'À débloquer';
  document.getElementById('mStatus').className='m-status '+(earned?'earned':'locked');
  document.getElementById('mDesc').textContent=t.desc;
  document.getElementById('mProgress').textContent=earned?'':'Progression : '+prog+' / '+t.target;
  document.getElementById('ovr').classList.add('open');
}
function closeM(){document.getElementById('ovr').classList.remove('open');}

document.addEventListener('DOMContentLoaded',function(){
  /* Attendre que KSSRS soit dispo si nécessaire */
  setTimeout(refresh,100);
});
