<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<script>try{if(localStorage.getItem('ks_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<script src="gate.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portrait Match — Décrire quelqu'un — Korean Stories</title>
  <meta name="theme-color" content="#0F1B2D"/>
  <link rel="stylesheet" href="design.css">
  <style>
    body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:var(--bg);color:var(--tx)}
    .wrap{padding:1rem;max-width:540px;margin:0 auto}
    h2{color:var(--navy);margin:0 0 .3rem}
    [data-theme="dark"] h2{color:#EDF2FA}
    .pill{display:inline-block;background:rgba(37,99,235,.12);color:#1D4ED8;border-radius:20px;padding:.2rem .7rem;font-size:.82rem;font-weight:600}
    [data-theme="dark"] .pill{color:#93c5fd}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.2rem}
    .col-lbl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-muted);text-align:center;margin-bottom:.2rem}
    .tile{padding:.85rem .6rem;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;font-size:1rem;font-weight:600;background:var(--surf);text-align:center;transition:.12s;min-height:48px;display:flex;align-items:center;justify-content:center}
    .tile.kr{font-family:'Noto Sans KR',sans-serif}
    .tile:hover{border-color:#2563EB}
    .tile.sel{border-color:#2563EB;background:rgba(37,99,235,.12);color:#1D4ED8}
    .tile.done{border-color:#16A34A;background:rgba(22,163,74,.12);color:#15803D;pointer-events:none;opacity:.65}
    .tile.bad{border-color:#ef4444;background:rgba(239,68,68,.1);color:#dc2626}
    .hud{margin-top:1rem;text-align:center;font-weight:700;color:var(--tx-muted)}
    .result{text-align:center;padding:1.5rem 0}
    .result .big{font-size:2.4rem;font-weight:800;color:#2563EB}
    .again-btn{display:block;width:100%;padding:.9rem;background:#2563EB;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1rem}
  </style>
<style>.bnav{padding-left:2px;padding-right:2px}.bni{padding:6px 4px;min-width:0}.bni span{font-size:8px;letter-spacing:.02em}</style>
<link rel="icon" type="image/png" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<link rel="apple-touch-icon" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="ks-sync.js"></script>
</head>
<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Portrait Match</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Portrait Match 🧩</h2>
  <span class="pill">A1 · Apparence & personnalité</span>
  <div id="gameArea">
    <p style="color:var(--tx-muted);font-size:.9rem;margin:.8rem 0 0">Associe chaque adjectif coréen à son sens. Touche une carte de chaque colonne.</p>
    <div class="grid">
      <div><div class="col-lbl">Coréen</div><div id="colKr"></div></div>
      <div><div class="col-lbl">Français</div><div id="colFr"></div></div>
    </div>
    <div class="hud" id="hud">0 / 6 associés</div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalTxt">Bravo ! 🎉</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="start()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +8 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const PAIRS=[
  {kr:'친절하다',fr:'gentil'},
  {kr:'똑똑하다',fr:'intelligent'},
  {kr:'귀엽다',fr:'mignon'},
  {kr:'키가 크다',fr:'grand'},
  {kr:'재미있다',fr:'drôle'},
  {kr:'조용하다',fr:'calme'}
];
let matched=0,errors=0,selKr=null,selFr=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  matched=0;errors=0;selKr=null;selFr=null;
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  document.getElementById('hud').textContent='0 / '+PAIRS.length+' associés';
  const kr=document.getElementById('colKr'),fr=document.getElementById('colFr');
  kr.innerHTML='';fr.innerHTML='';
  PAIRS.forEach((p,i)=>{const t=document.createElement('div');t.className='tile kr';t.textContent=p.kr;t.dataset.id=i;t.onclick=()=>pickKr(t);kr.appendChild(t);});
  shuffle(PAIRS.map((p,i)=>({fr:p.fr,id:i}))).forEach(o=>{const t=document.createElement('div');t.className='tile';t.textContent=o.fr;t.dataset.id=o.id;t.onclick=()=>pickFr(t);fr.appendChild(t);});
}
function pickKr(t){if(t.classList.contains('done'))return;if(selKr)selKr.classList.remove('sel');selKr=t;t.classList.add('sel');check();}
function pickFr(t){if(t.classList.contains('done'))return;if(selFr)selFr.classList.remove('sel');selFr=t;t.classList.add('sel');check();}
function check(){
  if(!selKr||!selFr)return;
  const a=selKr,b=selFr;
  if(a.dataset.id===b.dataset.id){
    a.classList.add('done');b.classList.add('done');a.classList.remove('sel');b.classList.remove('sel');
    if(window.speak)window.speak(PAIRS[+a.dataset.id].kr);
    matched++;document.getElementById('hud').textContent=matched+' / '+PAIRS.length+' associés';
    selKr=null;selFr=null;
    if(matched===PAIRS.length)setTimeout(end,500);
  }else{
    errors++;a.classList.add('bad');b.classList.add('bad');
    const x=a,y=b;selKr=null;selFr=null;
    setTimeout(()=>{x.classList.remove('bad','sel');y.classList.remove('bad','sel');},600);
  }
}
function end(){
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalMsg').textContent=errors===0?'Sans faute, mémoire d\'or ! 🏆':errors<=2?'Très bien — '+errors+' erreur(s).':'Termine, puis recommence pour viser le sans-faute.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_a65',xp:8});else{if(typeof ksAddXP==='function')ksAddXP(8);if(typeof ksMarkDone==='function')ksMarkDone('ks_a65');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
