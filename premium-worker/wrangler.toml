name = "ks-premium"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "KS_LICENSES"
id = "92123e6f49244abb883fae570f389a63"

# Stockage des gros fichiers vendus — DÉSACTIVÉ, gardé pour plus tard.
#
# Le Livret A1 tient finalement dans KV : réencodé en palette indexée plutôt
# qu'en JPEG, il fait ~24 Mo en 170 dpi (voir le commit du 2026-08-07). Activer
# R2 aurait demandé d'enregistrer une carte chez Cloudflare pour un seul
# fichier — disproportionné.
#
# Le code du worker sait déjà lire dans R2 (servePdfFromR2) et s'en passe
# proprement quand le binding est absent. Le jour où un fichier dépassera
# vraiment 25 Mo — les livrets A2, B1, B2 par exemple — il suffira de
# décommenter, de créer le bucket, et de suivre PASSAGE-R2.md.
#
# ⚠️ Ne pas décommenter avant que le bucket existe : un binding pointant vers
# un bucket absent fait échouer le déploiement.
# [[r2_buckets]]
# binding = "KS_FILES"
# bucket_name = "korean-stories-files"

# Les secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, RESEND_API_KEY)
# se configurent via : wrangler secret put NOM_DE_LA_VARIABLE
# Ou directement dans le dashboard Cloudflare → Workers → Settings → Variables
