<body><h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Navigation Séoul — Transports</h1>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">←</button><span class="bar-title">Navigation Séoul</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h2>Navigation Séoul</h2>
  <span class="pill">A2 · 90 secondes</span>
  <div id="introArea" class="intro" style="margin-top:1rem">
    <p style="color:var(--tx-muted);line-height:1.6">Traverse Séoul ! Trouve la bonne phrase pour chaque situation de transport avant la fin du chrono.</p>
    <button class="start-btn" onclick="startGame()">Démarrer le trajet →</button>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud"><span class="timer" id="timer">90</span><span class="streak" id="streak">Série : 0</span></div>
    <div class="bar2"><div class="bar2-fill" id="barFill"></div></div>
    <div class="card">
      <div class="sit" id="sit"></div>
      <div id="opts"></div>
    </div>
  </div>
  <div id="resultArea" style="display:none" class="result">
    <div class="big" id="finalScore">0</div>
    <p style="color:var(--tx-muted)" id="finalMsg"></p>
    <button class="again-btn" onclick="startGame()">Rejouer</button>
    <a class="again-btn" href="#" style="background:none;border:1.5px solid var(--bd);color:var(--tx)" onclick="finish();return false;">Terminer · +10 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QUESTIONS=[
  {sit:"Dis que tu prends le métro.",ok:"지하철을 타요",alts:["지하철에서 내려요","지하철까지 가요"]},
  {sit:"Tu descends à la station Gangnam.",ok:"강남역에서 내려요",alts:["강남역을 타요","강남역으로 갈아타요"]},
  {sit:"Le plan dit : change pour la ligne 2.",ok:"2호선으로 갈아타세요",alts:["2정거장 가세요","2호선에서 내리세요"]},
  {sit:"Demande comment aller jusqu'à Hongdae.",ok:"홍대까지 어떻게 가요?",alts:["홍대까지 얼마예요?","홍대에서 내려요?"]},
  {sit:"Demande combien de temps ça prend.",ok:"얼마나 걸려요?",alts:["얼마예요?","어디예요?"]},
  {sit:"En taxi : à la station Gangnam, svp.",ok:"강남역까지 가 주세요",alts:["강남역에서 내려요","강남역을 타 주세요"]},
  {sit:"En taxi : arrêtez-vous ici.",ok:"여기서 세워 주세요",alts:["여기서 타 주세요","여기까지 갈아타세요"]},
  {sit:"Le plan dit : allez deux stations.",ok:"두 정거장 가세요",alts:["이 정거장 가세요","둘 정거장 가세요"]},
  {sit:"Demande où acheter une carte de transport.",ok:"교통카드 어디서 사요?",alts:["교통카드 얼마나 걸려요?","교통카드 타요?"]},
  {sit:"Dis que tu prends le bus.",ok:"버스를 타요",alts:["버스에서 내려요","버스까지 가요"]},
  {sit:"Tu changes pour la ligne 9.",ok:"9호선으로 갈아타요",alts:["9정거장 내려요","9호선까지 타요"]},
  {sit:"Demande où se trouve la sortie 3.",ok:"3번 출구가 어디에 있어요?",alts:["3번 출구를 타요?","3번 출구까지 걸려요?"]}
];
let order=[],idx=0,score=0,streak=0,timeLeft=90,timer=null,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  order=shuffle(QUESTIONS.slice());idx=0;score=0;streak=0;timeLeft=90;locked=false;
  document.getElementById('introArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('gameArea').style.display='block';
  clearInterval(timer);
  timer=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0)endGame();},1000);
  updTimer();render();
}
function updTimer(){
  const t=document.getElementById('timer');t.textContent=timeLeft;
  t.classList.toggle('low',timeLeft<=15);
  document.getElementById('barFill').style.width=(timeLeft/90*100)+'%';
}
function render(){
  if(idx>=order.length)order=shuffle(QUESTIONS.slice()),idx=0;
  const q=order[idx];locked=false;
  document.getElementById('sit').textContent=q.sit;
  const opts=shuffle([{t:q.ok,c:true},...q.alts.map(a=>({t:a,c:false}))]);
  const box=document.getElementById('opts');box.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o.t;b.onclick=()=>pick(b,o.c,q);b.tabIndex=0;b.setAttribute('role','button');b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(b,o.c,q);}};box.appendChild(b);});
  document.getElementById('streak').textContent='Série : '+streak;
}
function pick(el,correct,q){
  if(locked)return;locked=true;
  if(correct){el.classList.add('ok');score++;streak++;if(window.speak)window.speak(q.ok);}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();streak=0;document.querySelectorAll('.opt').forEach(o=>{if(o.textContent===q.ok)o.classList.add('ok');});}
  setTimeout(()=>{idx++;render();},650);
}
function endGame(){
  clearInterval(timer);
  document.getElementById('gameArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('finalScore').textContent=score+' trajets';
  document.getElementById('finalMsg').textContent=score>=12?'Maître du métro de Séoul !':score>=7?'Bon voyageur — continue !':'Encore un peu d\'entraînement.';
}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_b52',xp:10});else{if(typeof ksAddXP==='function')ksAddXP(10);if(typeof ksMarkDone==='function')ksMarkDone('ks_b52');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
  <script src="ks-menu.js" defer></script>
</body></html>
