<body>
<nav class="bar"><button class="back-btn" aria-label="Retour" onclick="history.back()">&larr;</button><span class="bar-title">Le coréen qu'on parle vraiment</span><button onclick="toggleTheme()" class="theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" style="width:16px;height:16px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button></nav>
<div class="shell"><main class="main"><div class="wrap">
  <h1>Le coréen qu'on parle vraiment</h1>
  <span class="pill">B2 · 10 questions</span>
  <div class="prog"><div class="prog-fill" id="progFill"></div></div>
  <div id="quizArea"></div>
  <div id="resultArea" style="display:none" class="result">
    <div class="score" id="scoreVal">-</div>
    <p id="resultMsg" style="color:var(--tx-muted)"></p>
    <button class="result-btn" onclick="restart()">Recommencer</button>
    <a class="result-btn" id="doneBtn" href="#" onclick="finish();return false;">Terminer · +14 XP</a>
  </div>
</div></main></div>
<script src="ks.js"></script>
<script>
const QS=[{"fr": "« C'était bon marché, alors j'en ai pris deux. » (tu l'as constaté, tu as réagi)", "txt": "___ 두 개 샀어요.", "opts": ["싸길래", "싼 김에", "싸더라고요"], "ans": 0, "exp": "길래 : tu réagis à ce que tu viens de constater."}, {"fr": "« Puisque je faisais le ménage, j'ai aussi nettoyé les fenêtres. »", "txt": "___ 창문도 닦았어요.", "opts": ["청소하길래", "청소하는 김에", "청소했더니"], "ans": 1, "exp": "김에 : tu profites de ce que tu étais déjà en train de faire."}, {"fr": "« J'ai ouvert la fenêtre ce matin : il neigeait. »", "txt": "아침에 창문을 ___ 눈이 왔어요.", "opts": ["열길래", "여는 김에", "열었더니"], "ans": 2, "exp": "었더니 : tu agis, puis tu découvres ce qui suit. Le sujet, c'est toi."}, {"fr": "« Ce film, il était bien, figure-toi. » (tu l'as vu toi-même)", "txt": "그 영화 ___", "opts": ["재미있대요.", "재미있더라고요.", "재미있었더니요."], "ans": 1, "exp": "더라고요 : tu rapportes ton propre constat. 대요, c'est du ouï-dire."}, {"fr": "On te dit que ce restaurant est cher. Tu l'as trouvé correct, tu réponds :", "txt": "아니요, ___", "opts": ["괜찮더라고요.", "괜찮던데요.", "괜찮았더니요."], "ans": 1, "exp": "던데요 répond et nuance ce que l'autre vient de dire."}, {"fr": "« J'étais fatigué, alors je me suis couché tôt. » (ta propre fatigue)", "txt": "제가 ___ 일찍 잤어요.", "opts": ["피곤하길래", "피곤해서", "피곤한 김에"], "ans": 1, "exp": "길래 réagit à un constat extérieur, jamais à ton propre état."}, {"fr": "« J'essayais de me retenir, mais j'ai fini par rire. »", "txt": "참으려고 했지만 ___", "opts": ["웃어 버렸어요.", "웃고 말았어요.", "웃더라고요."], "ans": 1, "exp": "고 말다 : l'action est allée au bout malgré toi, et le regret est dans la forme."}, {"fr": "« J'ai tout mangé. » (soulagé, c'est réglé)", "txt": "다 ___", "opts": ["먹고 말았어요.", "먹어 버렸어요.", "먹었더니요."], "ans": 1, "exp": "버리다 : c'est fait, et plutôt tant mieux. 고 말다 ajouterait du regret."}, {"fr": "« Je n'ai pas déjeuné, du coup j'ai faim. »", "txt": "아침을 안 ___ 배가 고파요.", "opts": ["먹었더니", "먹길래", "먹는 김에"], "ans": 0, "exp": "었더니 : ce que tu as fait, puis ce que tu constates maintenant."}, {"fr": "« Tant que j'allais en ville, je suis passé à la poste. »", "txt": "시내에 ___ 우체국에 들렀어요.", "opts": ["나가길래", "나가는 김에", "나갔더니"], "ans": 1, "exp": "김에 : l'occasion était là, tu en as profité."}];
let cur=0,score=0,order=[];
function start(){cur=0;score=0;order=QS.map(q=>q);document.getElementById('resultArea').style.display='none';document.getElementById('quizArea').style.display='block';render();}
function render(){
  const q=order[cur];
  document.getElementById('progFill').style.width=(cur/order.length*100)+'%';
  const opts=q.opts.map((o,i)=>({text:o,correct:i===q.ans}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  let html='<div class="card"><div class="q-fr">'+q.fr+'</div>';
  html+='<div class="q-txt">'+q.txt+'</div>';
  opts.forEach(o=>{html+='<div class="opt" data-c="'+(o.correct?1:0)+'">'+o.text+'</div>';});
  html+='<div class="fb" id="fb"></div><button class="next" id="nextBtn" style="display:none" onclick="next()">Suivant &rarr;</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=()=>pick(o,q);o.tabIndex=0;o.setAttribute('role','button');o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o,q);}};});
}
function pick(el,q){
  if(document.querySelector('.opt.ok,.opt.ko'))return;
  const correct=el.getAttribute('data-c')==='1';
  const fb=document.getElementById('fb');
  if(correct){el.classList.add('ok');score++;fb.style.color='#16A34A';fb.textContent='\u2713 '+q.exp;}
  else{el.classList.add('ko');if(window.KSLives)KSLives.lose();document.querySelectorAll('.opt').forEach(o=>{if(o.getAttribute('data-c')==='1')o.classList.add('ok');});fb.style.color='#dc2626';fb.textContent='\u2717 '+q.exp;}
  document.getElementById('nextBtn').style.display='block';
}
function next(){cur++;if(cur>=order.length){showResult();return;}render();}
function showResult(){
  document.getElementById('progFill').style.width='100%';
  document.getElementById('quizArea').style.display='none';
  const r=document.getElementById('resultArea');r.style.display='block';
  document.getElementById('scoreVal').textContent=score+' / '+order.length;
  document.getElementById('resultMsg').textContent=score>=9?"Ces six tournures sont exactement ce qui sépare un coréen correct d'un coréen naturel. Tu les tiens.":score>=6?"Bien. Le couple 길래 / 김에 et le couple 더라고요 / 던데요 méritent un second passage.":"Reprends les trois leçons : ici le sens est proche à chaque fois, c'est l'intention qui tranche.";
}
function restart(){start();}
function finish(){if(typeof ksFinish==='function')ksFinish({key:'ks_d54',xp:14});else{if(typeof ksAddXP==='function')ksAddXP(14);if(typeof ksMarkDone==='function')ksMarkDone('ks_d54');location.href='cours.html';}}
try{const t=localStorage.getItem('ks_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
start();
</script>
