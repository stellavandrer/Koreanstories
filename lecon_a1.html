    .qopt.wrong{border-color:#ef4444;background:#fef2f2;color:#b91c1c}
    .qopt .opt-letter{width:22px;height:22px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}

    .qopt.wrong .opt-letter{background:#ef4444;color:white}

    .culture-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(168,85,247,.12);border-radius:100px;padding:3px 10px;font-size:10px;font-weight:700;color:#7c3aed;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

    .error-box{background:#fff7ed;border:1.5px solid #fed7aa;border-radius:14px;padding:16px 18px;margin:10px 0}

    .err-correct{display:flex;align-items:center;gap:6px;font-family:'Noto Sans KR',sans-serif;font-weight:700;color:#15803d;font-size:14px;margin-bottom:5px}
    .err-correct::before{content:'<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>';font-family:sans-serif;font-size:11px;background:#86efac;color:#14532d;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .err-expl{font-size:12px;color:var(--gray);line-height:1.55;padding-left:22px}
    .error-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(249,115,22,.12);border-radius:100px;padding:3px 10px;font-size:10px;font-weight:700;color:#ea580c;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}

    /* ── Method / tip box ── */
    .method-box{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:14px;padding:14px 16px;margin:10px 0;font-size:13px;line-height:1.65}
    [data-theme="dark"] .method-box{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.25)}

<script>
var LESSONS = {
  '6.1':{
    title:'Toutes les salutations coréennes',
    sub:'Matin · soir · téléphone · rencontre · séparation · formel vs informel',
    duration:'12 min', words:'32 expressions', lk:'ks_a1_6_1',
    sections:[
      { type:'vocab', title:'Salutations principales', icon:'book',
        rows:[
          ['안녕하세요','an-nyeong-ha-se-yo','Bonjour / Bonsoir (formel)'],
          ['안녕','an-nyeong','Salut (informel, amis proches)'],
          ['안녕히 계세요','an-nyeong-hi gye-se-yo','Au revoir (dit à celui qui reste)'],
          ['안녕히 가세요','an-nyeong-hi ga-se-yo','Au revoir (dit à celui qui part)'],
          ['잘 있어','jal i-sseo','Salut, ciao (informel, à celui qui reste)'],
          ['잘 가','jal ga','Bonne route (informel, à celui qui part)'],
          ['처음 뵙겠습니다','cheo-eum boep-get-seum-ni-da','Enchanté (très formel, 1ère fois)'],
          ['반가워요','ban-ga-wo-yo','Ravi de vous rencontrer (poli)'],
        ]
      },
      { type:'vocab', title:'Salutations par moment de la journée', icon:'clock',
        rows:[
          ['좋은 아침이에요','jo-eun a-chi-mi-e-yo','Bonjour (le matin)'],
          ['좋은 저녁이에요','jo-eun jeo-nyeo-gi-e-yo','Bonsoir'],
          ['잘 자요','jal ja-yo','Bonne nuit (poli)'],
          ['잘 자','jal ja','Bonne nuit (informel)'],
          ['오랜만이에요','o-raen-ma-ni-e-yo','Ça fait longtemps !'],
          ['잘 지냈어요?','jal ji-naet-sseo-yo','Comment allez-vous ? (litt. Vous avez bien vécu ?)'],
        ]
      },
      { type:'rule', title:'Formel vs Informel', icon:'zap',
        rules:[
          { label:'존댓말 (Formel/Poli)', text:'Utilisé avec des inconnus, des aînés, au travail, en public. Terminaisons en -요 ou -습니다/-ㅂ니다.', ko:'안녕하세요! 처음 뵙겠습니다.' },
          { label:'반말 (Informel)', text:'Utilisé entre amis proches du même âge, avec des enfants. Pas de terminaison -요.', ko:'안녕! 잘 지냈어?' },
        ],
        tip:'En Corée, le niveau de langue dépend du contexte social. Utilise toujours le formel avec des inconnus — tu éviteras les malentendus !'
      },
      { type:'examples', title:'Exemples en contexte', icon:'message',
        items:[
          { ko:'A: 안녕하세요! 처음 뵙겠습니다. B: 네, 반갑습니다!', rom:'A: An-nyeong-ha-se-yo! B: Ne, ban-gap-seum-ni-da!', fr:'A: Bonjour, enchanté ! B: Oui, ravi de vous rencontrer !' },
          { ko:'A: 잘 지냈어요? B: 네, 잘 지냈어요. 감사해요!', rom:'', fr:'A: Comment allez-vous ? B: Bien, merci !' },
          { ko:'(Au téléphone) 여보세요?', rom:'yeo-bo-se-yo?', fr:'Allô ? (uniquement au téléphone)' },
        ]
      },
      { type:'quiz', title:'Mini-quiz — Salutations', icon:'check',
        questions:[
          { q:'Comment dit-on "Bonjour" de façon polie en coréen ?', opts:['잘 자요','안녕하세요','반가워요','잘 가'], ans:1 },
          { q:'Vous partez et votre ami reste. Vous lui dites…', opts:['안녕히 가세요','잘 있어','안녕히 계세요','오랜만이에요'], ans:2 },
          { q:'Quel mot utilise-t-on UNIQUEMENT au téléphone ?', opts:['안녕','여보세요','좋은 아침','잘 지냈어요'], ans:1 },
          { q:'반말 est utilisé avec…', opts:['Son patron','Un inconnu dans la rue','Un ami proche du même âge','Le professeur'], ans:2 },
        ]
      }
    ]
  },
  '6.2':{
    title:'존댓말 vs 반말 : les niveaux de langue',
    sub:'Comprendre les niveaux · règles sociales · quand passer au tutoiement',
    duration:'14 min', words:'25 paires', lk:'ks_a1_6_2',
    sections:[
      { type:'vocab', title:'20 paires formel / informel', icon:'book',
        rows:[
          ['있어요 / 있어','it-sseo-yo / it-sseo','Il y a / Y en a (avoir, exister)'],
          ['먹어요 / 먹어','meo-geo-yo / meo-geo','Je mange / On mange'],
          ['가요 / 가','ga-yo / ga','On y va / On y va (fam.)'],
          ['해요 / 해','hae-yo / hae','Je fais / Je fais (fam.)'],
          ['좋아요 / 좋아','jo-a-yo / jo-a','C\'est bien / C\'est bien (fam.)'],
          ['알아요 / 알아','a-ra-yo / a-ra','Je sais / Je sais (fam.)'],
          ['봐요 / 봐','bwa-yo / bwa','Je regarde / Je regarde (fam.)'],
          ['와요 / 와','wa-yo / wa','Je viens / Viens'],
        ]
      },
      { type:'rule', title:'Règle des niveaux', icon:'zap',
        rules:[
          { label:'Avec qui → 존댓말', text:'Personnes plus âgées, inconnus, supérieurs hiérarchiques, situation formelle (shop, médecin, transport en commun).', ko:'선생님, 안녕하세요!' },
          { label:'Avec qui → 반말', text:'Amis proches, personnes plus jeunes que toi, membres de ta famille proche.', ko:'야, 우리 밥 먹자!' },
        ],
        tip:'En coréen, passer du 존댓말 au 반말 est une étape importante dans une relation. On dit "반말해도 돼요?" (Je peux te tutoyer ?). Attends toujours d\'être invité(e) !'
      },

var lid = (new URLSearchParams(location.search).get('l')||'6.1');
var lesson = LESSONS[lid];
var sections = lesson ? lesson.sections : [];
var totalSec = sections.length;
var viewedSec = 0;
var quizState = {};

function init(){
  if(!lesson){ document.getElementById('lessonBody').innerHTML='<p style="padding:20px;color:red">Leçon introuvable.</p>'; return; }
  document.title = 'Leçon '+lid+' · Korean Stories';
  document.getElementById('topTitle').textContent = 'Leçon '+lid+' — '+lesson.title;
  document.getElementById('lhNum').textContent = 'Leçon '+lid;
  document.getElementById('lhTitle').textContent = lesson.title;
  document.getElementById('lhSub').textContent = lesson.sub;
  document.getElementById('lhDuration').textContent = lesson.duration||'12 min';
  document.getElementById('lhWords').textContent = lesson.words||'Vocabulaire';

  var html = '';
  sections.forEach(function(sec,i){ html += renderSection(sec,i); });
  document.getElementById('lessonBody').innerHTML = html;
  updateProgress();
  // Mark done after reading
  setTimeout(function(){ markViewed(0); },1200);
}

    check:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',

    alert:'<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',

  if(sec.type==='vocab'){
    var rows = sec.rows.map(function(r){
      return '<tr><td><span class="ko">'+r[0]+'</span><br><span class="rom">'+r[1]+'</span></td><td class="fr">'+r[2]+'</td></tr>';

    }).join('');
    var tipHtml = sec.tip ? '<div class="tip-box"><strong>Astuce :</strong> '+sec.tip+'</div>' : '';
    return '<div class="section" id="sec'+i+'">'
      +'<div class="sec-title">'+icon+' '+sec.title+'</div>'
      +rulesHtml+tipHtml+'</div>';
  }
  if(sec.type==='examples'){
    var exHtml = (sec.items||[]).map(function(ex){
      return '<div class="ex-card"><span class="ex-ko">'+ex.ko+'</span>'

        +'<div class="ex-fr">'+ex.fr+'</div></div>';

    return '<div class="section" id="sec'+i+'">'
      +'<div class="sec-title">'+icon+' '+sec.title+'</div>'

function initQuiz(si){
  var sec = sections[si];
  if(!sec||sec.type!=='quiz') return;
  var qs = sec.questions;
  quizState[si] = { idx:0, score:0, total:qs.length };
  renderQuestion(si);
}

function renderQuestion(si){
  var sec = sections[si];
  var st = quizState[si];
  var wrap = document.getElementById('quiz'+si);
  if(!wrap) return;
  if(st.idx >= st.total){
    // Done
    markViewed(si);
    var pct = Math.round(st.score/st.total*100);
    var emoji = pct>=80?'Excellent !':pct>=50?'Bien !':'Continue !';
    wrap.innerHTML = '<div class="quiz-done show">'
      +'<div class="quiz-score">'+st.score+' / '+st.total+'</div>'
      +'<div class="quiz-score-lbl">'+emoji+' '+pct+'% de réussite</div>'
      +(pct>=80?'<p style="margin-top:12px;font-size:13px;color:var(--green);font-weight:600">Excellent ! Leçon validée !</p>':'<p style="margin-top:12px;font-size:13px;color:var(--gray)">Continue à t\'entraîner !</p>')
      +'</div>';
    saveDone();
    return;
  }
  var q = sec.questions[st.idx];
  var letters = ['A','B','C','D'];
  var optsHtml = q.opts.map(function(o,oi){
    return '<button class="qopt" onclick="checkAnswer('+si+','+oi+')" id="qo'+si+'_'+oi+'">'
      +'<span class="opt-letter">'+letters[oi]+'</span>'+o+'</button>';
  }).join('');
  wrap.innerHTML = '<div class="quiz-q">Question '+(st.idx+1)+' / '+st.total+' : <span class="qko">'+q.q+'</span></div>'
    +'<div class="quiz-opts">'+optsHtml+'</div>'
    +'<div class="quiz-fb" id="qfb'+si+'"></div>'
    +'<button class="quiz-next" id="qnext'+si+'" onclick="nextQuestion('+si+')">Question suivante →</button>';
}

function checkAnswer(si,chosen){
  var sec = sections[si];
  var st = quizState[si];
  var q = sec.questions[st.idx];
  var opts = document.querySelectorAll('[id^="qo'+si+'_"]');
  opts.forEach(function(btn){ btn.onclick=null; btn.style.cursor='default'; });
  var fb = document.getElementById('qfb'+si);
  var nxt = document.getElementById('qnext'+si);
  if(chosen===q.ans){
    st.score++;
    document.getElementById('qo'+si+'_'+chosen).classList.add('correct');
    fb.innerHTML='<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> Correct ! Bien joué.';
    fb.className='quiz-fb show ok';
  } else {
    document.getElementById('qo'+si+'_'+chosen).classList.add('wrong');
    document.getElementById('qo'+si+'_'+q.ans).classList.add('correct');
    fb.innerHTML='<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Pas tout à fait. La bonne réponse était : '+q.opts[q.ans];
    fb.className='quiz-fb show ko';
  }
  var isLast = (st.idx+1 >= st.total);
  nxt.textContent = isLast ? 'Voir le résultat' : 'Question suivante →';
  nxt.classList.add('show');
}

function nextQuestion(si){
  quizState[si].idx++;
  renderQuestion(si);
}

function markViewed(i){
  if(i>=totalSec) return;
  // init quiz on first view
  if(sections[i]&&sections[i].type==='quiz'&&!quizState[i]){
    quizState[i]={idx:0,score:0,total:sections[i].questions.length};
    renderQuestion(i);
  }
  viewedSec = Math.max(viewedSec, i+1);
  updateProgress();
}

function updateProgress(){
  var pct = totalSec>0 ? Math.round(viewedSec/totalSec*100) : 0;
  var fill = document.getElementById('lpFill');
  var txt = document.getElementById('lpTxt');
  if(fill) fill.style.width = pct+'%';
  if(txt) txt.textContent = viewedSec+' / '+totalSec+' sections';
}

function saveDone(){
  try{
    if(lesson&&lesson.lk) localStorage.setItem(lesson.lk, '1');
  }catch(e){}
}

// Initialize quiz sections when they come into view
function onScroll(){
  sections.forEach(function(sec,i){
    if(sec.type!=='quiz') return;
    var el = document.getElementById('sec'+i);
    if(!el) return;
    var rect = el.getBoundingClientRect();
    if(rect.top < window.innerHeight*0.85 && !quizState[i]){
      markViewed(i);
    }
    // mark non-quiz sections as viewed when scrolled to
    if(sec.type!=='quiz') return;
  });
  // mark non-quiz sections as viewed on scroll
  sections.forEach(function(sec,i){
    if(sec.type==='quiz') return;
    var el = document.getElementById('sec'+i);
    if(!el) return;
    var rect = el.getBoundingClientRect();
    if(rect.bottom < window.innerHeight*0.9){
      markViewed(i);
    }
  });
}

      { title:'고개를 숙이다 — L\'inclinaison', text:'En Corée, la salutation s\'accompagne d\'une inclinaison (인사). Une inclinaison légère (~15°) est standard entre égaux ou dans les commerces. Une inclinaison profonde (45°+) exprime un grand respect ou des excuses sincères. Contrairement au Japon, elle n\'est pas strictement codifiée — le geste naturel compte plus.' },
      { title:'여보세요 — UNIQUEMENT au téléphone', text:'Ne dites JAMAIS 여보세요 en face à face ! Ce mot est réservé aux appels téléphoniques. Son origine : 여보 = "chéri/e" + 세요 (forme polie). Il servait à attirer l\'attention dans les premières lignes téléphoniques.' },
      { title:'밥 먹었어요? — "Tu as mangé ?" = "Ça va ?"', text:'Cette question du quotidien illustre l\'importance de la nourriture (밥) dans la culture coréenne. Ce n\'est pas vraiment une question sur la nourriture — c\'est une façon affectueuse de dire "Je pense à toi". Répondez 네, 먹었어요! même si ce n\'est pas totalement vrai.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 6.1',
    items:[
      { wrong:'안녕! (à un supérieur ou inconnu)', correct:'안녕하세요!', expl:'안녕 est du 반말 (informel). Avec un supérieur, un inconnu, en magasin ou dans les transports, utilisez toujours 안녕하세요.' },
      { wrong:'여보세요! (en face à face)', correct:'안녕하세요!', expl:'여보세요 s\'utilise UNIQUEMENT au téléphone. L\'utiliser en face à face est très bizarre et fera rire les Coréens.' },
      { wrong:'안녕히 가세요 (à celui qui reste)', correct:'안녕히 계세요', expl:'가세요 = "allez bien" (pour celui qui PART). 계세요 = "restez bien" (pour celui qui RESTE). Beaucoup d\'apprenants confondent les deux !' },
    ]
  }
},

'6.2': {
  culture:{
    title:'Culture coréenne — Hiérarchie et langage',
    notes:[
      { title:'나이가 어떻게 되세요? — L\'âge comme boussole sociale', text:'Les Coréens demandent souvent l\'âge dès la première rencontre — pas par indiscrétion, mais pour calibrer le niveau de langue ! L\'âge détermine qui dit 존댓말 à qui. Cette question est parfaitement normale et ne doit pas choquer.' },
      { title:'빠른 년생 — Le système d\'âge coréen', text:'Jusqu\'en 2023, la Corée utilisait le "âge coréen" où tout le monde vieillit au Nouvel An. Exemple : né en décembre 2000, vous aviez déjà 2 ans le 1er janvier 2001 ! Depuis 2023, la Corée est passée à l\'âge international, mais la confusion perdure dans les conversations.' },
      { title:'야, 형, 오빠, 언니, 누나 — Le tutoiement affectif', text:'En 반말, on utilise des termes d\'adresse spéciaux : 형 (grand frère, entre hommes), 오빠 (grand frère, dit par une femme), 언니 (grande sœur, entre femmes), 누나 (grande sœur, dit par un homme). Ces termes remplacent souvent les prénoms en 반말.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 6.2',
    items:[
      { wrong:'가요 (avec un ami proche)', correct:'가 (반말)', expl:'En 반말, on supprime le -요. 가요 → 가. Ce n\'est pas impoli — c\'est simplement le registre approprié entre amis proches.' },
      { wrong:'Passer au 반말 sans permission', correct:'반말해도 돼요?', expl:'En Corée, passer au tutoiement sans permission est perçu comme arrogant ou irrespectueux. Demandez toujours : 반말해도 돼요? (Je peux te tutoyer ?)' },
      { wrong:'이름이 뭐예요? (à quelqu\'un de plus âgé)', correct:'성함이 어떻게 되세요?', expl:'뭐예요 est assez direct. Avec une personne plus âgée, utilisez 성함 (forme honorifique de "nom") et 어떻게 되세요 (forme plus polie de "c\'est quoi ?").' },
    ]
  }
},

'6.3': {
  culture:{
    title:'Culture coréenne — La politesse',
    notes:[
      { title:'Merci moins fréquent qu\'en France', text:'Dans les relations proches, les Coréens disent moins souvent 감사합니다 ou 고마워요 qu\'on ne le ferait en français. Trop le répéter peut créer une distance. Avec des proches, un simple sourire ou une action (cuisiner, aider) exprime la gratitude. En revanche, dans les commerces et avec les étrangers, 감사합니다 est toujours apprécié.' },
      { title:'죄송합니다 vs 미안해요 — la nuance', text:'죄송합니다 est une excuse profonde, formelle, presque solennelle. 미안해요 est sincère mais plus léger. Dans un contexte professionnel ou pour une erreur grave, utilisez 죄송합니다. Entre amis, 미안해 suffit amplement.' },
      { title:'괜찮아요 — le mot le plus utile du coréen', text:'괜찮아요 signifie à la fois "Ça va", "C\'est OK", "Pas de problème", "Je m\'en sors" et "C\'est bon". C\'est sans doute le mot le plus utilisé au quotidien. Apprenez-le bien !' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 6.3',
    items:[
      { wrong:'천만에요 (réponse à merci, usage courant)', correct:'아니에요 / 괜찮아요', expl:'천만에요 existe mais est très formel et un peu désuet. Dans 90% des situations, 아니에요 ou 괜찮아요 sont bien plus naturels.' },
      { wrong:'미안해요 (pour une erreur grave au travail)', correct:'죄송합니다', expl:'Au travail ou dans un contexte formel, une erreur sérieuse demande 죄송합니다. 미안해요 paraîtrait trop léger.' },
    ]
  }
},

'7.1': {
  culture:{
    title:'Culture coréenne — Les présentations',
    notes:[
      { title:'명함 — La carte de visite est sacrée', text:'En Corée, la carte de visite (명함) se reçoit et se donne à DEUX MAINS, avec une légère inclinaison. On la lit attentivement avant de la ranger. La jeter ou écrire dessus devant la personne est très impoli. Dans les cercles professionnels, ne pas avoir de carte est mal vu.' },
      { title:'L\'ordre nom/prénom est inversé', text:'En coréen, le nom de famille vient EN PREMIER. 김민준 = Kim (nom de famille) + Min-jun (prénom). Quand un Coréen se présente en français, il adapte souvent l\'ordre, mais en coréen l\'ordre original est maintenu. Les 3 noms de famille les plus courants : 김 (Kim), 이 (Lee), 박 (Park) — représentent ~45% de la population !' },
      { title:'직업 — La profession est très importante socialement', text:'En Corée, la profession est un marqueur social fort. 학생이에요 (Je suis étudiant) ou 회사원이에요 (Je suis employé de bureau) sont des informations qu\'on donne très tôt dans une conversation. Cette transparence fait partie de la culture confucéenne coréenne.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 7.1',
    items:[
      { wrong:'저는 마리아이에요 (voyelle finale)', correct:'저는 마리아예요', expl:'마리아 se termine par la voyelle 아 → on utilise 예요 (pas 이에요). Règle : consonne finale → 이에요, voyelle finale → 예요.' },
      { wrong:'저는 프랑스이에요 (nationalité)', correct:'저는 프랑스 사람이에요', expl:'Pour la nationalité, on ne dit pas simplement le pays — on ajoute 사람 (personne). 프랑스 사람 = personne française. On peut aussi dire 프랑스인이에요.' },
      { wrong:'나는 학생이에요 (présentation formelle)', correct:'저는 학생이에요', expl:'나 est le "je" informel. En 존댓말, on utilise toujours 저. Lors d\'une présentation, contexte naturellement formel, 저는 est obligatoire.' },
    ]
  }
},

'7.2': {
  culture:{
    title:'Culture coréenne — La conversation',
    notes:[
      { title:'네 vs 예 — deux façons de dire "Oui"', text:'네 est la forme standard de "oui". 예 est une forme légèrement plus formelle/respectueuse, souvent utilisée avec des personnes plus âgées ou dans des contextes très formels. En pratique, 네 fonctionne partout — mais 예 montre un niveau de politesse supplémentaire.' },
      { title:'아니요 vs 아니 — le "Non"', text:'아니요 est le "non" poli (avec -요). 아니 est la forme 반말. Attention : 아니에요 signifie "ce n\'est pas" (négation de 이에요/예요) — c\'est différent du simple refus 아니요.' },
      { title:'네? / 예? — la politesse dans la confusion', text:'Quand on n\'a pas compris, un Coréen dit souvent 네? avec une intonation montante, ou 뭐라고요? (Qu\'est-ce que vous avez dit ?). Dire simplement 어? (Hein ?) est très informel et peut paraître impoli avec des aînés.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 7.2',
    items:[
      { wrong:'아니요, 맞아요 (contradiction)', correct:'네, 맞아요', expl:'아니요 = Non, 맞아요 = c\'est correct. Les deux ensemble ne font pas sens. Attention aux questions négatives en coréen : la logique de réponse est différente du français.' },
      { wrong:'뭐? (à un supérieur)', correct:'뭐라고요? / 다시 말씀해 주세요.', expl:'뭐? tout seul est très brusque en 반말. Avec un supérieur, demandez poliment de répéter : 다시 말씀해 주세요 (Pourriez-vous répéter ?).' },
    ]
  }
},

'7.3': {
  culture:{
    title:'Méthode TTMIK — Comprendre 이/가 et 은/는',
    notes:[
      { title:'La distinction 이/가 vs 은/는 est cruciale', text:'C\'est LE point de grammaire le plus étudié en coréen A1. La méthode Talk To Me In Korean explique : 이/가 (sujet neutre, information nouvelle) vs 은/는 (thème du discours, contraste, information connue). En pratique au niveau A1, retenez d\'abord la règle consonne/voyelle.' },
      { title:'은/는 = "quant à moi…" en français', text:'저는 peut souvent se traduire par "Quant à moi..." ou "Pour ma part...". Exemple : 저는 학생이에요 = "Quant à moi, je suis étudiant" (implication : et les autres ?). 이/가 est plus neutre : 제가 학생이에요 = "C\'est moi qui suis l\'étudiant" (identification directe).' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Particule sujet/thème',
    items:[
      { wrong:'저가 (je + sujet focus)', correct:'제가', expl:'저 + 가 se contracte en 제가. De même, 나 + 가 = 내가. Ces contractions sont obligatoires — 저가 n\'existe pas.' },
      { wrong:'이/가 ou 은/는 (panique totale)', correct:'Utilisez 은/는 par défaut en A1', expl:'La nuance entre 이/가 et 은/는 s\'acquiert progressivement. En A1, utilisez 은/는 pour présenter le sujet d\'une phrase — vous serez compris. La subtilité viendra avec la pratique.' },
      { wrong:'나는 (présentation formelle)', correct:'저는', expl:'나 = "moi" en 반말. Pour toute présentation formelle ou conversation polie, utilisez 저. 나는 est réservé aux conversations informelles avec des amis proches.' },
    ]
  }
},

'7.4': {
  culture:{
    title:'Méthode Sogang — Thème vs Sujet',
    notes:[
      { title:'L\'approche communicative de l\'université Sogang', text:'La méthode Sogang (une des meilleures méthodes coréennes) insiste sur la communication situationnelle : apprendre 은/는 et 이/가 dans des contextes réels (se présenter, parler de goûts, décrire une situation) plutôt que par des règles abstraites. Objectif A1 : maîtriser 은/는 pour les présentations et 이/가 pour identifier quelque chose.' },
      { title:'Contexte de contraste — la force de 은/는', text:'은/는 est aussi une particule de CONTRASTE. 저는 커피를 좋아해요. 근데 차는 별로예요. (J\'aime le café. Mais le thé, pas vraiment.) Notez comment 차는 (thé + 는) marque le contraste avec 커피를 mentionné avant.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 7.4',
    items:[
      { wrong:'커피가 좋아해요 (objet avec sujet)', correct:'커피를 좋아해요', expl:'좋아하다 (aimer) est un verbe transitif — il prend un OBJET (을/를), pas un sujet (이/가). 좋아요 (c\'est bien) est différent de 좋아해요 (j\'aime).' },
      { wrong:'나는 프랑스 사람은 (double thème)', correct:'저는 프랑스 사람이에요', expl:'On ne met pas 은/는 sur la fois le sujet ET le complément dans la même phrase simple. 나는... 사람이에요 — la copule 이에요 suffit pour relier les deux.' },
    ]
  }
},

'8.1': {
  culture:{
    title:'Méthode — Comprendre les particules objet',
    notes:[
      { title:'을/를 vs en français — pas de traduction directe', text:'En français, l\'objet direct n\'est pas marqué : "Je mange du riz" vs "Le riz, je le mange". En coréen, 을/를 marque SYSTÉMATIQUEMENT l\'objet direct : 밥을 먹어요 (riz + objet + manger). Cette marque est très utile car l\'ordre des mots en coréen est flexible grâce aux particules.' },
      { title:'L\'ordre SOV en coréen', text:'Coréen = Sujet + Objet + Verbe. 저는(S) 밥을(O) 먹어요(V). Le verbe est TOUJOURS en fin de phrase. C\'est la différence fondamentale avec le français (SVO). Les particules permettent justement de changer l\'ordre des mots sans changer le sens : 밥을 저는 먹어요 = même sens que 저는 밥을 먹어요.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Particules objet',
    items:[
      { wrong:'음악이 들어요 (sujet à la place d\'objet)', correct:'음악을 들어요', expl:'듣다 (écouter) prend un objet : 음악을. Ne confondez pas objet (을/를) et sujet (이/가). La musique n\'écoute pas, elle EST écoutée → objet.' },
      { wrong:'한국어가 좋아해요', correct:'한국어를 좋아해요 / 한국어가 좋아요', expl:'좋아해요 (j\'aime = verbe) → objet → 를. 좋아요 (c\'est bien = adjectif) → sujet → 가/이. Deux structures différentes, deux particules différentes.' },
    ]
  }
},

'8.2': {
  culture:{
    title:'Culture coréenne — Se repérer à Séoul',
    notes:[
      { title:'에 vs 에서 — la clé de la navigation urbaine', text:'에 = destination/existence (où on VA, où quelque chose SE TROUVE). 에서 = lieu d\'action (où on FAIT quelque chose). 학교에 가요 (Je vais à l\'école) vs 학교에서 공부해요 (J\'étudie à l\'école). À Séoul, vous utiliserez constamment ces deux particules !' },
      { title:'주소 — Les adresses coréennes sont à l\'envers', text:'En Corée, l\'adresse va du GRAND au PETIT : Pays → Province → Ville → Quartier → Rue → Numéro. C\'est l\'inverse de la France. Sur les formulaires coréens, faites attention à l\'ordre !' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — 에 vs 에서',
    items:[
      { wrong:'집에서 있어요 (lieu d\'existence)', correct:'집에 있어요', expl:'있다 (être/exister quelque part) utilise 에 (pas 에서). 에서 accompagne les verbes d\'ACTION. 있다 est un verbe d\'état → 에.' },
      { wrong:'학교에 공부해요 (action dans un lieu)', correct:'학교에서 공부해요', expl:'공부하다 (étudier) est une action qui se déroule dans un lieu → 에서. 학교에 = aller à l\'école (destination). 학교에서 = à l\'école (action).' },
      { wrong:'프랑스에 왔어요 (origine)', correct:'프랑스에서 왔어요', expl:'Le point d\'ORIGINE utilise 에서 : ~에서 오다 = venir de ~. 프랑스에서 왔어요 = Je viens de France.' },
    ]
  }
},

'8.3': {
  culture:{
    title:'Méthode Yonsei — La conjugaison au présent',
    notes:[
      { title:'La règle des trois étapes (université Yonsei)', text:'L\'université Yonsei enseigne la conjugaison en 3 étapes clés : 1) Retirer 다 pour obtenir le radical. 2) Identifier la voyelle finale du radical (ㅏ/ㅗ → 아요 ; autres → 어요). 3) Appliquer les contractions et irréguliers. Cette méthode systématique permet de conjuguer n\'importe quel verbe.' },
      { title:'Le présent coréen = présent + futur proche', text:'En coréen A1, la forme en -아요/-어요 exprime : le présent habituel (매일 가요 = j\'y vais tous les jours), le présent en cours (지금 먹어요 = je mange maintenant), ET le futur proche (내일 가요 = j\'y vais demain). Un seul temps pour trois usages français !' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Conjugaison présent',
    items:[
      { wrong:'먹아요 (ㅓ vowel stem + 아요)', correct:'먹어요', expl:'먹다 → radical 먹. La voyelle interne ㅓ n\'est pas ㅏ/ㅗ → on utilise 어요. Seuls ㅏ et ㅗ donnent 아요. Tous les autres donnent 어요.' },
      { wrong:'하아요 / 하어요 (verbe 하다)', correct:'해요', expl:'하다 est un cas spécial : 하 + 여요 → 하여요 → contraction → 해요. 해요 est la seule forme correcte du présent de 하다.' },
      { wrong:'오아요 (verbe 오다)', correct:'와요', expl:'오다 → 오 + 아요 → 오아요 → contraction → 와요. Les contractions de voyelles (오+아→와, 하+여→해, 보+아→봐) sont importantes à mémoriser.' },
    ]
  }
},

'8.4': {
  culture:{
    title:'Méthode — La négation en coréen',
    notes:[
      { title:'Deux façons de nier — 안 et -지 않아요', text:'안 + verbe = négation courte (안 가요, 안 먹어요). Verbe + -지 않아요 = négation longue, plus formelle (가지 않아요, 먹지 않아요). Les deux sont correctes. La négation courte est plus naturelle à l\'oral ; la longue est plus précise et souvent utilisée à l\'écrit.' },
      { title:'못 = ne pas pouvoir (incapacité)', text:'Attention : 못 ≠ 안. 못 가요 = Je ne peux pas y aller (impossibilité physique ou circonstancielle). 안 가요 = Je n\'y vais pas (choix). Cette distinction est très importante en communication !' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Négation',
    items:[
      { wrong:'안 해요 (pour 하다 compound verbs)', correct:'못 해요 / 공부 안 해요', expl:'Pour les verbes composés avec 하다 (공부하다, 운동하다), la négation courte s\'insère entre les deux éléments : 공부 안 해요 (pas 안 공부해요). Et 못 s\'utilise la même façon : 공부 못 해요.' },
      { wrong:'안 먹지 않아요 (double négation)', correct:'안 먹어요 OU 먹지 않아요', expl:'En coréen, on n\'utilise pas les deux formes de négation en même temps. Choisissez l\'une ou l\'autre : soit 안 + verbe, soit verbe + 지 않아요.' },
    ]
  }
},

'9.1': {
  culture:{
    title:'Culture coréenne — Les nombres dans la vie quotidienne',
    notes:[
      { title:'Deux systèmes de nombres — quand utiliser lequel ?', text:'Sino-coréen (일이삼사…) : âge formel (나이 en documents), argent, dates, numéros de téléphone, minutes, étages, année. Natif coréen (하나둘셋넷…) : âge courant en conversation (스물다섯 살 = 25 ans), heures (두 시 = 2h), compteurs d\'objets/personnes. La confusion est LA faute la plus fréquente des apprenants !' },
      { title:'살 vs 세 — deux mots pour l\'âge', text:'살 (compteur natif) = âge en conversation courante : 스물다섯 살이에요 (j\'ai 25 ans). 세 (compteur sino) = âge sur les documents officiels, dans un contexte médical : 이십오 세. Les Coréens utilisent 살 dans 90% des situations.' },
      { title:'L\'âge coréen traditionnel', text:'Jusqu\'en 2023, les Coréens avaient un "âge coréen" (한국 나이) où tous les bébés naissent avec 1 an et vieillissent au Nouvel An. Depuis le 28 juin 2023, la loi impose l\'usage de l\'âge international pour tous les actes officiels, mais l\'âge coréen reste utilisé dans les conversations quotidiennes.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Les nombres',
    items:[
      { wrong:'두 시 삼십 분 (heure mixte incorrect)', correct:'두 시 삼십 분 <svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> / 두 시 반', expl:'En réalité, c\'est CORRECT ! Heure = natif (두), minutes = sino (삼십). Mais le mot "et demi" est 반 (natif) et est très courant : 두 시 반 = 2h30. Les deux formes coexistent.' },
      { wrong:'이십오 살이에요 (sino pour l\'âge conversationnel)', correct:'스물다섯 살이에요', expl:'Dans une conversation, l\'âge se dit avec les nombres NATIFS : 스물다섯 살. 이십오 세 existe mais sonne très formel/médical.' },
      { wrong:'하나 개, 두울 개 (formes longues devant compteur)', correct:'한 개, 두 개', expl:'하나/둘/셋/넷/스물se contractent OBLIGATOIREMENT devant un compteur : 한/두/세/네/스무. C\'est une des règles les plus importantes du niveau A1.' },
    ]

},

'9.2': {
  culture:{
    title:'Culture coréenne — L\'heure et la ponctualité',
    notes:[
      { title:'빨리빨리 — La culture de la vitesse', text:'빨리빨리 (vite vite) est un trait culturel coréen fort. La Corée est un des pays les plus dynamiques au monde en termes de rythme de vie. Les Coréens sont généralement ponctuels, surtout en contexte professionnel. Arriver en retard à un rendez-vous d\'affaires est très mal vu.' },
      { title:'새벽, 아침, 낮, 저녁, 밤 — les moments de la journée', text:'새벽 = aube (2h-5h), 아침 = matin (6h-10h), 낮 = milieu de journée (10h-15h), 오후 = après-midi (12h-18h), 저녁 = soirée (18h-21h), 밤 = nuit (21h+). Ces termes sont très utilisés pour préciser l\'heure dans les conversations.' },

  errors:{
    title:'Erreurs à éviter — L\'heure',
    items:[
      { wrong:'두 시 이십이 (heure avec sino)', correct:'두 시 이십이 분', expl:'Il faut TOUJOURS ajouter 분 (minutes) après le nombre de minutes ! 두 시 이십이 분 = 2h22. Omettre 분 est la faute la plus commune.' },
      { wrong:'삼 시예요 (heure avec sino)', correct:'세 시예요', expl:'Les heures utilisent les nombres NATIFS : 한(1), 두(2), 세(3), 네(4)... jusqu\'à 열두(12). Ne jamais dire 일 시, 이 시, 삼 시 pour les heures.' },
    ]
  }
},

'9.3': {
  culture:{
    title:'Culture coréenne — Le calendrier et les fêtes',
    notes:[
      { title:'설날 et 추석 — les deux grandes fêtes', text:'설날 (Nouvel An lunaire, janvier/février) et 추석 (Fête des récoltes, septembre/octobre) sont les deux fêtes nationales les plus importantes. On retourne dans la famille, on porte le 한복 (habit traditionnel), on prépare des plats traditionnels. Les transports sont saturés — pensez à réserver tôt !' },
      { title:'Le calendrier lunaire en parallèle', text:'La Corée utilise le calendrier solaire occidental pour la vie quotidienne, mais maintient un calendrier lunaire (음력) pour les fêtes traditionnelles, les anniversaires de certains aînés, et les cérémonies ancestrales (제사). Certains Coréens connaissent leur date de naissance en calendrier lunaire.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Dates et jours',
    items:[
      { wrong:'이월 이십 팔일 (lecture des dates)', correct:'이월 이십팔 일', expl:'La date se lit : mois (월) + nombre + 일 (jour). Pas d\'espace entre le nombre et 일. 28 = 이십팔, donc : 이십팔 일 (pas 이십 팔일).' },
      { wrong:'월요일에 가요 → "je vais lundi" (prochain)', correct:'Précisez : 이번 주 월요일에 가요', expl:'En coréen, 월요일에 peut référer à n\'importe quel lundi. Pour clarifier "ce lundi", dites 이번 주 월요일 (ce lundi). Pour "lundi prochain", dites 다음 주 월요일.' },
    ]
  }
},

'9.4': {
  culture:{
    title:'Culture coréenne — Faire du shopping',
    notes:[
      { title:'시장 vs 편의점 vs 백화점', text:'La Corée offre trois types de commerces omniprésents : 시장 (marché traditionnel, prix négociables, ambiance animée), 편의점 (convenience store ouvert 24h/24 — GS25, CU, 7-Eleven, partout !), 백화점 (grand magasin de luxe, prix fixes). Les prix en 시장 se négocient parfois, mais jamais en 편의점 ou 백화점.' },
      { title:'깎아 주세요 — La négociation au marché', text:'Au 시장, vous pouvez dire 깎아 주세요 (Faites-moi un prix / Réduisez un peu) ou 좀 싸게 해 주세요 (Faites un peu moins cher). Cette pratique est acceptée dans les marchés traditionnels mais absolument pas dans les grandes enseignes.' },
      { title:'카드 돼요? — Paiement par carte', text:'La Corée est une société très peu cash. Presque tout se paye par carte (카드). Il est normal de demander 카드 돼요? (On peut payer par carte ?) même pour de petits montants. Les applications de paiement mobile (카카오페이, 네이버페이) sont aussi très répandues.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Achats',
    items:[
      { wrong:'이거 얼마해요? (combien ça fait)', correct:'이게 얼마예요? / 이거 얼마예요?', expl:'얼마예요 est la formulation standard. 얼마해요 existe mais est moins courant. Les deux sont compréhensibles. La forme la plus naturelle en boutique : 이거 얼마예요? (C\'est combien ça ?).' },
      { wrong:'주세요 sans quantité ni article', correct:'[article] [quantité] 주세요', expl:'주세요 seul ne suffit pas. Il faut préciser CE QU\'on veut : 이거 주세요 (donnez-moi ça), 커피 한 잔 주세요 (un café SVP), 이거 두 개 주세요 (deux de ça SVP).' },
    ]
  }
},

'10.1': {
  culture:{
    title:'Culture coréenne — La santé et le corps',
    notes:[
      { title:'한의학 — La médecine traditionnelle coréenne', text:'La médecine traditionnelle coréenne (한의학) coexiste avec la médecine occidentale. Les cliniques de 한의원 (médecine traditionnelle) sont très fréquentées pour les douleurs chroniques, le stress, la fatigue. L\'acupuncture (침), les ventouses (부항), les herbes médicinales (한약) font partie du quotidien.' },
      { title:'아파요 — La plainte la plus utile en voyage', text:'아파요 (ça fait mal / je suis malade) + partie du corps est votre phrase de survie médicale. 머리가 아파요 (j\'ai mal à la tête), 배가 아파요 (j\'ai mal au ventre), 목이 아파요 (j\'ai mal à la gorge). En combinant ce pattern avec le vocabulaire du corps, vous pouvez communiquer n\'importe quelle douleur.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Leçon 10.1',
    items:[
      { wrong:'머리 아파요 (sans particule)', correct:'머리가 아파요', expl:'아파요 (faire mal) nécessite le sujet avec 이/가 : [partie du corps]가/이 아파요. La partie du corps est le SUJET qui "fait mal".' },
      { wrong:'아프다 → 아파요 (confusion forme base)', correct:'아프다 → 아파요 <svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg> (irrégulier ㅡ)', expl:'아프다 est un irrégulier ㅡ : on retire ㅡ et on ajoute 아요 → 아파요. C\'est déjà correct ! Mais beaucoup oublient cette règle pour d\'autres verbes en ㅡ (바쁘다→바빠요, 예쁘다→예뻐요).' },
    ]
  }
},

'10.2': {
  culture:{
    title:'Culture coréenne — La famille',
    notes:[
      { title:'Le vocabulaire familial change selon le locuteur !', text:'En coréen, les termes de parenté varient selon QUI parle : un homme appelle sa grande sœur 누나, une femme l\'appelle 언니. Un homme appelle son grand frère 형, une femme l\'appelle 오빠. Ces termes s\'utilisent aussi avec des amis proches (아, 오빠 ! = "oh, mon grand !").' },
      { title:'가족 — L\'importance de la famille dans la culture', text:'La famille (가족) est au cœur de la culture coréenne confucéenne. Les repas familiaux pour 설날 et 추석 sont sacrés. Les questions sur la famille sont courantes dès les premières conversations : 가족이 몇 명이에요? (Combien êtes-vous dans la famille ?) est une question tout à fait normale.' },
      { title:'존댓말 dans la famille', text:'La hiérarchie de langue s\'applique aussi en famille ! On parle en 존댓말 à ses parents et grands-parents, et en 반말 à ses cadets. Même les couples mariés peuvent utiliser 존댓말 par respect mutuel, surtout dans les premières années.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — La famille',
    items:[
      { wrong:'오빠 (dit par un homme à son frère aîné)', correct:'형 (homme→frère aîné)', expl:'오빠 est utilisé par les FEMMES pour s\'adresser à un frère/ami plus âgé masculin. Un homme utilise 형 pour son frère aîné. Confondre 오빠 et 형 est une erreur classique !' },
      { wrong:'언니 (dit par un homme à sa sœur aînée)', correct:'누나 (homme→sœur aînée)', expl:'언니 = sœur aînée, dit par une FEMME. Un homme dit 누나 pour sa sœur aînée. 언니 est exclusivement féminin.' },
    ]
  }
},

'11.1': {
  culture:{
    title:'Culture coréenne — Couleurs et symbolique',
    notes:[
      { title:'Les couleurs ont une symbolique forte en Corée', text:'Blanc (흰색/백색) = pureté, deuil (porter du blanc aux enterrements en Corée traditionnelle). Rouge (빨간색) = bonne chance, mais écrire un nom en rouge est un mauvais présage (associé à la mort). Bleu (파란색) = calme, confiance. En affaires, évitez de signer avec un stylo rouge !' },
      { title:'피부색 — L\'industrie de la beauté', text:'La Corée est la capitale mondiale de la cosmétique (K-beauty). Comprendre les termes de teinte et de couleur est utile dans les nombreuses boutiques de beauté (올리브영, 이니스프리, 에뛰드...). 화이트닝 (whitening), 톤업 (tone-up), 글로우 (glow) sont des termes omniprésents.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Adjectifs',
    items:[
      { wrong:'크다 → 크어요 (conjugaison ㅡ)', correct:'크다 → 커요', expl:'Irrégulier ㅡ : retirer ㅡ + 어요. 크 → 크+어요 → 크어요 → contraction → 커요. Attention : certains élèves disent 크어요 ce qui est incorrect.' },
      { wrong:'예쁘다 → 예쁘어요 (irrégulier ㅡ)', correct:'예쁘다 → 예뻐요', expl:'예쁘 → retirer ㅡ → 예쁘 + 어요 → 예쁘어요 → 예뻐요 (contraction). C\'est l\'irrégulier ㅡ : toujours vérifier si le radical se termine par ㅡ !' },
    ]
  }
},

'11.2': {
  culture:{
    title:'Culture coréenne — Au restaurant',
    notes:[
      { title:'식당 문화 — Manger ensemble en Corée', text:'En Corée, on mange ensemble (같이 먹어요 !) et on PARTAGE les plats. Le concept de 회식 (repas d\'équipe après le travail) est fondamental dans la culture professionnelle. Refuser une invitation à 회식 peut être mal perçu. Le repas est un acte social fort.' },
      { title:'여기요! — Comment appeler le serveur', text:'En Corée, on appelle le serveur avec 여기요! (ici !) ou 저기요! (là-bas !). Dans les restaurants modernes, il y a souvent un bouton sur la table. Lever la main sans parler est aussi accepté. N\'attendez pas qu\'on vienne à vous spontanément !' },
      { title:'계산서 주세요 vs 더치페이', text:'En Corée, l\'aîné (선배) ou l\'hôte paye généralement pour le groupe (한턱 = offrir à manger). C\'est une tradition forte. Mais chez les jeunes, le 더치페이 (Dutch pay = partage de l\'addition) devient courant, surtout entre amis du même âge.' },
    ]
  },
  errors:{
    title:'Erreurs à éviter — Au restaurant',
    items:[
      { wrong:'주세요 (sans préciser l\'article ou la quantité)', correct:'[plat] 주세요 ou [plat] 하나 주세요', expl:'주세요 seul n\'a pas de sens. Précisez toujours ce que vous voulez. 비빔밥 주세요 (un bibimbap SVP) ou 비빔밥 두 개 주세요 (deux bibimbap SVP).' },
      { wrong:'많이 드세요 (à un ami en 반말)', correct:'많이 먹어 (반말)', expl:'드세요 est la forme honorifique de 먹어요. À un ami ou à quelqu\'un de plus jeune en 반말, on dit simplement 많이 먹어 (mange bien !).' },
    ]
  }
},

'11.3': {
  culture:{
    title:'Méthode — Consolider le niveau A1',
    notes:[
      { title:'Révision TOPIK I — Ce que vous savez déjà', text:'Le TOPIK I (Test de coréen officiel, niveaux 1-2) teste exactement ce que vous avez appris en A1 : salutations, nombres, l\'heure, les particules de base, les verbes courants, et le vocabulaire quotidien. Si vous maîtrisez les leçons 6.1 à 11.2, vous êtes prêt(e) à tenter le TOPIK I niveau 1 !' },
      { title:'Créer des habitudes de pratique — méthode école coréenne', text:'Les écoles de langue coréenne (어학당) recommandent : 30 min de révision par jour, écouter des médias coréens (웹드라마, K-pop avec paroles), tenir un journal en coréen (일기), et parler avec des Coréens en échange linguistique (언어 교환). La constance prime sur l\'intensité.' },
    ]
  },
  errors:{
    title:'Erreurs systématiques à corriger en A1',
    items:[
      { wrong:'Utiliser le même ordre de mots qu\'en français', correct:'Respecter l\'ordre SOV du coréen', expl:'En coréen : Sujet + Objet + Verbe. JAMAIS Sujet + Verbe + Objet. 저는 밥을 먹어요 (Je riz mange) et non 저는 먹어요 밥을. Le verbe est TOUJOURS à la fin !' },
      { wrong:'Oublier les particules complètement', correct:'Prendre l\'habitude d\'ajouter les particules', expl:'En A1, même si la conversation reste compréhensible sans particules, prenez l\'habitude de les ajouter. Elles deviennent essentielles au niveau A2-B1 pour les nuances de sens.' },
    ]
  }
},

'11.4': {
  culture:{
    title:'Félicitations et prochaines étapes',
    notes:[
      { title:'Vous avez terminé le niveau A1 !', text:'축하해요! (Félicitations !) Vous connaissez maintenant les salutations, les présentations, les particules essentielles (은/는, 이/가, 을/를, 에, 에서), la conjugaison au présent, les nombres, l\'heure, et un vocabulaire de base couvrant les situations quotidiennes. C\'est une vraie fondation pour apprendre le coréen !' },
      { title:'Niveau A2 — Ce qui vous attend', text:'En A2, vous apprendrez : le passé (-았/었어요), le futur (-을 거예요), les propositions relatives (~는/은/을 + nom), plus de particules (한테, 부터, 까지, 만...), et des verbes irréguliers. La progression est naturelle depuis l\'A1. Continuez avec Korean Stories !' },
    ]

  errors:{
    title:'Les 5 règles d\'or à retenir du niveau A1',

      { wrong:'Oublier que le verbe va toujours EN FIN', correct:'[Sujet] + [Compléments] + [Verbe]', expl:'C\'est LA règle n°1 du coréen. Le verbe termine TOUJOURS la phrase. Internalisez cette structure dès maintenant.' },
      { wrong:'Confondre sino-coréen et natif pour les heures/âge', correct:'Heure = natif (한,두,세...) / Minutes = sino (일,이,삼...)', expl:'Heure → nombres natifs (한 시, 두 시). Minutes → sino-coréens (십오 분, 삼십 분). Âge (conversation) → natifs (스물다섯 살).' },

  /* ══ Unité 12 ══ */
  '12.1':{
    culture:{ title:'날씨 en Corée — Phénomènes uniques', items:[
      { ko:'황사 (hwang-sa)', fr:'Tempête de sable jaune — nuages de poussière qui viennent de Chine au printemps. Les Coréens portent des masques. Écoute souvent sur les infos : 오늘 황사가 심해요 !' },
      { ko:'장마 (jang-ma)', fr:'La saison des pluies — de fin juin à fin juillet. Il peut pleuvoir sans interruption pendant des jours. Expression connue : 장마철이에요 (c\'est la saison des pluies).' },
    ]},
    errors:{ title:'Erreurs fréquentes — Météo', items:[
      { wrong:'비가 떨어요 (×)', correct:'비가 와요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'La pluie "vient" (오다) en coréen, elle ne "tombe" pas. Idem pour la neige : 눈이 와요.' },
      { wrong:'오늘 날씨 어떻게? (×)', correct:'오늘 날씨가 어때요? (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'Pour demander comment est quelque chose, on utilise 어때요? (어떻다), pas 어떻게 (qui signifie "comment faire quelque chose").' },
    ]}
  },
  '12.2':{
    culture:{ title:'Les saisons coréennes — Ce qu\'il faut savoir', items:[
      { ko:'봄꽃 축제 (Festival des fleurs de printemps)', fr:'Les 벚꽃 (fleurs de cerisier) attirent des millions de personnes en mars-avril. Le plus célèbre : le festival de Yeouido à Séoul. Les Coréens font des pique-niques sous les cerisiers (꽃놀이).' },
      { ko:'패딩 (padding = doudoune)', fr:'En hiver coréen, la doudoune est absolument obligatoire ! La Corée a une vraie "culture패딩" — les grandes marques comme 노스페이스 (The North Face) sont ultra populaires.' },
    ]},
    errors:{ title:'Erreurs fréquentes — Saisons', items:[
      { wrong:'봄에 따뜻다 (×)', correct:'봄에는 따뜻해요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'Les adjectifs coréens se conjuguent ! 따뜻하다 → 따뜻해요 (présent poli). Le topic 는 après 에 marque un contraste : "En ce qui concerne le printemps, il fait doux."' },
      { wrong:'여름이에요 더워요 (×)', correct:'여름에는 더워요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'Pour dire "en [saison] il fait X", on utilise [saison] + 에는 + adjectif. Le 에는 indique le moment/contexte.' },
    ]}
  },
  /* ══ Unité 13 ══ */
  '13.1':{
    culture:{ title:'위치 — La notion d\'espace en coréen', items:[
      { ko:'안 vs 속', fr:'안 signifie "à l\'intérieur d\'un espace défini". 속 (sok) indique "au cœur de" ou "dans" pour des choses moins concrètes (속마음 = le fond du cœur). Pour les objets physiques, utilisez 안 en A1.' },
      { ko:'여기 / 거기 / 저기', fr:'Système à 3 niveaux : 여기 (ici, près de moi), 거기 (là, près de toi), 저기 (là-bas, loin des deux). Similaire à ce/cet/ce... là-bas en français mais plus systématique.' },
    ]},
    errors:{ title:'Erreurs fréquentes — Positions', items:[
      { wrong:'책은 책상 위 있어요 (×)', correct:'책이 책상 위에 있어요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'La particule 에 est indispensable après la position : 위에, 아래에, 앞에, 뒤에, 옆에. Sans 에, la phrase est incomplète.' },
      { wrong:'어디 있어요? (incomplet)', correct:'화장실이 어디에 있어요? (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'Il faut préciser QUOI on cherche avec le sujet + 이/가 + 어디에 있어요?. La question simple 어디 있어요? est compréhensible mais incorrecte formellement.' },
    ]}
  },
  '13.2':{
    culture:{ title:'있어요 — Un verbe, trois usages clés', items:[
      { ko:'있어요 = être là / avoir / il y a', fr:'있어요 est l\'un des verbes les plus polyvalents du coréen. Contrairement au français, un seul verbe couvre "il y a", "j\'ai" et "être quelque part". Maîtrise-le et tu couvres une immense partie du quotidien !' },
    ]},
    errors:{ title:'Erreurs fréquentes — 있어요/없어요', items:[
      { wrong:'저는 친구가 이에요 (×)', correct:'저는 친구가 있어요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'Pour dire "j\'ai un ami", on utilise 있어요, pas 이에요 (이에요 = être, copule). 저는 친구가 있어요 = J\'ai un ami.' },
      { wrong:'가방이 아니에요 (× pour dire "je n\'ai pas de sac")', correct:'가방이 없어요 (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'아니에요 = ce n\'est pas X. 없어요 = ça n\'existe pas / je n\'ai pas. Pour la négation de possession ou d\'existence → 없어요.' },
    ]}
  },
  /* ══ Unité 14 ══ */
  '14.1':{
    culture:{ title:'La maison coréenne — Traditions uniques', items:[
      { ko:'신발을 벗으세요 (Enlevez vos chaussures)', fr:'C\'est une règle absolue dans toutes les maisons coréennes ! La zone 현관 (entrée) marque la séparation entre l\'intérieur et l\'extérieur. Enlever ses chaussures est un signe de respect et de propreté.' },
      { ko:'온돌 (Ondol) — Chauffage par le sol', fr:'Unique à la Corée, l\'ondol chauffe le sol par en-dessous. Conséquence : les Coréens s\'assoient souvent par terre sur des coussins (방석), mangent sur de petites tables basses, et dorment sur des matelas fins (요/이불) posés au sol.' },
    ]},
    errors:{ title:'Erreurs fréquentes — Maison', items:[
      { wrong:'화장실 = salle de bain uniquement (×)', correct:'화장실 = toilettes ET salle de bain (<svg viewBox="0 0 24 24" style="width:12px;height:12px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><polyline points="20 6 9 17 4 12"/></svg>)', expl:'화장실 signifie les deux en coréen. Pour distinguer : 욕실 (salle de bain avec baignoire/douche), 화장실 (toilettes). Dans un appartement, souvent combinés.' },
    ]}
  },
  '14.2':{
    culture:{ title:'La vie quotidienne coréenne', items:[
