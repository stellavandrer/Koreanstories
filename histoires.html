<!DOCTYPE html>
<html lang="fr">
<head>
  <script>try{if(localStorage.getItem("ks_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0F1B2D"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Korean Stories"/>
  <link rel="apple-touch-icon" href="Logo/Logo - KoreanStories_logo_4x4_bleu.png"/>
  <title>Histoires · Korean Stories</title>
  <meta name="description" content="Parcours d'histoires Korean Stories — Mina et Joon à Séoul. Lis, écoute, mémorise."/>
  <meta property="og:title" content="Histoires · Korean Stories"/>
  <meta property="og:description" content="Lis de vrais dialogues coréens avec Mina et Joon. Chaque histoire t'apporte de nouveaux mots et expressions."/>
  <meta property="og:type" content="website"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:#F0F4F8;color:#0F1B2D;min-height:100svh;padding-bottom:88px;overflow-x:hidden}
    :root{
      --navy:#0F1B2D;--navy2:#1a2f4a;
      --gold:#C9A96E;--gold2:#E8D5B0;--goldp:rgba(201,169,110,0.10);
      --white:#F7F8FA;--pure:#FFFFFF;--bg:#F0F4F8;
      --gray:#8A9BB0;--border:#E2E8F0;
      --green:#22c55e;--red:#ef4444;
      --purple:#A78BFA;--amber:#F59E0B;
    }

    /* ── TOP BAR ── */
    .topbar{position:sticky;top:0;z-index:100;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:var(--navy)}
    .back{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;border:1.5px solid rgba(255,255,255,.12);background:none;cursor:pointer;text-decoration:none;font-size:12px;font-weight:600;color:rgba(247,248,250,.55);transition:all .2s}
    .back:hover{border-color:var(--gold);color:var(--gold)}
    .back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
    .tb-title{font-family:'Playfair Display',serif;font-size:15px;color:white;font-style:italic}
    .xp-pill{display:flex;align-items:center;gap:5px;background:rgba(201,169,110,.12);border:1px solid rgba(201,169,110,.2);border-radius:100px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--gold)}

    /* ── HERO PROGRESS BAND ── */
    .hero-band{background:var(--navy);padding:20px 20px 28px;position:relative;overflow:hidden}
    .hero-band::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:28px;background:var(--bg);border-radius:28px 28px 0 0}
    .hb-inner{max-width:560px;margin:0 auto}
    .hb-title{font-family:'Playfair Display',serif;font-size:22px;color:white;margin-bottom:4px;line-height:1.2}
    .hb-title em{color:var(--gold);font-style:italic}
    .hb-sub{font-size:12px;color:rgba(247,248,250,.4);margin-bottom:16px}
    .progress-track{background:rgba(255,255,255,.08);border-radius:100px;height:10px;overflow:hidden;margin-bottom:10px}
    .progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--gold),#e8c97b);transition:width .8s cubic-bezier(.4,0,.2,1)}
    .hb-stats{display:flex;gap:20px}
    .hb-stat{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(247,248,250,.5)}
    .hb-stat strong{color:white;font-size:13px}
    .hb-stat-dot{width:8px;height:8px;border-radius:50%}

    /* ── ROADMAP CONTAINER ── */
    .roadmap{max-width:480px;margin:0 auto;padding:24px 20px 20px;position:relative}

    /* ── PATH LINE ── */
    .path-line{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:4px;
      border-radius:2px;
      top:24px;
      z-index:0;
    }

    /* ── STORY NODE ── */
    .snode{
      position:relative;
      z-index:1;
      margin-bottom:0;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    /* Connector between nodes */
    .connector{
      width:4px;
      min-height:28px;
      margin:0 auto;
      border-radius:2px;
      position:relative;
      z-index:0;
    }
    .connector.done{background:var(--green)}
    .connector.active{background:linear-gradient(to bottom,var(--green),rgba(201,169,110,.3))}
    .connector.locked{background:var(--border);background:repeating-linear-gradient(to bottom,var(--border) 0,var(--border) 6px,transparent 6px,transparent 12px)}

    /* Node bubble */
    .node-bubble{
      width:80px;height:80px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:32px;cursor:pointer;
      position:relative;transition:transform .2s;
      text-decoration:none;
      flex-shrink:0;
    }
    .node-bubble.state-done{
      background:linear-gradient(135deg,#16a34a,#15803d);
      border:3px solid rgba(34,197,94,.5);
      box-shadow:0 6px 20px rgba(34,197,94,.3);
      color:#fff;
    }
    .node-bubble.state-done::after{
      content:'✓';
      position:absolute;bottom:-4px;right:-4px;
      width:22px;height:22px;border-radius:50%;
      background:#16a34a;border:2px solid white;
      font-size:11px;color:white;font-weight:700;
      display:flex;align-items:center;justify-content:center;
      line-height:1;
    }
    .node-bubble.state-active{
      background:linear-gradient(135deg,#d4a754,var(--gold));
      border:3px solid rgba(201,169,110,.6);
      box-shadow:0 6px 28px rgba(201,169,110,.45);
      animation:pulseNode 2.5s ease-in-out infinite;
      color:#fff;
    }
    .node-bubble.state-locked{
      background:var(--pure);
      border:2.5px dashed var(--border);
      opacity:.55;
      cursor:default;
      filter:grayscale(.6);
    }
    .node-bubble.state-soon{
      background:var(--pure);
      border:2px dashed var(--border);
      opacity:.4;
      cursor:default;
    }
    .node-bubble:not(.state-locked):not(.state-soon):hover{transform:scale(1.08)}

    @keyframes pulseNode{
      0%,100%{box-shadow:0 6px 28px rgba(201,169,110,.45)}
      50%{box-shadow:0 6px 36px rgba(201,169,110,.7),0 0 0 8px rgba(201,169,110,.1)}
    }

    /* Node label */
    .node-label{
      margin-top:10px;text-align:center;
      max-width:200px;margin-bottom:6px;
    }
    .node-num{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin-bottom:2px}
    .node-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;line-height:1.2}
    .node-kr{font-size:12px;color:var(--gray)}
    .node-status-badge{
      display:inline-flex;align-items:center;gap:4px;
      border-radius:100px;padding:3px 10px;font-size:10px;font-weight:700;
      margin-top:4px;
    }
    .node-status-badge.done{background:rgba(34,197,94,.1);color:#15803d}
    .node-status-badge.active{background:rgba(201,169,110,.15);color:#92691e}
    .node-status-badge.locked{background:var(--border);color:var(--gray)}
    .node-status-badge.soon{background:rgba(167,139,250,.1);color:#7c3aed}

    /* Active CTA card */
    .active-cta{
      width:100%;max-width:320px;
      background:var(--navy);border-radius:20px;
      padding:16px 18px;margin-top:12px;margin-bottom:4px;
      text-decoration:none;display:block;transition:transform .2s,box-shadow .2s;
      border:1.5px solid rgba(201,169,110,.2);
    }
    .active-cta:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(15,27,45,.2)}
    .active-cta-setting{font-size:11px;color:rgba(247,248,250,.4);margin-bottom:8px}
    .active-cta-words{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
    .active-word{background:rgba(201,169,110,.12);border:1px solid rgba(201,169,110,.2);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--gold2)}
    .active-cta-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--navy);border-radius:12px;padding:12px;font-size:14px;font-weight:700}
    .active-cta-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

    /* Done card (mini) */
    .done-mini{
      width:100%;max-width:320px;
      background:var(--pure);border:1.5px solid rgba(34,197,94,.2);
      border-radius:16px;padding:12px 16px;margin-top:10px;margin-bottom:4px;
      text-decoration:none;display:flex;align-items:center;gap:12px;
      transition:all .2s;
    }
    .done-mini:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(34,197,94,.12)}
    .done-mini-info{flex:1}
    .done-mini-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:2px}
    .done-mini-sub{font-size:11px;color:var(--gray)}
    .done-mini-arr{color:var(--green)}
    .done-mini-arr svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}

    /* Locked hint */
    .locked-hint{
      width:100%;max-width:320px;
      background:var(--pure);border:1.5px dashed var(--border);
      border-radius:14px;padding:10px 14px;margin-top:8px;margin-bottom:4px;
      font-size:11px;color:var(--gray);text-align:center;opacity:.65;
    }

    /* Soon card */
    .soon-card{
      width:100%;max-width:320px;
      background:rgba(167,139,250,.05);border:1.5px dashed rgba(167,139,250,.3);
      border-radius:16px;padding:12px 16px;margin-top:10px;margin-bottom:4px;text-align:center;
    }
    .soon-card-t{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:4px}
    .soon-card-s{font-size:11px;color:var(--gray)}

    /* ── VOCAB SECTION ── */
    .section{max-width:480px;margin:0 auto;padding:0 20px 20px}
    .sec-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
    .vocab-prev{background:var(--pure);border:1.5px solid var(--border);border-radius:20px;padding:16px}
    .vocab-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .vpill{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;transition:all .2s}
    .vpill:hover{border-color:var(--gold);background:var(--goldp);transform:translateY(-1px)}
    .vpill.played{border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.05)}
    .vpill-kr{font-size:17px;font-weight:300;color:var(--navy);margin-bottom:2px}
    .vpill-fr{font-size:10px;color:var(--gray);font-weight:600}

    /* ── LOCKED SECTION ── */
    .locked-section{background:var(--pure);border:1.5px dashed var(--border);border-radius:20px;padding:24px;text-align:center;margin-bottom:24px}
    .locked-section h3{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px}
    .locked-section p{font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:16px}
    .locked-section a{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:var(--gold);border-radius:100px;padding:10px 22px;font-size:13px;font-weight:700;text-decoration:none;transition:all .2s}
    .locked-section a:hover{background:var(--navy2)}

    /* ── BOTTOM NAV ── */
    .bnav{position:fixed;bottom:0;left:0;right:0;z-index:90;height:64px;background:var(--pure);border-top:1px solid var(--border);display:flex;align-items:stretch}
    .bni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--gray);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;transition:color .15s;padding:6px 0}
    .bni svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
    .bni.act,.bni:hover{color:var(--navy)}
    .bni.act svg{stroke:var(--gold)}
  
    
  
    /* ═══════════════════════════════════════════════════════════
       DARK MODE — GLOBAL SYSTEM
       Tous les composants adaptatifs pour le mode sombre
    ═══════════════════════════════════════════════════════════ */
    [data-theme="dark"]{
      --pure:#1e3352;
      --white:#162844;
      --border:rgba(255,255,255,.13);
      --gray:#7a9ab8;
      color-scheme:dark;
    }
    [data-theme="dark"] body{
      background:#0f1e32!important;
      color:#d8e8f5;
    }
    /* ── navigation ── */
    [data-theme="dark"] .bnav,
    [data-theme="dark"] .bnav-wrap{
      background:#0a1628!important;
      border-top-color:rgba(255,255,255,.10)!important;
    }
    [data-theme="dark"] .bni{color:rgba(200,220,240,.38)!important}
    [data-theme="dark"] .bni svg{stroke:rgba(200,220,240,.38)!important}
    [data-theme="dark"] .bni.act{color:#C9A96E!important}
    [data-theme="dark"] .bni.act svg{stroke:#C9A96E!important}
    [data-theme="dark"] .bni span{color:inherit!important}
    /* ── cards génériques ── */
    [data-theme="dark"] .scard,
    [data-theme="dark"] .card,
    [data-theme="dark"] .ex-card,
    [data-theme="dark"] .qz-card,
    [data-theme="dark"] .quiz-card,
    [data-theme="dark"] .result-card,
    [data-theme="dark"] .vocab-prev,
    [data-theme="dark"] .flip-front{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.12)!important;
    }
    [data-theme="dark"] .scard-name,
    [data-theme="dark"] .scard-kr,
    [data-theme="dark"] .card-kr{color:#d8e8f5!important}
    [data-theme="dark"] .scard-pct{color:rgba(200,220,240,.45)!important}
    /* ── leçon — choice buttons ── */
    [data-theme="dark"] .ch{
      background:#1e3352!important;
      border:1.5px solid rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .ch:hover:not(:disabled){
      border-color:#C9A96E!important;
      background:rgba(201,169,110,.12)!important;
    }
    [data-theme="dark"] .ch.ok{
      border-color:#4ade80!important;
      background:rgba(34,197,94,.12)!important;
      color:#4ade80!important;
    }
    [data-theme="dark"] .ch.ko{
      border-color:#f87171!important;
      background:rgba(239,68,68,.12)!important;
      color:#f87171!important;
    }
    /* ── leçon — keyboard keys ── */
    [data-theme="dark"] .kbkey{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .kbkey .kk{color:#d8e8f5!important}
    [data-theme="dark"] .kbkey .kr{color:rgba(200,220,240,.45)!important}
    [data-theme="dark"] .kbrow{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.12)!important;
    }
    [data-theme="dark"] .kb-target{
      background:#162844!important;
      border-color:rgba(255,255,255,.14)!important;
    }
    [data-theme="dark"] .tw-blank{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    /* ── leçon — UI text ── */
    [data-theme="dark"] .q-prompt{color:#d8e8f5!important}
    [data-theme="dark"] .q-big{
      color:#d8e8f5!important;
      border-color:rgba(255,255,255,.12)!important;
      background:#1e3352!important;
    }
    [data-theme="dark"] .q-cnt{color:rgba(200,220,240,.4)!important}
    [data-theme="dark"] .q-hint{color:rgba(200,220,240,.35)!important}
    [data-theme="dark"] .fb{color:rgba(200,220,240,.55)}
    [data-theme="dark"] .fb.ok{color:#4ade80!important}
    [data-theme="dark"] .fb.ko{color:#f87171!important}
    [data-theme="dark"] .wrap{background:#0f1e32!important}
    [data-theme="dark"] .mhdr{background:#0a1628!important}
    [data-theme="dark"] .tbar{
      background:#0a1628!important;
      border-color:rgba(255,255,255,.08)!important;
    }
    [data-theme="dark"] .ptrack{background:rgba(255,255,255,.1)!important}
    [data-theme="dark"] .mnm{color:rgba(215,232,248,.9)!important}
    [data-theme="dark"] .msay{color:rgba(200,220,240,.6)!important}
    [data-theme="dark"] .res-msg{color:#d8e8f5!important}
    [data-theme="dark"] .res-sec{
      border-color:rgba(255,255,255,.15)!important;
      color:rgba(200,220,240,.65)!important;
    }
    /* ── exercice.html ── */
    [data-theme="dark"] .mtab{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.15)!important;
      color:rgba(200,220,240,.65)!important;
    }
    [data-theme="dark"] .mtab.act{
      background:#C9A96E!important;
      border-color:#C9A96E!important;
      color:#0f1e32!important;
    }
    [data-theme="dark"] .word-token{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .word-token.placed{
      background:#C9A96E!important;
      border-color:#C9A96E!important;
      color:#0f1e32!important;
    }
    [data-theme="dark"] .wb-target{
      background:rgba(255,255,255,.03)!important;
      border-color:rgba(255,255,255,.14)!important;
    }
    [data-theme="dark"] .pair-token{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .pair-token.selected{
      background:#C9A96E!important;
      border-color:#C9A96E!important;
      color:#0f1e32!important;
    }
    [data-theme="dark"] .lc-btn{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .sc-btn{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .sc-score-n{color:#d8e8f5!important}
    [data-theme="dark"] .sc-start-title{color:#d8e8f5!important}
    [data-theme="dark"] .sc-start-sub{color:rgba(200,220,240,.5)!important}
    [data-theme="dark"] .fb-strip.ok{
      background:rgba(34,197,94,.1)!important;
      border-color:rgba(34,197,94,.25)!important;
      color:#4ade80!important;
    }
    [data-theme="dark"] .fb-strip.ko{
      background:rgba(239,68,68,.08)!important;
      border-color:rgba(239,68,68,.2)!important;
      color:#f87171!important;
    }
    [data-theme="dark"] .next-btn{
      background:#1e3352!important;
      border:1.5px solid rgba(255,255,255,.15)!important;
      color:#d8e8f5!important;
    }
    /* ── révision ── */
    [data-theme="dark"] .ans-btn{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.18)!important;
      color:#d8e8f5!important;
    }
    [data-theme="dark"] .ans-btn.correct{
      background:rgba(34,197,94,.1)!important;
      border-color:#4ade80!important;
      color:#4ade80!important;
    }
    [data-theme="dark"] .ans-btn.wrong{
      background:rgba(239,68,68,.1)!important;
      border-color:#f87171!important;
      color:#f87171!important;
    }
    [data-theme="dark"] .qz-card,
    [data-theme="dark"] .qz-card-inner{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.12)!important;
    }
    [data-theme="dark"] .qz-feedback.ok{color:#4ade80!important}
    [data-theme="dark"] .qz-feedback.ko{color:#f87171!important}
    /* ── vocabulaire ── */
    [data-theme="dark"] .flip-front{background:#1e3352!important;border-color:rgba(255,255,255,.12)!important}
    [data-theme="dark"] .card-kr{color:#d8e8f5!important}
    [data-theme="dark"] .filters{
      background:#0f1e32!important;
      border-color:rgba(255,255,255,.08)!important;
    }
    [data-theme="dark"] .fchip{
      background:#1e3352!important;
      border-color:rgba(255,255,255,.13)!important;
      color:rgba(200,220,240,.65)!important;
    }
    [data-theme="dark"] .fchip.act{
      background:#C9A96E!important;
      border-color:#C9A96E!important;
      color:#0f1e32!important;
    }
    /* ── histoires ── */
    [data-theme="dark"] .node-title{color:#d8e8f5!important}

    else if(state==='soon') badgeText = 'Bientôt';
    else badgeText = ' Verrouillée';
    html += `<div class="node-status-badge ${state}">${badgeText}</div>`;
    html += `</div>`;// /node-label

    // Extra card below label
    if(state === 'done') {
      html += `<a href="${s.href}" class="done-mini">
        <div style="width:36px;height:36px;border-radius:50%;background:rgba(34,197,94,.15);display:flex;align-items:center;justify-content:center;color:#16a34a;flex-shrink:0">${STORY_ICONS[s.id] ? STORY_ICONS[s.id].replace('style="width:36px;height:36px"','style="width:20px;height:20px"') : (s.storyN||'?')}</div>
        <div class="done-mini-info">
          <div class="done-mini-title">${s.setting}</div>
          <div class="done-mini-sub">${s.words.length} mots · Relire</div>
        </div>
        <div class="done-mini-arr"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></div>
      </a>`;
    } else if(state === 'active') {
      const wordPills = s.words.slice(0,5).map(w => `<span class="active-word">${w.kr}</span>`).join('');
      html += `<a href="${s.href}" class="active-cta">
        <div class="active-cta-setting">${s.setting}</div>
        <div class="active-cta-words">${wordPills}${s.words.length>5?`<span class="active-word">+${s.words.length-5}</span>`:''}</div>
        <div class="active-cta-btn">
          Lire l'histoire
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
        </div>
      </a>`;
    } else if(state === 'locked') {
      const prevStory = STORIES[i-1];
      html += `<div class="locked-hint"> Termine ${prevStory ? prevStory.titleFr : 'l\'histoire précédente'} pour débloquer</div>`;
    } else if(state === 'soon') {
      html += `<div class="soon-card">
        <div class="soon-card-t">Histoire 5 — bientôt disponible</div>
        <div style="margin:8px 0;display:flex;justify-content:center;color:rgba(167,139,250,.7)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><rect x="4" y="2" width="16" height="17" rx="2"/><path d="M9 2v5"/><path d="M15 2v5"/><path d="M4 12h16"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/><path d="M7 21l2-4"/><path d="M17 21l-2-4"/></svg></div>
        <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px">지하철에서 — Dans le métro</div>
        <div style="font-size:11px;color:var(--gray);line-height:1.6;margin-bottom:12px">Mina rate son métro… et rencontre quelqu'un d'inattendu. 8 nouveaux mots, des tournures naturelles et des situations de la vie réelle.</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px">
          <span style="background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#7c3aed">지하철 (métro)</span>
          <span style="background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#7c3aed">늦어요 (je suis en retard)</span>
          <span style="background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;color:#7c3aed">몇 호선 ? (quelle ligne ?)</span>
        </div>
        <div style="font-size:10px;color:rgba(167,139,250,.7);font-weight:600;letter-spacing:.05em">Prochainement — reviens vite !</div>
      </div>`;
    }

    html += `</div>`; // /snode

    // Connector to next
    if(!isLast) {
      const nextState = getState(STORIES[i+1]);
      let connClass = 'locked';
      if(state === 'done') connClass = nextState === 'done' ? 'done' : 'active';
      html += `<div class="connector ${connClass}" style="height:36px"></div>`;
    }
  });

  roadmap.innerHTML = html;
}

buildRoadmap();

// Stats
const storiesDone = STORIES.filter(s => s.key && ls(s.key) === 'done').length;
const storiesTotal = STORIES.filter(s => !s.soon).length;
const xpStories = storiesDone * 30;
const pct = Math.round(storiesDone / storiesTotal * 100);
document.getElementById('progressFill').style.width = pct + '%';
document.getElementById('statDone').textContent = storiesDone;
document.getElementById('statTotal').textContent = storiesTotal;
document.getElementById('statXP').textContent = xpStories;

if(allLecsDone) {
  if(storiesDone === 0) document.getElementById('hbSub').textContent = 'Commence par l\'Histoire 1 — Bonjour !';
  else if(storiesDone === storiesTotal) document.getElementById('hbSub').textContent = 'Bravo ! Tu as lu toutes les histoires disponibles !';
  else document.getElementById('hbSub').textContent = `${storiesDone} lue(s) · Continue sur l'Histoire ${storiesDone+1} !`;
}

// Vocab pills
const ALL_WORDS = [];
STORIES.forEach(s => {
  if(s.key && ls(s.key) === 'done') s.words.forEach(w => ALL_WORDS.push(w));
});

const vocabSection = document.getElementById('vocabSection');
const pillsEl = document.getElementById('vocabPills');
if(ALL_WORDS.length > 0) {
  vocabSection.style.display = 'block';
  pillsEl.innerHTML = ALL_WORDS.map((w,i) =>
    `<div class="vpill" id="vp${i}" onclick="speakPill(this,'${w.kr}')">
      <div class="vpill-kr">${w.kr}</div>
      <div class="vpill-fr">${w.fr}</div>
    </div>`
  ).join('');
}

function speakPill(el, text) {
  document.querySelectorAll('.vpill').forEach(p => p.classList.remove('played'));
  el.classList.add('played');
  speak(text);
}
</script>
